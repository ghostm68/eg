<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>v/TMURA · Permutation Matrix // Wordstar Nexus</title>
  <style>
    :root {
      --red: #ff0033;
      --red-dim: rgba(255, 0, 51, 0.15);
      --black: #09090b;
      --grey-dark: #111114;
      --grey-panel: #141418;
      --grey-mid: #1f1f26;
      --border: #2c2c34;
      --white: #ededf2;
      --muted: #727280;
      --ok: #ffff00;
      --ok-bg: rgba(255, 255, 0, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    ::selection {
      background: var(--red);
      color: #000;
    }

    body {
      font-family: "SF Mono", "Fira Code", "Consolas", "Courier New", monospace;
      background: var(--black);
      color: var(--white);
      height: 100vh;
      display: flex;
      flex-direction: column;
      font-size: 11px;
      line-height: 1.35;
      overflow: hidden;
    }

    .app-titlebar {
      background: var(--grey-dark);
      border-bottom: 1px solid var(--border);
      padding: 0.35rem 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
      flex-wrap: wrap;
      gap: 0.4rem;
    }
    .app-title {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--red);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .app-title span {
      color: var(--muted);
      font-weight: normal;
      font-size: 0.65rem;
    }

    .app-toolbar {
      background: var(--grey-panel);
      border-bottom: 1px solid var(--border);
      padding: 0.35rem 0.65rem;
      display: flex;
      gap: 0.4rem;
      align-items: center;
      flex-wrap: wrap;
    }
    .tool-btn {
      background: var(--grey-dark);
      border: 1px solid var(--border);
      color: var(--white);
      padding: 0.25rem 0.5rem;
      font-size: 0.65rem;
      cursor: pointer;
      border-radius: 2px;
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      transition: all 0.12s;
    }
    .tool-btn:hover {
      border-color: var(--red);
      color: var(--red);
    }
    .tool-btn.active {
      background: var(--red);
      border-color: var(--red);
      color: #000;
      font-weight: 700;
    }

    .mode-switch {
      display: flex;
      border: 1px solid var(--border);
      overflow: hidden;
      border-radius: 2px;
    }
    .mode-switch button {
      border: none;
      border-radius: 0;
      padding: 0.25rem 0.6rem;
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      background: var(--grey-dark);
      color: var(--muted);
      cursor: pointer;
    }
    .mode-switch button.active {
      background: var(--red);
      color: #000;
      font-weight: 700;
    }

    select.tool-select {
      background: var(--grey-dark);
      border: 1px solid var(--border);
      color: var(--white);
      padding: 0.2rem 0.4rem;
      font-size: 0.65rem;
      border-radius: 2px;
    }
    select.tool-select:focus { outline: none; border-color: var(--red); }

    .app-grid {
      flex: 1;
      display: grid;
      grid-template-columns: 320px 105px 1fr;
      overflow: hidden;
      background: var(--border);
      gap: 1px;
    }

    /* LEFT */
    .left-col {
      background: var(--grey-panel);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .pane-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 110px;
    }
    .pane-meta {
      background: var(--grey-dark);
      padding: 0.3rem 0.6rem;
      font-size: 0.65rem;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .pane-meta strong { color: var(--white); }
    .pane-textarea {
      flex: 1;
      background: var(--black);
      color: var(--white);
      border: none;
      padding: 0.6rem;
      font: inherit;
      font-size: 0.85rem;
      line-height: 1.5;
      resize: none;
    }
    .pane-textarea:focus { outline: none; }

    .bottom-status-strip {
      background: var(--grey-dark);
      border-top: 1px solid var(--border);
      padding: 0.4rem 0.6rem;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.65rem;
    }
    .gauge-wrapper {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.62rem;
      color: var(--muted);
    }
    .vowel-gauge {
      flex: 1;
      height: 8px;
      background: #000;
      border: 1px solid var(--border);
      position: relative;
    }
    .vowel-gauge-target {
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 2px;
      background: #555;
      z-index: 2;
    }
    .vowel-gauge-fill {
      height: 100%;
      background: var(--ok);
      width: 0%;
      transition: width 0.15s, background 0.15s;
    }
    .vowel-gauge-fill.danger { background: var(--red); }

    /* CENTER */
    .center-col {
      background: var(--grey-panel);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-right: 1px solid var(--border);
    }
    .ladder-stream {
      flex: 1;
      overflow-y: auto;
      padding: 0.3rem 0;
      display: flex;
      flex-direction: column;
    }
    .ladder-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.18rem 0.5rem;
      font-size: 0.72rem;
      font-weight: bold;
      user-select: none;
      line-height: 1;
    }
    .ladder-row.divider {
      border-top: 1px solid var(--border);
      margin: 0.25rem 0;
      padding: 0;
    }
    .ladder-row.depleted { opacity: 0.18; }
    .ladder-row .glyph { color: var(--white); }
    .ladder-row.vowel .glyph { color: var(--red); }
    .ladder-row .tally { color: var(--ok); font-size: 0.65rem; }
    .ladder-row .count { color: var(--muted); font-size: 0.6rem; margin-left: 0.2rem; }

    .ladder-filters {
      background: var(--grey-dark);
      border-top: 1px solid var(--border);
      padding: 0.4rem 0.35rem;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .filter-input-row {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      font-size: 0.65rem;
      color: var(--muted);
    }
    .filter-input-row input {
      flex: 1;
      background: #000;
      border: 1px solid var(--border);
      color: #fff;
      font: inherit;
      font-size: 0.65rem;
      padding: 0.15rem 0.3rem;
      border-radius: 1px;
    }
    .filter-input-row input:focus { outline: none; border-color: var(--red); }

    /* RIGHT: WORDS & SENTENCES WORKSPACE */
    .right-col {
      background: var(--black);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Words Matrix View */
    .matrix-body {
      flex: 1;
      display: flex;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 0.3rem 0;
      scroll-snap-type: x proximity;
    }
    .length-col {
      min-width: 95px;
      max-width: 125px;
      flex: 1;
      border-right: 1px solid #1a1a20;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      scroll-snap-align: start;
    }
    .col-header {
      padding: 0.3rem 0.5rem;
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--muted);
      border-bottom: 1px solid #1a1a20;
      text-align: center;
      background: var(--grey-panel);
    }
    .col-words {
      flex: 1;
      overflow-y: auto;
      padding: 0.2rem 0.3rem;
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }
    .col-words::-webkit-scrollbar { width: 3px; }
    .col-words::-webkit-scrollbar-thumb { background: #222; }

    .matrix-word {
      color: var(--white);
      cursor: pointer;
      padding: 0.15rem 0.3rem;
      border-radius: 1px;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
      transition: all 0.1s;
    }
    .matrix-word:hover {
      background: var(--red);
      color: #000;
      font-weight: bold;
    }

    /* Sentences Mode View */
    .sentence-subbar {
      background: var(--grey-panel);
      border-bottom: 1px solid var(--border);
      padding: 0.35rem 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.65rem;
      flex-wrap: wrap;
    }
    .sentences-stream {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 0.4rem;
      align-content: start;
    }
    .sentence-card {
      background: var(--grey-dark);
      border: 1px solid var(--border);
      padding: 0.45rem 0.6rem;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.4rem;
      border-left: 2px solid transparent;
      transition: all 0.12s;
    }
    .sentence-card:hover {
      border-left-color: var(--red);
      background: var(--grey-mid);
      transform: translateX(2px);
    }
    .sentence-card.exact {
      border-left-color: var(--ok);
      background: rgba(255, 255, 0, 0.03);
    }
    .sentence-text {
      font-weight: 600;
      color: var(--white);
      letter-spacing: 0.02em;
    }
    .sentence-badge {
      font-size: 0.6rem;
      padding: 0.1rem 0.35rem;
      border-radius: 2px;
      background: var(--grey-mid);
      color: var(--muted);
      white-space: nowrap;
    }
    .sentence-badge.exact {
      color: var(--ok);
      background: var(--ok-bg);
      border: 1px solid rgba(255, 255, 0, 0.4);
    }

    @media (max-width: 820px) {
      body { height: auto; min-height: 100vh; overflow-y: auto; }
      .app-grid {
        grid-template-columns: 1fr;
        height: auto;
        overflow: visible;
      }
      .left-col { height: auto; }
      .pane-textarea { min-height: 90px; }
      
      .center-col {
        border-right: none;
        border-bottom: 1px solid var(--border);
      }
      .ladder-stream {
        flex-direction: row;
        overflow-x: auto;
        padding: 0.4rem;
        gap: 0.5rem;
      }
      .ladder-row {
        flex-direction: column;
        padding: 0.2rem 0.4rem;
        background: var(--grey-dark);
        border: 1px solid var(--border);
        border-radius: 2px;
      }
      .ladder-row.divider { display: none; }
      .ladder-filters {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
      }

      .right-col {
        height: 420px;
      }
    }

    footer {
      background: var(--grey-dark);
      border-top: 1px solid var(--border);
      padding: 0.25rem 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.62rem;
      color: var(--muted);
    }
    footer a { color: var(--red); text-decoration: none; }
  </style>
</head>
<body>

  <!-- TITLEBAR -->
  <div class="app-titlebar">
    <div class="app-title">
      v/TMURA <span>· Permutation Matrix &amp; Syntactic Loom // Wordstar Nexus</span>
    </div>
    <div id="dictStatus" style="font-size:0.65rem; color:var(--muted);">Loading Lexicon…</div>
  </div>

  <!-- TOOLBAR WITH MODE SWITCH & DICTIONARY PIPELINE -->
  <div class="app-toolbar">
    <!-- Switch between Words Matrix & Sentences -->
    <div class="mode-switch">
      <button type="button" class="active" id="btnModeWords">Words</button>
      <button type="button" id="btnModeSentences">Sentences</button>
    </div>

    <span style="border-left: 1px solid var(--border); height: 16px; margin: 0 0.2rem;"></span>

    <button class="tool-btn" id="btnCopyDraft">Copy Draft</button>
    <button class="tool-btn" id="btnClearDraft">Clr Draft</button>
    <button class="tool-btn" id="btnResetAll">Reset All</button>

    <span style="border-left: 1px solid var(--border); height: 16px; margin: 0 0.2rem;"></span>

    <label for="dictSource" style="font-size:0.65rem; color:var(--muted);">Dict:</label>
    <select id="dictSource" class="tool-select">
      <option value="local">Local words.json</option>
      <option value="dwyl">English Words (370k)</option>
      <option value="fallback">Definition keys</option>
      <option value="custom">Custom (imported)</option>
    </select>
    <button class="tool-btn" id="btnImportDict" title="Import flat .txt or .json array">Import…</button>
    <input type="file" id="dictFile" accept=".txt,.json,text/plain,application/json" style="display:none;" />
  </div>

  <!-- MAIN 3-PANEL GRID -->
  <div class="app-grid">

    <!-- LEFT COLUMN -->
    <div class="left-col">
      <div class="pane-box" style="border-bottom: 1px solid var(--border);">
        <div class="pane-meta">
          <span>Source Input</span>
          <span id="origMeta">Orig: 0 vow 0 0%</span>
        </div>
        <textarea id="origInput" class="pane-textarea" placeholder="Type or paste source phrase/poem here…" spellcheck="false"></textarea>
      </div>

      <div class="pane-box">
        <div class="pane-meta">
          <span>Anagram Draft</span>
          <span id="anagMeta">Anag: 0 vow 0 0% · 0% done</span>
        </div>
        <textarea id="anagInput" class="pane-textarea" placeholder="Draft your anagram here. Click words or sentences to append…" spellcheck="false"></textarea>
      </div>

      <div class="bottom-status-strip">
        <div class="status-row">
          <span id="leftMeta" style="font-weight:bold; color:var(--white);">Left: 0 vow 0 0%</span>
          <div style="display:flex; gap:0.25rem;">
            <button class="tool-btn" id="btnMiniClr" style="padding:0.1rem 0.35rem;">clr</button>
            <button class="tool-btn" id="btnCheck" style="padding:0.1rem 0.35rem; border-color:var(--ok); color:var(--ok);">audit</button>
          </div>
        </div>
        <div class="gauge-wrapper">
          <span>20%</span>
          <div class="vowel-gauge">
            <div class="vowel-gauge-target" title="Target ~40% English vowel ratio"></div>
            <div class="vowel-gauge-fill" id="vowelGaugeFill"></div>
          </div>
          <span>60%</span>
        </div>
      </div>
    </div>

    <!-- CENTER COLUMN -->
    <div class="center-col">
      <div class="ladder-stream" id="ladderStream"></div>
      <div class="ladder-filters">
        <div class="filter-input-row">
          <span>P-</span>
          <input type="text" id="filterPrefix" placeholder="prefix" maxlength="8" />
        </div>
        <div class="filter-input-row">
          <span>-X</span>
          <input type="text" id="filterSuffix" placeholder="suffix" maxlength="8" />
        </div>
        <div class="filter-input-row">
          <span>In</span>
          <input type="text" id="filterSub" placeholder="contains" maxlength="8" />
        </div>
      </div>
    </div>

    <!-- RIGHT WORKSPACE: WORDS OR SENTENCES -->
    <div class="right-col">
      <!-- Words Matrix Mode (Default) -->
      <div class="matrix-body" id="matrixBody"></div>

      <!-- Sentences Mode (Hidden until switched) -->
      <div id="sentenceContainer" style="display:none; flex:1; flex-direction:column; overflow:hidden;">
        <div class="sentence-subbar">
          <label style="font-size:0.65rem; color:var(--muted);">Depth:</label>
          <select id="sentenceDepth" class="tool-select">
            <option value="2">2 words</option>
            <option value="3" selected>3 words</option>
            <option value="4">4 words</option>
          </select>

          <label style="font-size:0.65rem; color:var(--muted);">Leftovers:</label>
          <select id="sentenceLeftovers" class="tool-select">
            <option value="0" selected>0 (Exact 100% full anagrams)</option>
            <option value="2">&le; 2 letters</option>
            <option value="4">&le; 4 letters</option>
          </select>

          <span id="sentenceCount" style="font-size:0.65rem; color:var(--ok); margin-left:auto;">0 sentences</span>
        </div>
        <div class="sentences-stream" id="sentencesStream"></div>
      </div>
    </div>

  </div>

  <footer>
    <div><a href="/gram">← /gram</a> · <a href="/leviticus">/leviticus</a> · <a href="/sitemap">/sitemap</a></div>
    <div>v/TMURA · Permutation Matrix Engine // Wordstar Nexus · MMXXVI</div>
  </footer>

  <script>
    const LADDER_LETTERS = [
      'e', 'a', 'o', 'i', 'u', 'y',
      '-',
      't', 'n', 's', 'h', 'r', 'd', 'l', 'm', 'c', 'f', 'w', 'g', 'p', 'b', 'v', 'k', 'x', 'q', 'j', 'z'
    ];
    const VOWELS = new Set(['a', 'e', 'i', 'o', 'u', 'y']);

    let DICT = [];
    let DICT_COUNTS = [];
    let DICT_MASKS = new Int32Array(0);

    let activeMode = "words"; // "words" or "sentences"
    let sourceCounts = new Uint8Array(26);
    let anagCounts = new Uint8Array(26);
    let remaining = new Uint8Array(26);

    const $ = (id) => document.getElementById(id);

    function countsFrom(str) {
      const c = new Uint8Array(26);
      for (let i = 0; i < str.length; i++) {
        const idx = str.charCodeAt(i) - 97;
        if (idx >= 0 && idx < 26) c[idx]++;
      }
      return c;
    }

    function maskFrom(str) {
      let m = 0;
      for (let i = 0; i < str.length; i++) {
        const idx = str.charCodeAt(i) - 97;
        if (idx >= 0 && idx < 26) m |= (1 << idx);
      }
      return m;
    }

    function invMask(inv) {
      let m = 0;
      for (let i = 0; i < 26; i++) {
        if (inv[i] > 0) m |= (1 << i);
      }
      return m;
    }

    function canForm(need, have) {
      for (let i = 0; i < 26; i++) {
        if (need[i] > have[i]) return false;
      }
      return true;
    }

    function subtract(inv, sub) {
      const n = inv.slice();
      for (let i = 0; i < 26; i++) n[i] -= sub[i];
      return n;
    }

    function cleanString(str) {
      return (str || "").toLowerCase().replace(/[^a-z]/g, "");
    }

    function toRoman(num) {
      if (num <= 0) return "";
      const roman = ["", "I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X"];
      return roman[num] || String(num);
    }

    function stats(counts) {
      let tot = 0, vows = 0;
      for (let i = 0; i < 26; i++) {
        tot += counts[i];
        if (VOWELS.has(String.fromCharCode(97 + i))) vows += counts[i];
      }
      const pct = tot === 0 ? 0 : Math.round((vows / tot) * 100);
      return { tot, vows, pct };
    }

    // ============================================================
    // RECALCULATION & DISPATCH
    // ============================================================

    function updateAll() {
      const srcClean = cleanString($("origInput").value);
      sourceCounts = countsFrom(srcClean);

      const anagClean = cleanString($("anagInput").value);
      anagCounts = countsFrom(anagClean);

      remaining = new Uint8Array(26);
      let isOverdrawn = false;
      for (let i = 0; i < 26; i++) {
        const diff = sourceCounts[i] - anagCounts[i];
        if (diff < 0) {
          isOverdrawn = true;
          remaining[i] = 0;
        } else {
          remaining[i] = diff;
        }
      }

      const sOrig = stats(sourceCounts);
      const sAnag = stats(anagCounts);
      const sLeft = stats(remaining);

      $("origMeta").textContent = `Orig: ${sOrig.tot} vow ${sOrig.vows} ${sOrig.pct}%`;
      const donePct = sOrig.tot === 0 ? 0 : Math.min(100, Math.round((sAnag.tot / sOrig.tot) * 1000) / 10);
      $("anagMeta").textContent = `Anag: ${sAnag.tot} vow ${sAnag.vows} ${sAnag.pct}% · ${donePct}% done`;
      $("leftMeta").textContent = `Left: ${sLeft.tot} vow ${sLeft.vows} ${sLeft.pct}%`;
      if (isOverdrawn) $("leftMeta").textContent += " [OVERDRAWN]";

      const gauge = $("vowelGaugeFill");
      const clamped = Math.max(20, Math.min(60, sLeft.pct));
      const widthPct = ((clamped - 20) / 40) * 100;
      gauge.style.width = widthPct + "%";
      gauge.className = "vowel-gauge-fill" + (sLeft.pct < 32 || sLeft.pct > 48 ? " danger" : "");

      renderLadder();

      if (activeMode === "words") {
        debounceMatrix();
      } else {
        debounceSentences();
      }

      saveSession();
    }

    function renderLadder() {
      const stream = $("ladderStream");
      stream.innerHTML = "";

      LADDER_LETTERS.forEach(char => {
        if (char === '-') {
          const div = document.createElement("div");
          div.className = "ladder-row divider";
          stream.appendChild(div);
          return;
        }

        const idx = char.charCodeAt(0) - 97;
        const count = remaining[idx];
        const isVowel = VOWELS.has(char);

        const row = document.createElement("div");
        row.className = "ladder-row" + (isVowel ? " vowel" : "") + (count === 0 ? " depleted" : "");
        row.innerHTML = `
          <span class="glyph">${char.toUpperCase()}</span>
          <div>
            <span class="tally">${toRoman(count)}</span>
            <span class="count">${count > 0 ? count : ''}</span>
          </div>
        `;
        stream.appendChild(row);
      });
    }

    // ── WORDS MODE: MULTI-COLUMN MATRIX ──
    let matrixTimer = null;
    function debounceMatrix() {
      clearTimeout(matrixTimer);
      matrixTimer = setTimeout(renderMatrix, 50);
    }

    function renderMatrix() {
      const container = $("matrixBody");
      const remMask = invMask(remaining);
      const leftTot = stats(remaining).tot;

      if (!DICT.length || leftTot === 0) {
        container.innerHTML = '<div style="padding:1rem; color:var(--muted);">No letters remaining or lexicon initializing.</div>';
        return;
      }

      const pfx = cleanString($("filterPrefix").value);
      const sfx = cleanString($("filterSuffix").value);
      const sub = cleanString($("filterSub").value);

      const maxCol = Math.min(10, Math.max(6, leftTot));
      const columns = {};
      for (let len = 1; len <= maxCol; len++) columns[len] = [];

      for (let i = 0; i < DICT.length; i++) {
        const len = DICT[i].length;
        if (len > maxCol || len > leftTot) continue;
        if ((DICT_MASKS[i] & ~remMask) !== 0) continue;

        const w = DICT[i];
        if (pfx && !w.startsWith(pfx)) continue;
        if (sfx && !w.endsWith(sfx)) continue;
        if (sub && !w.includes(sub)) continue;

        if (canForm(DICT_COUNTS[i], remaining)) {
          if (columns[len] && columns[len].length < 40) {
            columns[len].push(w);
          }
        }
      }

      container.innerHTML = "";
      const frag = document.createDocumentFragment();

      for (let len = 1; len <= maxCol; len++) {
        const list = columns[len] || [];
        const col = document.createElement("div");
        col.className = "length-col";
        col.innerHTML = `<div class="col-header">${len}</div>`;

        const wordsWrap = document.createElement("div");
        wordsWrap.className = "col-words";

        list.forEach(word => {
          const span = document.createElement("span");
          span.className = "matrix-word";
          span.textContent = word;
          span.addEventListener("click", () => {
            const anag = $("anagInput");
            anag.value = anag.value ? anag.value + " " + word : word;
            updateAll();
            anag.focus();
          });
          wordsWrap.appendChild(span);
        });

        col.appendChild(wordsWrap);
        frag.appendChild(col);
      }

      container.appendChild(frag);
    }

    // ── SENTENCES MODE: RECURSIVE SYNTACTIC ENGINE ──
    let sentenceTimer = null;
    function debounceSentences() {
      clearTimeout(sentenceTimer);
      sentenceTimer = setTimeout(renderSentences, 60);
    }

    function renderSentences() {
      const container = $("sentencesStream");
      const remMask = invMask(remaining);
      const leftTot = stats(remaining).tot;

      if (!DICT.length || leftTot === 0) {
        container.innerHTML = '<div style="padding:1rem; color:var(--muted); grid-column:1/-1;">No letters remaining or lexicon initializing.</div>';
        $("sentenceCount").textContent = "0 sentences";
        return;
      }

      const pfx = cleanString($("filterPrefix").value);
      const sfx = cleanString($("filterSuffix").value);
      const sub = cleanString($("filterSub").value);

      const maxDepth = parseInt($("sentenceDepth").value, 10) || 3;
      const maxLeftover = parseInt($("sentenceLeftovers").value, 10) || 0;

      // 1. Build small candidate pool
      const pool = [];
      for (let i = 0; i < DICT.length; i++) {
        const w = DICT[i];
        if (w.length < 3 || w.length > 9) continue;
        if ((DICT_MASKS[i] & ~remMask) !== 0) continue;
        if (pfx && !w.startsWith(pfx)) continue;
        if (sfx && !w.endsWith(sfx)) continue;
        if (sub && !w.includes(sub)) continue;

        if (canForm(DICT_COUNTS[i], remaining)) {
          pool.push({ word: w, counts: DICT_COUNTS[i], len: w.length, mask: DICT_MASKS[i] });
        }
      }

      pool.sort((a, b) => b.len - a.len);

      const results = [];
      const seen = new Set();
      const startTime = performance.now();
      const TIME_BUDGET = 350; // Fast non-blocking

      function search(inv, path, startIdx) {
        if (results.length >= 80) return;
        if (performance.now() - startTime > TIME_BUDGET) return;

        const left = stats(inv).tot;

        if (path.length >= 2 && left <= maxLeftover) {
          const key = path.slice().sort().join(" ");
          if (!seen.has(key)) {
            seen.add(key);
            results.push({
              sentence: path.join(" "),
              words: path.slice(),
              leftover: left
            });
          }
        }

        if (path.length >= maxDepth || left < 3) return;

        const curMask = invMask(inv);
        for (let i = startIdx; i < pool.length; i++) {
          const w = pool[i];
          if (w.len > left) continue;
          if ((w.mask & ~curMask) !== 0) continue;
          if (!canForm(w.counts, inv)) continue;
          if (path.length && w.len > path[path.length - 1].length) continue;

          search(subtract(inv, w.counts), [...path, w.word], i);
          if (results.length >= 80) return;
          if (performance.now() - startTime > TIME_BUDGET) return;
        }
      }

      search(remaining.slice(), [], 0);

      results.sort((a, b) => a.leftover - b.leftover || b.words.length - a.words.length);

      container.innerHTML = "";
      $("sentenceCount").textContent = `${results.length} sentences`;

      if (!results.length) {
        container.innerHTML = '<div style="padding:1rem; color:var(--muted); grid-column:1/-1;">No valid sentences matching constraint depth/leftovers. Try increasing leftovers.</div>';
        return;
      }

      const frag = document.createDocumentFragment();
      results.forEach(res => {
        const card = document.createElement("div");
        card.className = "sentence-card" + (res.leftover === 0 ? " exact" : "");
        card.innerHTML = `
          <span class="sentence-text">${res.sentence}</span>
          <span class="sentence-badge ${res.leftover === 0 ? 'exact' : ''}">${res.leftover === 0 ? '0 left · EXACT' : res.leftover + ' left'}</span>
        `;
        card.addEventListener("click", () => {
          const anag = $("anagInput");
          anag.value = anag.value ? anag.value + " " + res.sentence : res.sentence;
          updateAll();
          anag.focus();
        });
        frag.appendChild(card);
      });

      container.appendChild(frag);
    }

    // ── MODE SWITCHING ──
    function setWorkbenchMode(mode) {
      activeMode = mode;
      $("btnModeWords").classList.toggle("active", mode === "words");
      $("btnModeSentences").classList.toggle("active", mode === "sentences");

      const isWords = mode === "words";
      $("matrixBody").style.display = isWords ? "flex" : "none";
      $("sentenceContainer").style.display = isWords ? "none" : "flex";

      updateAll();
    }

    $("btnModeWords").addEventListener("click", () => setWorkbenchMode("words"));
    $("btnModeSentences").addEventListener("click", () => setWorkbenchMode("sentences"));
    $("sentenceDepth").addEventListener("change", debounceSentences);
    $("sentenceLeftovers").addEventListener("change", debounceSentences);

    // ============================================================
    // DICTIONARY PIPELINE
    // ============================================================

    const CUSTOM_DICT_KEY = "gram-custom-dict-v1";
    const DICT_SOURCE_KEY = "tmura-dict-source-v1";
    const SESSION_KEY = "tmura-session-v1";

    function normalizeWordList(rawList) {
      const set = new Set();
      for (const item of rawList) {
        const w = String(item || "").toLowerCase().replace(/[^a-z]/g, "");
        if (w.length >= 1 && w.length <= 20) set.add(w);
      }
      return Array.from(set).sort();
    }

    function finalizeDict(words, label) {
      DICT = words;
      DICT_COUNTS = DICT.map((w) => countsFrom(w));
      DICT_MASKS = new Int32Array(DICT.length);
      for (let i = 0; i < DICT.length; i++) {
        DICT_MASKS[i] = maskFrom(DICT[i]);
      }
      $("dictStatus").textContent = `Ready · ${DICT.length.toLocaleString()} words (${label})`;
      updateAll();
    }

    async function loadFromLocal() {
      const res = await fetch("words.json");
      if (!res.ok) throw new Error();
      const data = await res.json();
      return Array.isArray(data) ? normalizeWordList(data) : normalizeWordList(Object.keys(data));
    }

    async function loadFromDwyl() {
      const res = await fetch("https://raw.githubusercontent.com/dwyl/english-words/master/words_alpha.txt");
      if (!res.ok) throw new Error();
      const text = await res.text();
      return normalizeWordList(text.split(/\r?\n/));
    }

    async function loadFromFallback() {
      const res = await fetch("https://raw.githubusercontent.com/adambom/dictionary/master/dictionary.json");
      if (!res.ok) throw new Error();
      const raw = await res.json();
      return normalizeWordList(Object.keys(raw));
    }

    function loadFromCustom() {
      try {
        const saved = localStorage.getItem(CUSTOM_DICT_KEY);
        if (!saved) return null;
        const list = JSON.parse(saved);
        return Array.isArray(list) ? normalizeWordList(list) : null;
      } catch { return null; }
    }

    async function loadDict(source) {
      const sel = $("dictSource");
      const src = source || (sel ? sel.value : "local");
      $("dictStatus").textContent = "Loading lexicon…";

      try {
        let words = null;
        let label = "";

        if (src === "custom") {
          words = loadFromCustom();
          if (!words || !words.length) {
            $("dictStatus").textContent = "No custom list found. Using local…";
            words = await loadFromLocal();
            label = "local";
            if (sel) sel.value = "local";
          } else {
            label = "custom";
          }
        } else if (src === "dwyl") {
          words = await loadFromDwyl();
          label = "dwyl 370k";
        } else if (src === "fallback") {
          words = await loadFromFallback();
          label = "fallback";
        } else {
          try {
            words = await loadFromLocal();
            label = "local";
          } catch {
            words = await loadFromFallback();
            label = "fallback";
          }
        }

        try { localStorage.setItem(DICT_SOURCE_KEY, sel ? sel.value : src); } catch (_) {}
        finalizeDict(words, label);

        if (!window.__tmuraLoaded) {
          window.__tmuraLoaded = true;
          restoreSession();
        }
      } catch (err) {
        $("dictStatus").textContent = "Lexicon load failed";
      }
    }

    function handleDictImport(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          let list = [];
          const text = reader.result;
          if (file.name.toLowerCase().endsWith(".json") || text.trim().startsWith("[")) {
            const parsed = JSON.parse(text);
            list = Array.isArray(parsed) ? parsed : Object.keys(parsed);
          } else {
            list = text.split(/\r?\n/);
          }
          const words = normalizeWordList(list);
          if (!words.length) return;

          try { localStorage.setItem(CUSTOM_DICT_KEY, JSON.stringify(words)); } catch (_) {}
          if ($("dictSource")) $("dictSource").value = "custom";
          finalizeDict(words, "custom");
        } catch (_) {}
      };
      reader.readAsText(file);
    }

    // ============================================================
    // STATE PERSISTENCE & HANDLERS
    // ============================================================

    function saveSession() {
      try {
        const state = {
          orig: $("origInput").value,
          anag: $("anagInput").value,
          mode: activeMode
        };
        localStorage.setItem(SESSION_KEY, JSON.stringify(state));
      } catch (_) {}
    }

    function restoreSession() {
      try {
        const saved = localStorage.getItem(SESSION_KEY);
        if (!saved) return;
        const state = JSON.parse(saved);
        if (state.orig) $("origInput").value = state.orig;
        if (state.anag) $("anagInput").value = state.anag;
        if (state.mode && state.mode !== activeMode) setWorkbenchMode(state.mode);
        updateAll();
      } catch (_) {}
    }

    $("origInput").addEventListener("input", updateAll);
    $("anagInput").addEventListener("input", updateAll);

    ["filterPrefix", "filterSuffix", "filterSub"].forEach(id => {
      $(id).addEventListener("input", () => {
        if (activeMode === "words") debounceMatrix();
        else debounceSentences();
      });
    });

    $("btnClearDraft").addEventListener("click", () => {
      $("anagInput").value = "";
      updateAll();
    });
    $("btnMiniClr").addEventListener("click", () => {
      $("anagInput").value = "";
      updateAll();
    });
    $("btnResetAll").addEventListener("click", () => {
      $("origInput").value = "";
      $("anagInput").value = "";
      updateAll();
    });

    $("btnCopyDraft").addEventListener("click", () => {
      const text = $("anagInput").value;
      if (navigator.clipboard && text) navigator.clipboard.writeText(text);
    });

    $("btnCheck").addEventListener("click", () => {
      const sLeft = stats(remaining);
      if (sLeft.tot === 0) {
        alert("PERFECT ANAGRAM! Exactly 0 letters remaining.");
      } else {
        alert(`${sLeft.tot} letters remaining (${sLeft.vows} vowels).`);
      }
    });

    (function() {
      const sel = $("dictSource");
      const btn = $("btnImportDict");
      const fileInput = $("dictFile");

      if (sel) {
        try {
          const saved = localStorage.getItem(DICT_SOURCE_KEY);
          if (saved) sel.value = saved;
        } catch (_) {}
        sel.addEventListener("change", () => loadDict(sel.value));
      }
      if (btn && fileInput) {
        btn.addEventListener("click", () => fileInput.click());
        fileInput.addEventListener("change", () => {
          const f = fileInput.files && fileInput.files[0];
          if (f) handleDictImport(f);
          fileInput.value = "";
        });
      }
    })();

    loadDict();
  </script>
</body>
</html>
