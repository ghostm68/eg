  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Icons & Title -->
  <link rel="icon" type="image/svg+xml" href="https://cdn.jsdelivr.net/gh/ghostm68/inktwo@main/svg/inky.svg">
  <link rel="apple-touch-icon" type="image/png" href="https://github.com/ghostm68/pantheon/raw/main/inkto.png" />
  <title>WordStar Nexus - Map</title>

  <!-- GSAP Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <style>
    /* === DEFINE VARIABLES FIRST === */
    :root {
      --red: #ff0033;
      --black: #0a0a0a;
      --crimson: #DC143C;
      --crimson-glow: rgba(220, 20, 60, 0.45);
      --dark-bg: #08080a;
      --card-bg: rgba(16, 16, 20, 0.75);
      --card-hover: rgba(26, 26, 32, 0.95);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(220, 20, 60, 0.7);
      --txt-head: #fafafa;
      --txt-dim: #8e8e93;
      --font-stack: 'Courier New', Courier, monospace;
    }

    /* === Text selection highlight === */
    ::selection {
      background: var(--red);
      color: var(--black);
      text-shadow: none;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: var(--dark-bg);
      color: var(--txt-head);
      font-family: var(--font-stack);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Viewport Stage (Desktop hover art) */
    #ambient-stage {
      position: fixed;
      inset: 0;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0.2;
      filter: contrast(115%) grayscale(20%);
      transition: background-image 0.4s ease-in-out, opacity 0.35s ease;
      pointer-events: none;
      z-index: 0;
    }

    .vignette-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 40%, rgba(8,8,10,0.3) 0%, rgba(8,8,10,0.92) 85%);
      pointer-events: none;
      z-index: 1;
    }

    /* Header & Masthead */
    .top-bar {
      position: sticky;
      top: 0;
      background: rgba(8, 8, 10, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 50;
    }

    .logo-anchor {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--crimson);
      text-decoration: none;
      text-transform: uppercase;
    }

    .meta-nav {
      display: flex;
      gap: 16px;
      font-size: 11px;
      letter-spacing: 1px;
    }

    .meta-nav a {
      color: var(--txt-dim);
      text-decoration: none;
      transition: color 0.2s;
    }
    .meta-nav a:hover { color: var(--crimson); }

    /* Statement Block */
    .masthead-statement {
      max-width: 1240px;
      margin: 36px auto 16px auto;
      padding: 0 24px;
      position: relative;
      z-index: 10;
    }

    .masthead-statement h1 {
      font-size: 18px;
      font-weight: 400;
      letter-spacing: 1.5px;
      color: #fff;
      line-height: 1.5;
    }

    .masthead-statement p {
      font-size: 12px;
      color: var(--txt-dim);
      margin-top: 6px;
      letter-spacing: 1px;
    }

    .masthead-statement p a {
      color: var(--crimson);
      text-decoration: none;
    }

    /* Filter / Search Bar */
    .filter-bar {
      max-width: 1240px;
      margin: 24px auto 0 auto;
      padding: 0 24px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      position: relative;
      z-index: 10;
    }

    .filter-pills { display: flex; flex-wrap: wrap; gap: 8px; }

    .pill-trigger {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-subtle);
      color: var(--txt-dim);
      font-family: inherit;
      font-size: 11px;
      padding: 6px 12px;
      letter-spacing: 1px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s ease;
    }

    .pill-trigger:hover, .pill-trigger.active {
      color: #fff;
      border-color: var(--crimson);
      background: rgba(220, 20, 60, 0.14);
    }

    .filter-input {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border-subtle);
      color: #fff;
      font-family: inherit;
      font-size: 12px;
      padding: 7px 12px;
      width: 220px;
      outline: none;
      transition: border-color 0.2s;
    }
    .filter-input:focus { border-color: var(--crimson); }

    /* Directory Container */
    .catalog-stage {
      max-width: 1240px;
      margin: 24px auto 80px auto;
      padding: 0 24px;
      position: relative;
      z-index: 10;
    }

    .catalog-section { margin-bottom: 44px; }

    .section-head {
      position: sticky;
      top: 50px;
      background: rgba(8, 8, 10, 0.94);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-subtle);
      border-left: 3px solid var(--crimson);
      padding: 8px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 12px;
      z-index: 20;
    }

    .section-count {
      color: var(--crimson);
      font-size: 10px;
    }

    /* Tiles Grid */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 8px;
    }

    .node-tile {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 14px;
      background: var(--card-bg);
      border: 1px solid var(--border-subtle);
      text-decoration: none;
      color: var(--txt-head);
      min-height: 58px;
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }

    .node-tile:hover {
      background: var(--card-hover);
      border-color: var(--border-focus);
      transform: translateX(4px);
    }

    .node-thumb {
      width: 42px;
      height: 42px;
      object-fit: cover;
      border: 1px solid rgba(255, 255, 255, 0.1);
      flex-shrink: 0;
      background: #000;
    }

    .node-details {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .node-title {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .node-tile:hover .node-title { color: var(--crimson); }

    .node-note {
      font-size: 10px;
      color: var(--txt-dim);
      margin-top: 3px;
      letter-spacing: 0.5px;
    }

    /* Footer */
    .bottom-bar {
      border-top: 1px solid var(--border-subtle);
      background: rgba(8, 8, 10, 0.95);
      padding: 18px 24px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--txt-dim);
      gap: 16px;
      position: relative;
      z-index: 10;
    }

    .bottom-bar a {
      color: var(--txt-dim);
      text-decoration: none;
      transition: color 0.2s;
    }
    .bottom-bar a:hover { color: var(--crimson); }

    /* Mobile adjustments */
    @media (max-width: 768px) {
      .grid-container { grid-template-columns: 1fr; }
      .filter-bar { flex-direction: column; align-items: stretch; }
      .filter-input { width: 100%; }
      .top-bar { padding: 12px 16px; }
      .masthead-statement h1 { font-size: 15px; }
      .node-tile { min-height: 64px; }
    }
  </style>
</head>
<body>

  <div id="ambient-stage"></div>
  <div class="vignette-overlay"></div>

  <!-- Header -->
  <header class="top-bar">
    <a href="https://wordstar.nexus" class="logo-anchor">WordStar Nexus</a>
    <nav class="meta-nav">
      <a href="https://wordstar.nexus/debrief">Debrief</a>
      <a href="https://wordstar.nexus/directory">Directory</a>
      <a href="https://wordstar.nexus/sitemap.xml">XML</a>
    </nav>
  </header>

  <!-- Editorial Lede -->
  <section class="masthead-statement">
    <h1>Inky is a writer, musician, and artist.</h1>
    <p><a href="https://inkrealm.info" target="_blank" rel="noopener">inkrealm.info</a> is the origin story of this domain.</p>
  </section>

  <!-- Filter & Search Controls -->
  <div class="filter-bar">
    <div class="filter-pills" id="pills">
      <button class="pill-trigger active" data-filter="all">All</button>
      <button class="pill-trigger" data-filter="wordplay">Word Play</button>
      <button class="pill-trigger" data-filter="processors">Word Processors</button>
      <button class="pill-trigger" data-filter="stories">Stories & Notes</button>
      <button class="pill-trigger" data-filter="other">Other Places</button>
      <button class="pill-trigger" data-filter="restricted">Restricted</button>
    </div>
    <input type="text" id="node-search" class="filter-input" placeholder="Search..." autocomplete="off">
  </div>

  <!-- Main Directory -->
  <main class="catalog-stage" id="catalog-mount"></main>

  <!-- Footer -->
  <footer class="bottom-bar">
    <div>INDEX NODES: <span id="counter" style="color: var(--crimson);">0</span></div>
    <div style="display:flex; gap:16px;">
      <a href="https://tidal.com/browse/artist/15916023" target="_blank" rel="noopener">Tidal</a>
      <a href="https://music.apple.com/us/artist/two-skinny-girls/1466240185" target="_blank" rel="noopener">Apple Music</a>

      <a href="https://wordstar.nexus/contact">Contact</a>
    </div>
    <div>&copy; WORDSTAR NEXUS</div>
  </footer>

  <script>
    const directory = [
      /* ========== [I] WORD PLAY ========== */
      { name: "Cipher", url: "https://wordstar.nexus/code", section: "wordplay", img: "https://raw.githubusercontent.com/ghostm68/pantheon/main/the-horse-skull-on-blue.jpg" },
      { name: "Cut & Rune", url: "https://wordstar.nexus/cut+rune", section: "wordplay", img: "https://raw.githubusercontent.com/ghostm68/pantheon/main/Peter_Paul_Rubens_-_Rape_of_the_Daughters_of_Leucippus_-_WGA20299.jpg" },

      { name: "Lex", url: "https://wordstar.nexus/lex", section: "wordplay", img: "https://raw.githubusercontent.com/ghostm68/pantheon/main/Hieronymus_Bosch,_Garden_of_Earthly_Delights_tryptich,_centre_panel_-_detail_3.jpg" },
      { name: "Tmura", url: "https://wordstar.nexus/tmura", section: "wordplay", img: "https://raw.githubusercontent.com/ghostm68/pantheon/main/minaro.inkrealm%20(1).jpeg" },

      /* ========== [II] WORD PROCESSORS ========== */
      { name: "14", url: "https://wordstar.nexus/14", section: "processors", img: "https://lh3.ggpht.com/lAJ1wnr_hEOncOfh9eKzvaS8w-fhLLq5yGlzHBctnjgyOzsbuP4cGIqP4q0A-YvnyXBhJi96il6NIZNhRVW-BVg2lW0=s0" },
      { name: "16", url: "https://wordstar.nexus/16", section: "processors", img: "https://raw.githubusercontent.com/ghostm68/pantheon/main/the-horse-skull-on-blue.jpg" },
      { name: "AI", url: "https://wordstar.nexus/ai", section: "processors", img: "https://raw.githubusercontent.com/ghostm68/pantheon/main/picassojson1.jpg" },
      { name: "Ataraxia", url: "https://wordstar.nexus/ataraxia", section: "processors", img: "https://raw.githubusercontent.com/ghostm68/99/main/5379e792-a434-4666-8e51-bb8e41de678b_inky_gif.gif" },
      { name: "Birch", url: "https://wordstar.nexus/birch", section: "processors", img: "https://github.com/ghostm68/pantheon/raw/main/VAPORGRAM.wildfiremap1736434961088.gif" },
      { name: "Citadelle", url: "https://wordstar.nexus/citadelle", section: "processors", img: "https://raw.githubusercontent.com/ghostm68/pantheon/main/minaro.inkrealm%20(1).jpeg" },
      { name: "Conceptweave", url: "https://wordstar.nexus/conceptweave", section: "processors", img: "https://raw.githubusercontent.com/ghostm68/pantheon/main/7f8605cbdd174dcf8ff777756ee92018.gif" },
      { name: "CustomPad", url: "https://wordstar.nexus/custompad", section: "processors", img: "https://raw.githubusercontent.com/ghostm68/pantheon/main/tvc151988-MARLBORO-LIGHTS-MENTHOL-Cigarettes-Wild-Horses-River.webp" },
      { name: "Displaywriter 2", url: "https://wordstar.nexus/displaywriter2", section: "processors", img: "https://raw.githubusercontent.com/ghostm68/pantheon/main/emilee.inkrealm.164841611766.gif" },
      { name: "EBCDIC", url: "https://wordstar.nexus/ebcdic", section: "processors", img: "https://raw.githubusercontent.com/ghostm68/666/main/Monapromotionalitem.gif" },
      { name: "Everex", url: "https://wordstar.nexus/everex", section: "processors", img: "https://github.com/ghostm68/pantheon/raw/main/inkrealmliquidhermes934.gif" },
      { name: "MacWritePro", url: "https://wordstar.nexus/macwritepro", section: "processors", img: "https://github.com/ghostm68/pantheon/raw/main/Detroit.jpeg" },
      { name: "Q", url: "https://wordstar.nexus/q", section: "processors", img: "https://raw.githubusercontent.com/ghostm68/pantheon/main/wetstichler3.gif" },
      { name: "Quantum Muse", url: "https://muse.wordstar.nexus", section: "processors", img: "https://raw.githubusercontent.com/ghostm68/pantheon/main/d6280e_2fd3d9fcf33543849e43d2a7ce753aeb~mv2.jpg" },
      { name: "Queer", url: "https://wordstar.nexus/queer", section: "processors", img: "https://raw.githubusercontent.com/ghostm68/pantheon/main/Michelangelo-Conversion-of-Saul.jpg" },
      { name: "Seven", url: "https://wordstar.nexus/seven", section: "processors", img: "https://raw.githubusercontent.com/ghostm68/pantheon/main/misfits.jpg" },
      { name: "Six", url: "https://wordstar.nexus/six", section: "processors", img: "https://raw.githubusercontent.com/ghostm68/pantheon/main/Diego_Velázquez_053.jpg" },
      { name: "Textcraft", url: "https://wordstar.nexus/textcraft", section: "processors", img: "https://github.com/ghostm68/pantheon/raw/main/bf.theroadtowellville.gif" },
      { name: "Triad", url: "https://wordstar.nexus/triad", section: "processors", img: "https://raw.githubusercontent.com/ghostm68/pantheon/main/the-horse-skull-on-blue.jpg" },
      { name: "TRS-80", url: "https://wordstar.nexus/trs80", section: "processors", img: "https://raw.githubusercontent.com/ghostm68/99/main/5379e792-a434-4666-8e51-bb8e41de678b_inky_gif.gif" },
      { name: "Typecast", url: "https://wordstar.nexus/typecast", section: "processors", img: "https://raw.githubusercontent.com/ghostm68/pantheon/main/Kristina.wordstar.gif" },
      { name: "Typespace", url: "https://wordstar.nexus/typespace", section: "processors", img: "https://raw.githubusercontent.com/ghostm68/pantheon/main/zelda.gif" },
      { name: "Typewriter", url: "https://wordstar.nexus/typewriter", section: "processors", img: "https://github.com/ghostm68/pantheon/raw/main/deepelemblues.twoskinnygirls.gif" },
      { name: "Z-Spin", url: "https://wordstar.nexus/z", section: "processors", img: "https://github.com/ghostm68/pantheon/raw/main/myrnaloy.wordstar.gif" },
      { name: "0qtopus", url: "https://quantum.wordstar.nexus", section: "processors", note: "offline / invite only", img: "https://github.com/ghostm68/pantheon/raw/main/inkrealmliquidhermes934.gif" },

      /* ========== [III] STORIES & NOTES ========== */
      { name: "15", url: "https://wordstar.nexus/15", section: "stories", img: "https://raw.githubusercontent.com/ghostm68/pantheon/main/d6280e_2fd3d9fcf33543849e43d2a7ce753aeb~mv2.jpg" },
      { name: "Baked Alaska", url: "https://wordstar.nexus/bakedalaska", section: "stories", img: "https://raw.githubusercontent.com/ghostm68/pantheon/main/picassojson1.jpg" },
      { name: "Deja Vu Glitches", url: "https://wordstar.nexus/dejavuglitches", section: "stories", img: "https://github.com/ghostm68/pantheon/raw/main/laurasophie.h.gif" },
      { name: "Dreamweaver", url: "https://wordstar.nexus/dreamweaver", section: "stories", img: "https://github.com/ghostm68/pantheon/raw/main/laracosima.wordstar.gif" },
      { name: "Notes 27", url: "https://wordstar.nexus/27", section: "stories", img: "https://raw.githubusercontent.com/ghostm68/pantheon/main/Michelangelo-Conversion-of-Saul.jpg" },
      { name: "Notes 38", url: "https://wordstar.nexus/38", section: "stories", img: "https://raw.githubusercontent.com/ghostm68/pantheon/main/rachelchaleff22625.jpg" },
      { name: "Slutpuppy", url: "https://wordstar.nexus/ten", section: "stories", img: "https://raw.githubusercontent.com/ghostm68/pantheon/main/Minaro.zone.wordstar_240108_223759.gif" },
      { name: "Town", url: "https://wordstar.nexus/town", section: "stories", note: "in progress / unpublished notes", img: "https://raw.githubusercontent.com/ghostm68/pantheon/main/minaro.news.jpg" },
      { name: "Work in Progress", url: "https://wordstar.nexus/wip", section: "stories", img: "https://github.com/ghostm68/pantheon/raw/main/wagners.wordstar.jpg" },

      /* ========== [IV] OTHER PLACES ========== */
      { name: "90263", url: "https://wordstar.nexus/90263", section: "other", img: "https://raw.githubusercontent.com/ghostm68/pantheon/main/d6280e_2fd3d9fcf33543849e43d2a7ce753aeb~mv2.jpg" },
      { name: "Home", url: "https://wordstar.nexus/home", section: "other", img: "https://raw.githubusercontent.com/ghostm68/pantheon/main/minaro.inkrealm%20(1).jpeg" },
      { name: "Netherlands", url: "https://wordstar.nexus/netherlands", section: "other", img: "https://raw.githubusercontent.com/ghostm68/pantheon/main/437432178.jpg" },

      /* ========== [V] RESTRICTED ========== */
      { name: "404", url: "https://wordstar.nexus/404", section: "restricted", img: "https://raw.githubusercontent.com/ghostm68/pantheon/main/the-horse-skull-on-blue.jpg" },
      { name: "NC-17", url: "https://wordstar.nexus/nc17", section: "restricted", img: "https://github.com/ghostm68/pantheon/raw/main/wordstarnc17.gif" }
    ];

    const sectionMeta = {
      wordplay:   { title: "Word Play", roman: "I" },
      processors: { title: "Word Processors", roman: "II" },
      stories:    { title: "Stories & Notes", roman: "III" },
      other:      { title: "Other Places", roman: "IV" },
      restricted: { title: "Restricted", roman: "V" }
    };

    const stage = document.getElementById('ambient-stage');
    const catalog = document.getElementById('catalog-mount');
    const searchField = document.getElementById('node-search');
    const pillsWrap = document.getElementById('pills');
    const counterEl = document.getElementById('counter');

    counterEl.textContent = directory.length;
    if (directory.length > 0) {
      stage.style.backgroundImage = `url('${directory[0].img}')`;
    }

    function renderCatalog(filterKey = 'all', searchQuery = '') {
      catalog.innerHTML = '';
      const query = searchQuery.toLowerCase().trim();

      Object.keys(sectionMeta).forEach(secKey => {
        if (filterKey !== 'all' && filterKey !== secKey) return;

        // Strict alphabetical order (numeric-aware: numbers 0-9 before A-Z)
        const entries = directory
          .filter(item => {
            const matchesSection = item.section === secKey;
            const matchesQuery = item.name.toLowerCase().includes(query);
            return matchesSection && matchesQuery;
          })
          .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));

        if (entries.length === 0) return;

        const secBlock = document.createElement('section');
        secBlock.className = 'catalog-section';

        const head = document.createElement('div');
        head.className = 'section-head';
        head.innerHTML = `
          <span>[${sectionMeta[secKey].roman}] ${sectionMeta[secKey].title}</span>
          <span class="section-count">${entries.length}</span>
        `;
        secBlock.appendChild(head);

        const grid = document.createElement('div');
        grid.className = 'grid-container';

        entries.forEach(node => {
          const tile = document.createElement('a');
          tile.className = 'node-tile';
          tile.href = node.url;
          tile.target = "_blank";
          tile.rel = "noopener noreferrer";

          tile.innerHTML = `
            <img class="node-thumb" src="${node.img}" alt="${node.name}" loading="lazy">
            <div class="node-details">
              <span class="node-title">${node.name}</span>
              ${node.note ? `<span class="node-note">${node.note}</span>` : ''}
            </div>
          `;

          // Cross-fade backdrop on desktop mouse hover
          tile.addEventListener('mouseenter', () => {
            stage.style.backgroundImage = `url('${node.img}')`;
            stage.style.opacity = '0.32';
          });
          tile.addEventListener('mouseleave', () => {
            stage.style.opacity = '0.2';
          });

          grid.appendChild(tile);
        });

        secBlock.appendChild(grid);
        catalog.appendChild(secBlock);
      });
    }

    // Filter pill events
    pillsWrap.addEventListener('click', (e) => {
      if (!e.target.classList.contains('pill-trigger')) return;
      document.querySelectorAll('.pill-trigger').forEach(p => p.classList.remove('active'));
      e.target.classList.add('active');
      renderCatalog(e.target.dataset.filter, searchField.value);
    });

    // Live search
    searchField.addEventListener('input', (e) => {
      const activeFilter = document.querySelector('.pill-trigger.active').dataset.filter;
      renderCatalog(activeFilter, e.target.value);
    });

    // Build directory
    renderCatalog();
  </script>
</body>
</html>
