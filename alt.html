<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QUEER // UHER 5000 • CONSOLE</title>
<link href="https://fonts.googleapis.com/css2?family=Nova+Mono&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deck: #08090a;
    --chassis: #131518;
    --bezel: #22252b;
    --metal-trim: #363a45;
    --citadelle-red: #ff1a2a;
    --red-glow: rgba(255, 26, 42, 0.45);
    --tape-charcoal: #0e1013;
    --phosphor-white: #e6edf3;
    --font-mono: 'Nova Mono', monospace;
    --font-odometer: 'VT323', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg-deck);
    color: var(--phosphor-white);
    font-family: var(--font-mono);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px 16px;
  }

  /* ── UHER CONSOLE CHASSIS ── */
  .uher-console {
    width: 100%;
    max-width: 820px;
    background: linear-gradient(180deg, #17191e 0%, #101215 100%);
    border: 2px solid var(--bezel);
    border-radius: 8px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.9), inset 0 1px 0 rgba(255,255,255,0.08);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ── TOP HEADER: OLIVETTI SYRINGE / NEEDLE GAUGE ── */
  .console-header {
    background: #0b0c0e;
    padding: 14px 20px;
    border-bottom: 2px solid var(--bezel);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .header-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    color: #666;
    letter-spacing: 1.5px;
  }

  .header-meta span.active {
    color: var(--citadelle-red);
    text-shadow: 0 0 8px var(--red-glow);
  }

  .syringe-gauge {
    width: 100%;
    height: 32px;
    display: flex;
    align-items: center;
  }

  /* ── MAIN TAPE BUFFER (WRITING DESK) ── */
  .tape-bay {
    position: relative;
    background: radial-gradient(circle at 50% 30%, #14161b 0%, var(--tape-charcoal) 100%);
    padding: 24px;
    border-bottom: 2px solid var(--bezel);
  }

  .tape-ribbon {
    width: 100%;
    height: 320px;
    background: transparent;
    border: none;
    outline: none;
    color: var(--phosphor-white);
    font-family: var(--font-mono);
    font-size: 15px;
    line-height: 1.7;
    resize: vertical;
    caret-color: var(--citadelle-red);
    letter-spacing: 0.5px;
  }

  .tape-ribbon::placeholder {
    color: #3d424e;
  }

  /* ── DASHBOARD: COUNTER & METERS ── */
  .deck-dashboard {
    background: #0e1013;
    padding: 12px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid #000;
  }

  /* Uher Mechanical Odometer */
  .odometer-housing {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #000;
    padding: 4px 8px;
    border: 2px solid var(--bezel);
    border-radius: 4px;
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.9);
  }

  .odometer-label {
    font-size: 10px;
    color: #555;
    letter-spacing: 1px;
  }

  .odometer-digits {
    display: flex;
    gap: 3px;
  }

  .digit-drum {
    background: #111;
    color: #f0f0f0;
    font-family: var(--font-odometer);
    font-size: 24px;
    line-height: 1;
    width: 18px;
    text-align: center;
    border: 1px solid #222;
    border-radius: 2px;
    box-shadow: inset 0 3px 6px rgba(0,0,0,0.8), inset 0 -3px 6px rgba(0,0,0,0.8);
  }

  .reset-btn {
    background: #2a2d34;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: 1px solid #444;
    cursor: pointer;
  }

  .reset-btn:active { background: var(--citadelle-red); }

  /* Thumbwheel controls */
  .thumbwheels {
    display: flex;
    gap: 20px;
  }

  .wheel-unit {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 10px;
    color: #555;
  }

  .thumbwheel {
    width: 14px;
    height: 28px;
    background: repeating-linear-gradient(180deg, #111 0px, #111 2px, #333 3px, #111 4px);
    border: 1px solid #444;
    border-radius: 2px;
    box-shadow: inset 0 0 4px #000;
    cursor: ns-resize;
  }

  /* ── UHER PIANO KEYS (TRANSPORT) ── */
  .transport-deck {
    background: #14161a;
    padding: 16px 20px;
    display: flex;
    gap: 8px;
  }

  .piano-key {
    flex: 1;
    height: 48px;
    background: linear-gradient(180deg, #24272f 0%, #17191e 100%);
    border: 1px solid #333742;
    border-radius: 4px;
    color: #aaa;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    cursor: pointer;
    box-shadow: 0 4px 0 #0a0b0d, 0 6px 10px rgba(0,0,0,0.5);
    transition: all 0.08s ease;
    user-select: none;
  }

  .piano-key:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #0a0b0d, 0 2px 4px rgba(0,0,0,0.5);
  }

  .piano-key.rec-key {
    color: #fff;
  }

  .rec-lamp {
    width: 7px;
    height: 7px;
    background: var(--citadelle-red);
    border-radius: 50%;
    box-shadow: 0 0 6px var(--citadelle-red);
    animation: blink-rec 1.2s step-start infinite;
  }

  @keyframes blink-rec { 50% { opacity: 0.2; } }

  .cut-key {
    color: #ff9999;
    border-color: #4a2228;
  }
</style>
</head>
<body>

<div class="uher-console">
  <!-- ── 01. THE OLIVETTI SYRINGE HEADER ── -->
  <div class="console-header">
    <div class="header-meta">
      <span>UNIVERSALGERÄT // QUEER.SYS</span>
      <span class="active">REC • TAPE ARMED</span>
    </div>
    <div class="syringe-gauge">
      <!-- Inline SVG Syringe -->
      <svg viewBox="0 0 800 28" width="100%" height="28" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Needle -->
        <line x1="2" y1="14" x2="60" y2="14" stroke="#888" stroke-width="1.5"/>
        <polygon points="58,11 68,14 58,17" fill="#888"/>
        <!-- Syringe Barrel -->
        <rect x="68" y="4" width="640" height="20" rx="3" stroke="#444" stroke-width="1.5" fill="#090a0c"/>
        <!-- Fluid Fill Indicator -->
        <rect id="syringe-fluid" x="70" y="6" width="30" height="16" rx="2" fill="url(#redGrip)"/>
        <!-- Measurement Ticks -->
        <path d="M120 4v6 M180 4v10 M240 4v6 M300 4v10 M360 4v6 M420 4v10 M480 4v6 M540 4v10 M600 4v6 M660 4v10" stroke="#333" stroke-width="1.5"/>
        <!-- Plunger Stem & Thumb Ring -->
        <rect x="708" y="11" width="60" height="6" fill="#333"/>
        <circle cx="780" cy="14" r="10" stroke="#444" stroke-width="2"/>
        <defs>
          <linearGradient id="redGrip" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#7a050f"/>
            <stop offset="100%" stop-color="#ff1a2a"/>
          </linearGradient>
        </defs>
      </svg>
    </div>
  </div>

  <!-- ── 02. MAGNETIC TEXT RIBBON ── -->
  <div class="tape-bay">
    <textarea id="tape-buffer" class="tape-ribbon" spellcheck="false" placeholder="RECORDING DIRECT TO MAGNETIC BUFFER..."></textarea>
  </div>

  <!-- ── 03. UHER 5000 ODOMETER & WHEELS ── -->
  <div class="deck-dashboard">
    <div class="odometer-housing">
      <span class="odometer-label">UHER 5000 // WORDS</span>
      <div class="odometer-digits">
        <div class="digit-drum" id="d3">0</div>
        <div class="digit-drum" id="d2">0</div>
        <div class="digit-drum" id="d1">0</div>
        <div class="digit-drum" id="d0">0</div>
      </div>
      <div class="reset-btn" id="reset-counter" title="Zero Counter"></div>
    </div>

    <div class="thumbwheels">
      <div class="wheel-unit">
        <span>BIAS</span>
        <div class="thumbwheel"></div>
      </div>
      <div class="wheel-unit">
        <span>VARISPEED</span>
        <div class="thumbwheel"></div>
      </div>
    </div>
  </div>

  <!-- ── 04. PIANO TRANSPORT KEYS ── -->
  <div class="transport-deck">
    <button class="piano-key rec-key"><div class="rec-lamp"></div>REC</button>
    <button class="piano-key" id="btn-pause">PAUSE</button>
    <button class="piano-key" id="btn-stop">STOP</button>
    <button class="piano-key cut-key" id="btn-cut" title="Burroughs Scissor Cut-Up">CUT ✂</button>
    <button class="piano-key" id="btn-eject">EJECT [TXT]</button>
  </div>
</div>

<script>
  const buffer = document.getElementById('tape-buffer');
  const d3 = document.getElementById('d3');
  const d2 = document.getElementById('d2');
  const d1 = document.getElementById('d1');
  const d0 = document.getElementById('d0');
  const fluid = document.getElementById('syringe-fluid');

  // Live Word Count to 4-Digit Odometer & Syringe Fill
  buffer.addEventListener('input', () => {
    const text = buffer.value.trim();
    const words = text ? text.split(/\s+/).length : 0;
    
    const padded = String(Math.min(words, 9999)).padStart(4, '0');
    d3.textContent = padded[0];
    d2.textContent = padded[1];
    d1.textContent = padded[2];
    d0.textContent = padded[3];

    // Expand Syringe Fluid Level (Cap at 636px barrel width)
    const fluidWidth = Math.min(30 + (words * 3), 636);
    fluid.setAttribute('width', fluidWidth);
  });

  // Reset Button
  document.getElementById('reset-counter').addEventListener('click', () => {
    buffer.value = '';
    buffer.dispatchEvent(new Event('input'));
  });

  // BURROUGHS CUT-UP METHOD (Scissors Action)
  document.getElementById('btn-cut').addEventListener('click', () => {
    const text = buffer.value.trim();
    if (!text) return;
    const pieces = text.split(/([.,!?;:\n]+|\s{2,})/);
    for (let i = pieces.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pieces[i], pieces[j]] = [pieces[j], pieces[i]];
    }
    buffer.value = pieces.join(' ').replace(/\s+/g, ' ').trim();
    buffer.dispatchEvent(new Event('input'));
  });

  // Export TXT
  document.getElementById('btn-eject').addEventListener('click', () => {
    const blob = new Blob([buffer.value], { type: 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'queer_dispatch_' + Date.now() + '.txt';
    a.click();
  });
</script>
</body>
</html>
