<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>QUEER // UHER 5000 • TAPE CONSOLE</title>
<!-- Google Fonts: Nova Round (Industrial UI), VT323 (Odometer), Nova Mono (Fallback buffer) -->
<link href="https://fonts.googleapis.com/css2?family=Nova+Mono&family=Nova+Round&family=VT323&display=swap" rel="stylesheet">
<style>
  /* ── CUSTOM FONTS WITH ROBUST SYSTEM FALLBACKS ── */
  @font-face {
    font-family: 'WSB';
    src: url('https://raw.githubusercontent.com/ghostm68/eg/main/fonts/wsb-regular.woff2') format('woff2');
    font-display: swap;
  }
  @font-face {
    font-family: 'Olivetti-M15';
    src: url('https://raw.githubusercontent.com/ghostm68/inktwo/main/fonts/Web437_Olivetti_M15.woff') format('woff');
    font-display: swap;
  }

  :root {
    --bg-black: #050607;
    --chassis: #0f1114;
    --bezel: #22262d;
    --bezel-light: #363b47;
    --citadelle-red: #ff1a2a;
    --amber-pause: #ffaa00;
    --red-glow: rgba(255, 26, 42, 0.45);
    --tape-blue: #0b1a29;
    --tape-blue-border: #1a3854;
    --phosphor-white: #e6edf3;
    --font-ui: 'Nova Round', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-odometer: 'VT323', monospace;
    --font-mono-fallback: 'Nova Mono', 'Courier New', Courier, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg-black);
    color: var(--phosphor-white);
    font-family: var(--font-ui);
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 8px;
  }

  /* Accessible Focus Rings */
  :focus-visible {
    outline: 2px solid var(--citadelle-red);
    outline-offset: 2px;
  }

  /* ── FULL VIEWPORT CHASSIS ── */
  .uher-console {
    width: 100%;
    max-width: 960px;
    height: 100%;
    max-height: 98dvh;
    background: linear-gradient(180deg, #15181d 0%, #0c0d10 100%);
    border: 2px solid var(--bezel);
    border-radius: 6px;
    box-shadow: 0 20px 80px rgba(0,0,0,0.95);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── 01. CASSETTE BAY ── */
  .cassette-bay {
    flex-shrink: 0;
    background: #08090b;
    border-bottom: 2px solid var(--bezel);
    padding: 8px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .cassette-shell {
    flex: 1;
    height: 52px;
    min-height: 44px;
    background: linear-gradient(180deg, rgba(14,35,56,0.9) 0%, rgba(7,17,28,0.95) 100%);
    border: 1px solid var(--tape-blue-border);
    border-radius: 4px;
    display: flex;
    align-items: center;
    padding: 0 10px;
    cursor: pointer;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .cassette-shell:hover, .cassette-shell:focus-visible {
    border-color: var(--citadelle-red);
    box-shadow: 0 0 10px rgba(255,26,42,0.25);
  }

  .cassette-spool {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: #000;
    border: 3px dashed #444;
    animation: spoolSpin 6s linear infinite;
    flex-shrink: 0;
  }
  .cassette-spool.paused { animation-play-state: paused; }
  @keyframes spoolSpin { 100% { transform: rotate(360deg); } }

  .cassette-window {
    flex: 1;
    margin: 0 8px;
    height: 36px;
    background: #04080d;
    border: 1px solid #142436;
    border-radius: 2px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    overflow: hidden;
  }

  .cassette-window .tape-title {
    color: #d1e2f2;
    font-size: 11.5px;
    letter-spacing: 1.2px;
    white-space: nowrap;
  }

  .cassette-window .drop-hint {
    font-size: 9px;
    color: var(--citadelle-red);
    font-family: var(--font-mono-fallback);
  }

  .telemetry-strip {
    display: flex;
    flex-direction: column;
    font-size: 9px;
    color: #4a5260;
    gap: 2px;
    min-width: 130px;
    flex-shrink: 0;
    font-family: var(--font-mono-fallback);
  }
  .telemetry-strip span b { color: #8c96a8; font-weight: normal; }

  /* ── 02. SYRINGE BUFFER GAUGE ── */
  .syringe-bay {
    flex-shrink: 0;
    background: #07080a;
    padding: 4px 14px;
    border-bottom: 2px solid var(--bezel);
  }

  /* ── 03. WRITING BAY ── */
  .tape-bay {
    flex: 1 1 0;
    min-height: 0;
    background: radial-gradient(circle at 50% 30%, #121419 0%, #08090b 100%);
    padding: 14px 18px;
    position: relative;
    display: flex;
  }

  .tape-ribbon {
    width: 100%;
    height: 100%;
    min-height: 0;
    background: transparent;
    border: none;
    outline: none;
    color: var(--phosphor-white);
    font-family: 'Olivetti-M15', var(--font-mono-fallback);
    font-size: 15px;
    line-height: 1.7;
    resize: none;
    caret-color: var(--citadelle-red);
    letter-spacing: 0.5px;
    overflow-y: auto;
  }
  .tape-ribbon::placeholder { color: #2a2f38; }

  .tape-ribbon.locked {
    opacity: 0.65;
    cursor: not-allowed;
  }

  .tape-ribbon.bias-sat { text-shadow: 0 0 6px rgba(255,255,255,0.4); }
  .tape-ribbon.bias-hot { color: #ffb3b8; text-shadow: 0 0 8px var(--citadelle-red), 0 0 16px var(--red-glow); }

  /* ── 04. CONTROL DASHBOARD ── */
  .deck-dashboard {
    flex-shrink: 0;
    background: #090b0d;
    padding: 8px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 2px solid var(--bezel);
    border-bottom: 2px solid #000;
  }

  .odometer-housing {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #000;
    padding: 3px 6px;
    border: 2px solid var(--bezel);
    border-radius: 4px;
    flex-shrink: 0;
  }

  .odometer-label { font-size: 9.5px; color: #777; letter-spacing: 1px; }
  .odometer-digits { display: flex; gap: 2px; }

  .digit-drum {
    background: #111;
    color: #f0f0f0;
    font-family: var(--font-odometer);
    font-size: 20px;
    line-height: 1;
    width: 15px;
    text-align: center;
    border: 1px solid #222;
    border-radius: 2px;
  }

  .reset-btn {
    min-width: 24px;
    min-height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    background: transparent;
    border: none;
  }
  .reset-pin {
    background: #2b2f38;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: 1px solid #555;
    transition: background 0.15s, transform 0.15s;
  }
  .reset-btn:hover .reset-pin, .reset-btn:focus-visible .reset-pin {
    background: var(--citadelle-red);
    transform: scale(1.15);
  }
  .reset-pin.confirm-pulse {
    background: var(--citadelle-red);
    box-shadow: 0 0 8px var(--citadelle-red);
    animation: blink-rec 0.5s step-start infinite;
  }

  .controls-array {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  /* Accessible Touch Target Wrappers (min 44px) */
  .control-unit {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 9.5px;
    color: #888;
    user-select: none;
    cursor: pointer;
    min-height: 44px;
    padding: 0 4px;
    border-radius: 4px;
  }

  .tag-val { color: var(--citadelle-red); min-width: 28px; font-family: var(--font-mono-fallback); }

  .thumbwheel {
    width: 13px;
    height: 22px;
    background: repeating-linear-gradient(180deg, #111 0px, #111 2px, #333 3px, #111 4px);
    border: 1px solid #444;
    border-radius: 2px;
  }

  .rotary-knob {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: radial-gradient(circle, #2a2e36 0%, #101215 100%);
    border: 2px solid #363c48;
    position: relative;
    transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .rotary-knob::after {
    content: '';
    position: absolute;
    top: 2px;
    left: 10px;
    width: 2px;
    height: 7px;
    background: var(--citadelle-red);
    box-shadow: 0 0 4px var(--citadelle-red);
  }

  .lever-switch {
    width: 26px;
    height: 14px;
    background: #050505;
    border: 1px solid #333;
    border-radius: 10px;
    position: relative;
  }
  .lever-pin {
    width: 10px;
    height: 10px;
    background: #777;
    border-radius: 50%;
    position: absolute;
    top: 1px;
    left: 2px;
    transition: all 0.15s ease;
  }
  .lever-switch.active .lever-pin {
    left: 12px;
    background: var(--citadelle-red);
    box-shadow: 0 0 6px var(--citadelle-red);
  }

  /* ── 05. PIANO KEYS ── */
  .transport-deck {
    flex-shrink: 0;
    background: #111317;
    padding: 10px 14px;
    display: flex;
    gap: 8px;
  }

  .piano-key {
    flex: 1;
    min-height: 44px;
    background: linear-gradient(180deg, #22252c 0%, #131519 100%);
    border: 1px solid #30343e;
    border-radius: 4px;
    color: #999;
    font-family: var(--font-ui);
    font-size: 11px;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    cursor: pointer;
    box-shadow: 0 3px 0 #070809, 0 4px 6px rgba(0,0,0,0.7);
    transition: all 0.08s ease;
    user-select: none;
  }
  .piano-key:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 #070809, 0 2px 3px rgba(0,0,0,0.7);
  }

  .piano-key.rec-key { color: #fff; }
  .rec-lamp {
    width: 7px;
    height: 7px;
    background: var(--citadelle-red);
    border-radius: 50%;
    box-shadow: 0 0 6px var(--citadelle-red);
    animation: blink-rec 1.2s step-start infinite;
  }
  @keyframes blink-rec { 50% { opacity: 0.2; } }

  .rec-key.safe-mode { color: #666; border-color: #222; }
  .rec-key.safe-mode .rec-lamp {
    background: #444;
    box-shadow: none;
    animation: none;
  }

  .piano-key.pause-active {
    background: #1e1910;
    border-color: var(--amber-pause);
    color: var(--amber-pause);
    transform: translateY(2px);
    box-shadow: 0 1px 0 #070809;
  }

  /* UPRIGHT SURGICAL SCISSORS (OLIVETTI 44 SILHOUETTE) */
  .scissor-key {
    flex: 1.1;
    border-color: #4a2228;
    color: #ff8888;
  }
  .scissor-svg {
    width: 20px;
    height: 20px;
    stroke: currentColor;
    stroke-width: 1.8;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    display: block;
  }

  /* ── 📱 MOBILE BREAKPOINT ── */
  @media (max-width: 640px) {
    body { padding: 4px; }
    .telemetry-strip { display: none; }
    
    .cassette-window .drop-hint { content: "[ TAP TO LOAD TXT ]"; }
    
    .deck-dashboard {
      flex-direction: column;
      gap: 8px;
      padding: 6px 10px;
    }
    
    .odometer-housing {
      width: 100%;
      justify-content: space-between;
    }
    
    .controls-array {
      width: 100%;
      justify-content: space-between;
      gap: 4px;
    }
    
    .control-unit {
      font-size: 8.5px;
      gap: 3px;
      padding: 0 2px;
    }
    
    .transport-deck {
      padding: 8px 10px;
      gap: 6px;
    }
    
    .piano-key {
      min-height: 42px;
      font-size: 9.5px;
      letter-spacing: 0.5px;
      gap: 4px;
    }
  }
</style>
</head>
<body>

<div class="uher-console" role="region" aria-label="Uher 5000 Magnetic Word Console">
  <!-- 01. CASSETTE BAY -->
  <div class="cassette-bay">
    <div class="cassette-shell" id="cassette-drop" role="button" tabindex="0" aria-label="Load text file (click or drop .txt)">
      <div class="cassette-spool" id="spool-left" aria-hidden="true"></div>
      <div class="cassette-window">
        <span class="tape-title">SCOTCH C-90 // QUEER.SYS</span>
        <span class="drop-hint" id="cassette-hint">[ LOAD / DROP TXT ]</span>
      </div>
      <div class="cassette-spool" id="spool-right" aria-hidden="true"></div>
      <input type="file" id="file-input" accept=".txt" style="display:none;" aria-hidden="true">
    </div>
    
    <div class="telemetry-strip" aria-live="polite">
      <span>FLUX: <b>320 nWb/m</b></span>
      <span>WEAR: <b>0.08mm</b></span>
      <span>STATE: <b id="status-state" role="status">ARMED</b></span>
    </div>
  </div>

  <!-- 02. OLIVETTI SYRINGE GAUGE -->
  <div class="syringe-bay" aria-hidden="true">
    <svg viewBox="0 0 800 22" width="100%" height="22" fill="none" xmlns="http://www.w3.org/2000/svg">
      <line x1="2" y1="11" x2="60" y2="11" stroke="#666" stroke-width="1.5"/>
      <polygon points="58,8 68,11 58,14" fill="#666"/>
      <rect x="68" y="2" width="640" height="18" rx="2" stroke="#333" stroke-width="1.5" fill="#08090b"/>
      <rect id="syringe-fluid" x="70" y="4" width="20" height="14" rx="1" fill="url(#redGrip)"/>
      <path d="M120 2v5 M180 2v9 M240 2v5 M300 2v9 M360 2v5 M420 2v9 M480 2v5 M540 2v9 M600 2v5 M660 2v9" stroke="#222" stroke-width="1.5"/>
      <rect x="708" y="8" width="60" height="6" fill="#333"/>
      <circle cx="778" cy="11" r="8" stroke="#444" stroke-width="2"/>
      <defs>
        <linearGradient id="redGrip" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#7a050f"/>
          <stop offset="100%" stop-color="#ff1a2a"/>
        </linearGradient>
      </defs>
    </svg>
  </div>

  <!-- 03. TAPE BUFFER -->
  <div class="tape-bay">
    <label for="tape-buffer" class="sr-only" style="display:none;">Magnetic Text Buffer</label>
    <textarea id="tape-buffer" class="tape-ribbon" spellcheck="false" placeholder="RECORD HEAD ENGAGED • TYPE OR LOAD TRANSMISSION..." aria-label="Magnetic Text Buffer"></textarea>
  </div>

  <!-- 04. CONTROL DASHBOARD -->
  <div class="deck-dashboard">
    <!-- Odometer -->
    <div class="odometer-housing" role="status" aria-live="polite" aria-label="Word count">
      <span class="odometer-label">WORDS</span>
      <div class="odometer-digits" aria-hidden="true">
        <div class="digit-drum" id="d3">0</div>
        <div class="digit-drum" id="d2">0</div>
        <div class="digit-drum" id="d1">0</div>
        <div class="digit-drum" id="d0">0</div>
      </div>
      <div class="reset-btn" id="reset-counter" role="button" tabindex="0" title="Zero Counter (Double tap to erase)" aria-label="Reset word counter and erase buffer">
        <div class="reset-pin" id="reset-pin"></div>
      </div>
    </div>

    <!-- Knobs & Controls (Accessible role='button') -->
    <div class="controls-array">
      <!-- BIAS -->
      <div class="control-unit" id="bias-ctrl" role="button" tabindex="0" title="Cycle Magnetic Saturation" aria-label="Tape bias saturation: RAW, SAT, HOT">
        <span>BIAS</span>
        <div class="thumbwheel" aria-hidden="true"></div>
        <span class="tag-val" id="bias-val">RAW</span>
      </div>

      <!-- VARISPEED -->
      <div class="control-unit" id="speed-ctrl" role="button" tabindex="0" title="Pitch-Shift Font Engine" aria-label="Varispeed font engine: Olivetti M15 or WSB">
        <span>VARISPD</span>
        <div class="thumbwheel" aria-hidden="true"></div>
        <span class="tag-val" id="speed-val">M15</span>
      </div>

      <!-- FOLD-IN -->
      <div class="control-unit" id="fold-ctrl" role="button" tabindex="0" title="Toggle Burroughs Fold-In" aria-label="Burroughs vertical fold-in lever switch">
        <span>FOLD</span>
        <div class="lever-switch" id="fold-lever" aria-hidden="true">
          <div class="lever-pin"></div>
        </div>
      </div>

      <!-- 3RD MIND -->
      <div class="control-unit" id="third-mind-ctrl" role="button" tabindex="0" title="Dial 3rd Mind Bleed Ratio" aria-label="Third mind ghost bleed potentiometer">
        <span>3RD</span>
        <div class="rotary-knob" id="knob-3rd" aria-hidden="true"></div>
        <span class="tag-val" id="mind-val">0%</span>
      </div>
    </div>
  </div>

  <!-- 05. PIANO KEYS -->
  <div class="transport-deck">
    <button class="piano-key rec-key" id="btn-rec" aria-label="Toggle Write-Protect or Armed mode">
      <div class="rec-lamp" aria-hidden="true"></div><span id="rec-label">REC</span>
    </button>
    
    <button class="piano-key" id="btn-pause" aria-label="Freeze tape transport capstan">PAUSE</button>
    
    <!-- AUTHENTIC SURGICAL SCISSORS (NO MORE '%') -->
    <button class="piano-key scissor-key" id="btn-cut" title="Burroughs Scissor Cut-Up" aria-label="Burroughs Scissor Cut-Up (Slice & Shuffle)">
      <svg class="scissor-svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <!-- Finger loops at bottom -->
        <circle cx="7.5" cy="18.5" r="2.5"/>
        <circle cx="16.5" cy="18.5" r="2.5"/>
        <!-- Shanks crossing at fulcrum (12, 11.5) to open tips -->
        <path d="M9.2 16.5 L12 11.5 L18 3.5"/>
        <path d="M14.8 16.5 L12 11.5 L6 3.5"/>
        <!-- Pivot screw -->
        <circle cx="12" cy="11.5" r="0.8" fill="currentColor"/>
      </svg>
    </button>
    
    <button class="piano-key" id="btn-eject" aria-label="Eject dispatch as text file">EJECT [TXT]</button>
  </div>
</div>
<script>
  const buffer = document.getElementById('tape-buffer');
  const d3 = document.getElementById('d3');
  const d2 = document.getElementById('d2');
  const d1 = document.getElementById('d1');
  const d0 = document.getElementById('d0');
  const fluid = document.getElementById('syringe-fluid');
  const statusState = document.getElementById('status-state');
  const spoolLeft = document.getElementById('spool-left');
  const spoolRight = document.getElementById('spool-right');
  const resetBtn = document.getElementById('reset-counter');
  const resetPin = document.getElementById('reset-pin');
  const foldLever = document.getElementById('fold-lever');
  const knob = document.getElementById('knob-3rd');
  const mindVal = document.getElementById('mind-val');

  let rawDryText = "";
  let isRecordArmed = true;
  let isPaused = false;
  let isFolded = false;
  let resetPending = false;
  let resetTimer = null;

  // ── 3RD MIND ARCHIVE (Burroughs Queer / Yage / Nova Transmissions) ──
  const GHOST_FRAGMENTS = [
    "seeking telepathic contact across silence",
    "in Ship Ahoy listening to ceiling fan chop",
    "the green sickness of the river jungle",
    "unreciprocated dispatches sent through ether",
    "third mind appears between two intersections",
    "word lines cut down the middle",
    "yage vine creeping along limestone",
    "the sender is dead but tape still squeals",
    "mercury vapor light humming in the hotel lobby",
    "intercepted transmission from south of the border"
  ];

  // Flash Status Telemetry
  function flashStatus(msg, duration = 1800) {
    const prev = statusState.textContent;
    statusState.textContent = msg;
    statusState.style.color = 'var(--citadelle-red)';
    setTimeout(() => {
      statusState.textContent = isPaused ? 'PAUSED' : (isRecordArmed ? 'ARMED' : 'LOCKED');
      statusState.style.color = isPaused ? 'var(--amber-pause)' : (isRecordArmed ? 'var(--citadelle-red)' : '#888');
    }, duration);
  }

  // Live Counter & Syringe Fill
  function updateTelemetry() {
    const text = buffer.value.trim();
    const words = text ? text.split(/\s+/).length : 0;
    
    const padded = String(Math.min(words, 9999)).padStart(4, '0');
    d3.textContent = padded[0];
    d2.textContent = padded[1];
    d1.textContent = padded[2];
    d0.textContent = padded[3];

    const fluidWidth = Math.min(20 + (words * 2.5), 636);
    fluid.setAttribute('width', fluidWidth);
  }

  // ── SOLVED: FOLD / 3RD-MIND EDIT LOSS ("AUTO-BAKE ON INPUT") ──
  buffer.addEventListener('input', () => {
    if (isFolded || currentBleed > 0) {
      // User typed into a modified state: auto-commit as new magnetic baseline
      rawDryText = buffer.value;
      if (isFolded) {
        isFolded = false;
        foldLever.classList.remove('active');
      }
      if (currentBleed > 0) {
        currentBleed = 0;
        bleedIdx = 0;
        mindVal.textContent = '0%';
        knob.style.transform = 'rotate(0deg)';
      }
      flashStatus('COMMITTED TO TAPE', 1200);
    } else {
      rawDryText = buffer.value;
    }
    updateTelemetry();
  });

  // 1. REC KEY (RECORD ARMED <-> WRITE-PROTECT)
  const btnRec = document.getElementById('btn-rec');
  const recLabel = document.getElementById('rec-label');

  btnRec.addEventListener('click', () => {
    isRecordArmed = !isRecordArmed;
    if (isRecordArmed) {
      buffer.readOnly = isPaused;
      buffer.classList.remove('locked');
      btnRec.classList.remove('safe-mode');
      recLabel.textContent = 'REC';
      statusState.textContent = isPaused ? 'PAUSED' : 'ARMED';
      statusState.style.color = isPaused ? 'var(--amber-pause)' : 'var(--citadelle-red)';
    } else {
      buffer.readOnly = true;
      buffer.classList.add('locked');
      btnRec.classList.add('safe-mode');
      recLabel.textContent = 'SAFE';
      statusState.textContent = 'LOCKED';
      statusState.style.color = '#888';
    }
  });

  // 2. PAUSE KEY (CAPSTAN FREEZE)
  const btnPause = document.getElementById('btn-pause');

  btnPause.addEventListener('click', () => {
    isPaused = !isPaused;
    btnPause.classList.toggle('pause-active', isPaused);
    spoolLeft.classList.toggle('paused', isPaused);
    spoolRight.classList.toggle('paused', isPaused);

    if (isPaused) {
      buffer.readOnly = true;
      statusState.textContent = 'PAUSED';
      statusState.style.color = 'var(--amber-pause)';
    } else {
      buffer.readOnly = !isRecordArmed;
      statusState.textContent = isRecordArmed ? 'ARMED' : 'LOCKED';
      statusState.style.color = isRecordArmed ? 'var(--citadelle-red)' : '#888';
    }
  });

  // 3. TWO-STAGE RESET BUTTON (DOUBLE-TAP TO ERASE)
  resetBtn.addEventListener('click', () => {
    if (!isRecordArmed || isPaused) {
      flashStatus('LOCKED • CANNOT ERASE');
      return;
    }

    if (!buffer.value.trim()) {
      rawDryText = '';
      updateTelemetry();
      return;
    }

    if (!resetPending) {
      resetPending = true;
      resetPin.classList.add('confirm-pulse');
      flashStatus('TAP AGAIN TO ERASE', 3000);
      resetTimer = setTimeout(() => {
        resetPending = false;
        resetPin.classList.remove('confirm-pulse');
      }, 3000);
    } else {
      clearTimeout(resetTimer);
      resetPending = false;
      resetPin.classList.remove('confirm-pulse');
      buffer.value = '';
      rawDryText = '';
      isFolded = false;
      foldLever.classList.remove('active');
      currentBleed = 0;
      bleedIdx = 0;
      mindVal.textContent = '0%';
      knob.style.transform = 'rotate(0deg)';
      updateTelemetry();
      flashStatus('TAPE CLEARED');
    }
  });

  // 4. BIAS WHEEL (RAW -> SAT -> HOT)
  const biasModes = ['RAW', 'SAT', 'HOT'];
  let biasIdx = 0;
  document.getElementById('bias-ctrl').addEventListener('click', () => {
    biasIdx = (biasIdx + 1) % biasModes.length;
    const mode = biasModes[biasIdx];
    document.getElementById('bias-val').textContent = mode;
    buffer.classList.remove('bias-sat', 'bias-hot');
    if (mode === 'SAT') buffer.classList.add('bias-sat');
    if (mode === 'HOT') buffer.classList.add('bias-hot');
  });

  // 5. VARISPEED (OLIVETTI M15 <-> WSB BURROUGHS)
  let isWSB = false;
  document.getElementById('speed-ctrl').addEventListener('click', () => {
    isWSB = !isWSB;
    if (isWSB) {
      buffer.style.fontFamily = "'WSB', var(--font-mono-fallback)";
      buffer.style.fontSize = "18px";
      document.getElementById('speed-val').textContent = 'WSB';
    } else {
      buffer.style.fontFamily = "'Olivetti-M15', var(--font-mono-fallback)";
      buffer.style.fontSize = "15px";
      document.getElementById('speed-val').textContent = 'M15';
    }
  });

  // 6. FOLD-IN TOGGLE LEVER (Vertical Split & Interleave)
  document.getElementById('fold-ctrl').addEventListener('click', () => {
    if (isPaused || !isRecordArmed) return;
    isFolded = !isFolded;
    foldLever.classList.toggle('active', isFolded);

    if (isFolded) {
      if (!rawDryText && buffer.value) rawDryText = buffer.value;
      const lines = buffer.value.split('\n');
      buffer.value = lines.map(line => {
        if (!line.trim()) return line;
        const mid = Math.floor(line.length / 2);
        return line.slice(mid).trim() + " // " + line.slice(0, mid).trim();
      }).join('\n');
    } else {
      buffer.value = rawDryText || buffer.value;
    }
    updateTelemetry();
  });

  // 7. DETERMINISTIC 3RD-MIND BLEED DIAL (0% -> 25% -> 50% -> 75% -> 100%)
  const bleedSteps = [0, 25, 50, 75, 100];
  let bleedIdx = 0;
  let currentBleed = 0;

  document.getElementById('third-mind-ctrl').addEventListener('click', () => {
    if (isPaused || !isRecordArmed) return;
    bleedIdx = (bleedIdx + 1) % bleedSteps.length;
    currentBleed = bleedSteps[bleedIdx];
    mindVal.textContent = currentBleed + '%';
    knob.style.transform = `rotate(${bleedIdx * 65}deg)`;

    applyDeterministicThirdMind();
  });

  function applyDeterministicThirdMind() {
    if (!rawDryText && buffer.value) rawDryText = buffer.value;
    if (!rawDryText.trim()) return;

    if (currentBleed === 0) {
      buffer.value = rawDryText;
    } else {
      const words = rawDryText.split(/\s+/);
      const injected = [];
      // Deterministic spacing based on bleed percentage
      const interval = Math.max(2, Math.floor(12 / (currentBleed / 10)));

      words.forEach((w, i) => {
        injected.push(w);
        if (i > 0 && i % interval === 0) {
          // Deterministic fragment selection so it does not re-roll chaotically
          const fragment = GHOST_FRAGMENTS[(i + currentBleed) % GHOST_FRAGMENTS.length];
          injected.push(`[${fragment}]`);
        }
      });
      buffer.value = injected.join(' ');
    }
    updateTelemetry();
  }

  // 8. SCISSOR KEY (SURGICAL CUT-UP ONLY)
  document.getElementById('btn-cut').addEventListener('click', () => {
    if (!isRecordArmed || isPaused) return;
    const text = buffer.value.trim();
    if (!text) return;
    const pieces = text.split(/([.,!?;:\n]+|\s{2,})/);
    for (let i = pieces.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pieces[i], pieces[j]] = [pieces[j], pieces[i]];
    }
    buffer.value = pieces.join(' ').replace(/\s+/g, ' ').trim();
    rawDryText = buffer.value; // Cut-up permanently bakes into baseline
    updateTelemetry();
    flashStatus('TAPE SPLICED');
  });

  // 9. CASSETTE LOAD / DROP TXT
  const dropBay = document.getElementById('cassette-drop');
  const fileInput = document.getElementById('file-input');

  dropBay.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', (e) => {
    if (e.target.files.length) loadFile(e.target.files[0]);
  });

  dropBay.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropBay.style.borderColor = 'var(--citadelle-red)';
  });
  dropBay.addEventListener('dragleave', () => { dropBay.style.borderColor = ''; });
  dropBay.addEventListener('drop', (e) => {
    e.preventDefault();
    dropBay.style.borderColor = '';
    if (e.dataTransfer.files.length) loadFile(e.dataTransfer.files[0]);
  });

  function loadFile(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
      rawDryText = e.target.result;
      buffer.value = rawDryText;
      updateTelemetry();
      flashStatus('TAPE LOADED');
    };
    reader.readAsText(file);
  }

  // 10. EJECT TXT
  document.getElementById('btn-eject').addEventListener('click', () => {
    const blob = new Blob([buffer.value], { type: 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'queer_dispatch_' + Date.now() + '.txt';
    a.click();
    flashStatus('DISPATCH EJECTED');
  });

  // 11. KEYBOARD ACCESSIBILITY HELPER FOR [role="button"] DIVS
  document.querySelectorAll('[role="button"]').forEach(el => {
    el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        el.click();
      }
    });
  });
</script>
</body>
</html>
