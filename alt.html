<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>QUEER // UHER 5000 • TAPE CONSOLE</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  /* ── CUSTOM FONTS ── */
  @font-face {
    font-family: 'WSB';
    src: url('https://raw.githubusercontent.com/ghostm68/eg/main/fonts/wsb-regular.woff2') format('woff2');
    font-display: swap;
  }
  @font-face {
    font-family: 'Olivetti-M15';
    src: url('https://raw.githubusercontent.com/ghostm68/inktwo/main/fonts/Web437_Olivetti_M15.woff') format('woff');
    font-display: swap;
  }

  :root {
    --bg-black: #050607;
    --chassis: #0f1114;
    --bezel: #22262d;
    --citadelle-red: #ff1a2a;
    --amber-pause: #ffaa00;
    --red-glow: rgba(255, 26, 42, 0.45);
    --tape-blue: #0b1a29;
    --tape-blue-border: #1a3854;
    --phosphor-white: #e6edf3;
    --font-odometer: 'VT323', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg-black);
    color: var(--phosphor-white);
    font-family: 'Olivetti-M15', monospace;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 8px;
  }

  /* ── FULL VIEWPORT CHASSIS ── */
  .uher-console {
    width: 100%;
    max-width: 960px;
    height: 100%;
    max-height: 98dvh;
    background: linear-gradient(180deg, #15181d 0%, #0c0d10 100%);
    border: 2px solid var(--bezel);
    border-radius: 6px;
    box-shadow: 0 20px 80px rgba(0,0,0,0.95);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── 01. CASSETTE BAY ── */
  .cassette-bay {
    flex-shrink: 0;
    background: #08090b;
    border-bottom: 2px solid var(--bezel);
    padding: 8px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .cassette-shell {
    flex: 1;
    height: 50px;
    background: linear-gradient(180deg, rgba(14,35,56,0.9) 0%, rgba(7,17,28,0.95) 100%);
    border: 1px solid var(--tape-blue-border);
    border-radius: 4px;
    display: flex;
    align-items: center;
    padding: 0 10px;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  .cassette-shell:hover { border-color: var(--citadelle-red); }

  .cassette-spool {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: #000;
    border: 3px dashed #444;
    animation: spoolSpin 6s linear infinite;
    flex-shrink: 0;
  }
  .cassette-spool.paused { animation-play-state: paused; }
  @keyframes spoolSpin { 100% { transform: rotate(360deg); } }

  .cassette-window {
    flex: 1;
    margin: 0 8px;
    height: 34px;
    background: #04080d;
    border: 1px solid #142436;
    border-radius: 2px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    overflow: hidden;
  }

  .cassette-window .tape-title {
    color: #d1e2f2;
    font-size: 11px;
    letter-spacing: 1px;
    white-space: nowrap;
  }

  .cassette-window .drop-hint {
    font-size: 8.5px;
    color: var(--citadelle-red);
  }

  .telemetry-strip {
    display: flex;
    flex-direction: column;
    font-size: 9px;
    color: #4a5260;
    gap: 2px;
    min-width: 120px;
    flex-shrink: 0;
  }
  .telemetry-strip span b { color: #8c96a8; font-weight: normal; }

  /* ── 02. SYRINGE BUFFER GAUGE ── */
  .syringe-bay {
    flex-shrink: 0;
    background: #07080a;
    padding: 4px 14px;
    border-bottom: 2px solid var(--bezel);
  }

  /* ── 03. WRITING BAY ── */
  .tape-bay {
    flex: 1 1 0;
    min-height: 0;
    background: radial-gradient(circle at 50% 30%, #121419 0%, #08090b 100%);
    padding: 14px 18px;
    position: relative;
    display: flex;
  }

  .tape-ribbon {
    width: 100%;
    height: 100%;
    min-height: 0;
    background: transparent;
    border: none;
    outline: none;
    color: var(--phosphor-white);
    font-family: 'Olivetti-M15', monospace;
    font-size: 15px;
    line-height: 1.7;
    resize: none;
    caret-color: var(--citadelle-red);
    letter-spacing: 0.5px;
    overflow-y: auto;
  }
  .tape-ribbon::placeholder { color: #2a2f38; }

  .tape-ribbon.locked {
    opacity: 0.7;
    cursor: not-allowed;
  }

  .tape-ribbon.bias-sat { text-shadow: 0 0 6px rgba(255,255,255,0.4); }
  .tape-ribbon.bias-hot { color: #ffb3b8; text-shadow: 0 0 8px var(--citadelle-red), 0 0 16px var(--red-glow); }

  /* ── 04. CONTROL DASHBOARD (RESPONSIVE) ── */
  .deck-dashboard {
    flex-shrink: 0;
    background: #090b0d;
    padding: 8px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 2px solid var(--bezel);
    border-bottom: 2px solid #000;
  }

  .odometer-housing {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #000;
    padding: 3px 6px;
    border: 2px solid var(--bezel);
    border-radius: 4px;
    flex-shrink: 0;
  }

  .odometer-label { font-size: 9px; color: #555; letter-spacing: 1px; }
  .odometer-digits { display: flex; gap: 2px; }

  .digit-drum {
    background: #111;
    color: #f0f0f0;
    font-family: var(--font-odometer);
    font-size: 20px;
    line-height: 1;
    width: 15px;
    text-align: center;
    border: 1px solid #222;
    border-radius: 2px;
  }

  .reset-btn {
    background: #252830;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    border: 1px solid #444;
    cursor: pointer;
  }
  .reset-btn:active { background: var(--citadelle-red); }

  .controls-array {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .control-unit {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 9.5px;
    color: #777;
    user-select: none;
    cursor: pointer;
  }

  .tag-val { color: var(--citadelle-red); min-width: 28px; }

  .thumbwheel {
    width: 12px;
    height: 20px;
    background: repeating-linear-gradient(180deg, #111 0px, #111 2px, #333 3px, #111 4px);
    border: 1px solid #444;
    border-radius: 2px;
  }

  .rotary-knob {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: radial-gradient(circle, #2a2e36 0%, #101215 100%);
    border: 2px solid #363c48;
    position: relative;
    transition: transform 0.15s ease;
  }
  .rotary-knob::after {
    content: '';
    position: absolute;
    top: 2px;
    left: 9px;
    width: 2px;
    height: 6px;
    background: var(--citadelle-red);
    box-shadow: 0 0 4px var(--citadelle-red);
  }

  .lever-switch {
    width: 24px;
    height: 13px;
    background: #050505;
    border: 1px solid #333;
    border-radius: 10px;
    position: relative;
  }
  .lever-pin {
    width: 9px;
    height: 9px;
    background: #777;
    border-radius: 50%;
    position: absolute;
    top: 1px;
    left: 2px;
    transition: all 0.15s ease;
  }
  .lever-switch.active .lever-pin {
    left: 11px;
    background: var(--citadelle-red);
    box-shadow: 0 0 6px var(--citadelle-red);
  }

  /* ── 05. PIANO KEYS ── */
  .transport-deck {
    flex-shrink: 0;
    background: #111317;
    padding: 10px 14px;
    display: flex;
    gap: 8px;
  }

  .piano-key {
    flex: 1;
    height: 42px;
    background: linear-gradient(180deg, #22252c 0%, #131519 100%);
    border: 1px solid #30343e;
    border-radius: 4px;
    color: #999;
    font-family: inherit;
    font-size: 10.5px;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    cursor: pointer;
    box-shadow: 0 3px 0 #070809, 0 4px 6px rgba(0,0,0,0.7);
    transition: all 0.08s ease;
    user-select: none;
  }
  .piano-key:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 #070809, 0 2px 3px rgba(0,0,0,0.7);
  }

  /* REC ACTIVE / SAFE STATES */
  .piano-key.rec-key { color: #fff; }
  .rec-lamp {
    width: 7px;
    height: 7px;
    background: var(--citadelle-red);
    border-radius: 50%;
    box-shadow: 0 0 6px var(--citadelle-red);
    animation: blink-rec 1.2s step-start infinite;
  }
  @keyframes blink-rec { 50% { opacity: 0.2; } }

  .rec-key.safe-mode {
    color: #666;
    border-color: #222;
  }
  .rec-key.safe-mode .rec-lamp {
    background: #444;
    box-shadow: none;
    animation: none;
  }

  /* PAUSE ACTIVE STATE */
  .piano-key.pause-active {
    background: #1e1910;
    border-color: var(--amber-pause);
    color: var(--amber-pause);
    transform: translateY(2px);
    box-shadow: 0 1px 0 #070809;
  }

  /* SCISSOR KEY */
  .scissor-key {
    flex: 1.1;
    border-color: #4a2228;
    color: #ff8888;
  }
  .scissor-key svg {
    width: 18px;
    height: 18px;
    stroke: currentColor;
    stroke-width: 1.8;
    fill: none;
  }

  /* ── 📱 MOBILE BREAKPOINT (<= 640PX) ── */
  @media (max-width: 640px) {
    body { padding: 4px; }
    .telemetry-strip { display: none; } /* Free up header space */
    
    .deck-dashboard {
      flex-direction: column;
      gap: 8px;
      padding: 6px 10px;
    }
    
    .odometer-housing {
      width: 100%;
      justify-content: space-between;
    }
    
    .controls-array {
      width: 100%;
      justify-content: space-between;
      gap: 8px;
    }
    
    .control-unit {
      font-size: 8.5px;
      gap: 3px;
    }
    
    .transport-deck {
      padding: 8px 10px;
      gap: 6px;
    }
    
    .piano-key {
      height: 38px;
      font-size: 9px;
      letter-spacing: 0.5px;
      gap: 4px;
    }
  }
</style>
</head>
<body>

<div class="uher-console">
  <!-- 01. CASSETTE BAY -->
  <div class="cassette-bay">
    <div class="cassette-shell" id="cassette-drop" title="Click or Drop .TXT to load tape">
      <div class="cassette-spool" id="spool-left"></div>
      <div class="cassette-window">
        <span class="tape-title">SCOTCH C-90 // QUEER.SYS</span>
        <span class="drop-hint">[ LOAD / DROP TXT ]</span>
      </div>
      <div class="cassette-spool" id="spool-right"></div>
      <input type="file" id="file-input" accept=".txt" style="display:none;">
    </div>
    
    <div class="telemetry-strip">
      <span>FLUX: <b>320 nWb/m</b></span>
      <span>WEAR: <b>0.08mm</b></span>
      <span>STATE: <b id="status-state">ARMED</b></span>
    </div>
  </div>

  <!-- 02. OLIVETTI SYRINGE GAUGE -->
  <div class="syringe-bay">
    <svg viewBox="0 0 800 22" width="100%" height="22" fill="none" xmlns="http://www.w3.org/2000/svg">
      <line x1="2" y1="11" x2="60" y2="11" stroke="#666" stroke-width="1.5"/>
      <polygon points="58,8 68,11 58,14" fill="#666"/>
      <rect x="68" y="2" width="640" height="18" rx="2" stroke="#333" stroke-width="1.5" fill="#08090b"/>
      <rect id="syringe-fluid" x="70" y="4" width="20" height="14" rx="1" fill="url(#redGrip)"/>
      <path d="M120 2v5 M180 2v9 M240 2v5 M300 2v9 M360 2v5 M420 2v9 M480 2v5 M540 2v9 M600 2v5 M660 2v9" stroke="#222" stroke-width="1.5"/>
      <rect x="708" y="8" width="60" height="6" fill="#333"/>
      <circle cx="778" cy="11" r="8" stroke="#444" stroke-width="2"/>
      <defs>
        <linearGradient id="redGrip" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#7a050f"/>
          <stop offset="100%" stop-color="#ff1a2a"/>
        </linearGradient>
      </defs>
    </svg>
  </div>

  <!-- 03. TAPE BUFFER -->
  <div class="tape-bay">
    <textarea id="tape-buffer" class="tape-ribbon" spellcheck="false" placeholder="RECORD HEAD ENGAGED • TYPE OR LOAD TRANSMISSION..."></textarea>
  </div>

  <!-- 04. RESPONSIVE DASHBOARD: ODOMETER + CONTROLS -->
  <div class="deck-dashboard">
    <!-- Odometer (Row 1 on mobile) -->
    <div class="odometer-housing">
      <span class="odometer-label">WORDS</span>
      <div class="odometer-digits">
        <div class="digit-drum" id="d3">0</div>
        <div class="digit-drum" id="d2">0</div>
        <div class="digit-drum" id="d1">0</div>
        <div class="digit-drum" id="d0">0</div>
      </div>
      <div class="reset-btn" id="reset-counter" title="Erase Tape Buffer"></div>
    </div>

    <!-- Knobs (Row 2 on mobile) -->
    <div class="controls-array">
      <!-- BIAS -->
      <div class="control-unit" id="bias-ctrl" title="Tape Saturation">
        <span>BIAS</span>
        <div class="thumbwheel"></div>
        <span class="tag-val" id="bias-val">RAW</span>
      </div>

      <!-- VARISPEED -->
      <div class="control-unit" id="speed-ctrl" title="Pitch-Shift Font">
        <span>VARISPD</span>
        <div class="thumbwheel"></div>
        <span class="tag-val" id="speed-val">M15</span>
      </div>

      <!-- FOLD-IN -->
      <div class="control-unit" title="Burroughs Fold-In">
        <span>FOLD</span>
        <div class="lever-switch" id="fold-lever">
          <div class="lever-pin"></div>
        </div>
      </div>

      <!-- 3RD MIND -->
      <div class="control-unit" id="third-mind-ctrl" title="3rd Mind Bleed">
        <span>3RD</span>
        <div class="rotary-knob" id="knob-3rd"></div>
        <span class="tag-val" id="mind-val">0%</span>
      </div>
    </div>
  </div>

  <!-- 05. PIANO KEYS -->
  <div class="transport-deck">
    <!-- REC: Toggles Record-Armed / Write-Protect -->
    <button class="piano-key rec-key" id="btn-rec" title="Toggle Write-Protect / Armed State">
      <div class="rec-lamp"></div><span id="rec-label">REC</span>
    </button>
    
    <!-- PAUSE: Freezes Motor & Buffer -->
    <button class="piano-key" id="btn-pause" title="Freeze Tape Capstan">PAUSE</button>
    
    <!-- CUT-UP SCISSORS -->
    <button class="piano-key scissor-key" id="btn-cut" title="Burroughs Scissor Cut-Up">
      <svg viewBox="0 0 24 24">
        <circle cx="6" cy="6" r="3"/>
        <circle cx="6" cy="18" r="3"/>
        <line x1="8.5" y1="8.5" x2="20" y2="20"/>
        <line x1="8.5" y1="15.5" x2="20" y2="4"/>
      </svg>
    </button>
    
    <!-- EJECT -->
    <button class="piano-key" id="btn-eject">EJECT [TXT]</button>
  </div>
</div>

<script>
  const buffer = document.getElementById('tape-buffer');
  const d3 = document.getElementById('d3');
  const d2 = document.getElementById('d2');
  const d1 = document.getElementById('d1');
  const d0 = document.getElementById('d0');
  const fluid = document.getElementById('syringe-fluid');
  const statusState = document.getElementById('status-state');
  const spoolLeft = document.getElementById('spool-left');
  const spoolRight = document.getElementById('spool-right');

  let rawDryText = "";
  let isRecordArmed = true;
  let isPaused = false;

  const GHOST_FRAGMENTS = [
    "seeking telepathic contact across silence",
    "in Ship Ahoy listening to ceiling fan chop",
    "the green sickness of the river jungle",
    "unreciprocated dispatches sent through ether",
    "third mind appears between two intersections",
    "word lines cut down the middle",
    "yage vine creeping along the limestone",
    "the sender is dead but tape still squeals"
  ];

  function updateTelemetry() {
    const text = buffer.value.trim();
    const words = text ? text.split(/\s+/).length : 0;
    
    const padded = String(Math.min(words, 9999)).padStart(4, '0');
    d3.textContent = padded[0];
    d2.textContent = padded[1];
    d1.textContent = padded[2];
    d0.textContent = padded[3];

    const fluidWidth = Math.min(20 + (words * 2.5), 636);
    fluid.setAttribute('width', fluidWidth);
  }

  buffer.addEventListener('input', () => {
    if (currentBleed === 0 && !isFolded) {
      rawDryText = buffer.value;
    }
    updateTelemetry();
  });

  // 1. REC KEY (TOGGLE RECORD ARMED <-> SAFE WRITE-PROTECT)
  const btnRec = document.getElementById('btn-rec');
  const recLabel = document.getElementById('rec-label');

  btnRec.addEventListener('click', () => {
    isRecordArmed = !isRecordArmed;
    if (isRecordArmed) {
      buffer.readOnly = false;
      buffer.classList.remove('locked');
      btnRec.classList.remove('safe-mode');
      recLabel.textContent = 'REC';
      statusState.textContent = 'ARMED';
      statusState.style.color = '#ff1a2a';
    } else {
      buffer.readOnly = true;
      buffer.classList.add('locked');
      btnRec.classList.add('safe-mode');
      recLabel.textContent = 'SAFE';
      statusState.textContent = 'LOCKED';
      statusState.style.color = '#888';
    }
  });

  // 2. PAUSE KEY (FREEZE TAPE CAPSTAN)
  const btnPause = document.getElementById('btn-pause');

  btnPause.addEventListener('click', () => {
    isPaused = !isPaused;
    btnPause.classList.toggle('pause-active', isPaused);
    spoolLeft.classList.toggle('paused', isPaused);
    spoolRight.classList.toggle('paused', isPaused);

    if (isPaused) {
      buffer.readOnly = true;
      statusState.textContent = 'PAUSED';
      statusState.style.color = 'var(--amber-pause)';
    } else {
      buffer.readOnly = !isRecordArmed;
      statusState.textContent = isRecordArmed ? 'ARMED' : 'LOCKED';
      statusState.style.color = isRecordArmed ? '#ff1a2a' : '#888';
    }
  });

  // 3. RESET COUNTER / ERASE
  document.getElementById('reset-counter').addEventListener('click', () => {
    if (!isRecordArmed || isPaused) return;
    buffer.value = '';
    rawDryText = '';
    updateTelemetry();
  });

  // 4. BIAS WHEEL
  const biasModes = ['RAW', 'SAT', 'HOT'];
  let biasIdx = 0;
  document.getElementById('bias-ctrl').addEventListener('click', () => {
    biasIdx = (biasIdx + 1) % biasModes.length;
    const mode = biasModes[biasIdx];
    document.getElementById('bias-val').textContent = mode;
    buffer.classList.remove('bias-sat', 'bias-hot');
    if (mode === 'SAT') buffer.classList.add('bias-sat');
    if (mode === 'HOT') buffer.classList.add('bias-hot');
  });

  // 5. VARISPEED (FONT ENGINE PITCH-SHIFT)
  let isWSB = false;
  document.getElementById('speed-ctrl').addEventListener('click', () => {
    isWSB = !isWSB;
    if (isWSB) {
      buffer.style.fontFamily = "'WSB', monospace";
      buffer.style.fontSize = "18px";
      document.getElementById('speed-val').textContent = 'WSB';
    } else {
      buffer.style.fontFamily = "'Olivetti-M15', monospace";
      buffer.style.fontSize = "15px";
      document.getElementById('speed-val').textContent = 'M15';
    }
  });

  // 6. 3RD MIND BLEED POTENTIOMETER
  const bleedSteps = [0, 25, 50, 75, 100];
  let bleedIdx = 0;
  let currentBleed = 0;
  const knob = document.getElementById('knob-3rd');
  const mindVal = document.getElementById('mind-val');

  document.getElementById('third-mind-ctrl').addEventListener('click', () => {
    if (isPaused) return;
    bleedIdx = (bleedIdx + 1) % bleedSteps.length;
    currentBleed = bleedSteps[bleedIdx];
    mindVal.textContent = currentBleed + '%';
    knob.style.transform = `rotate(${bleedIdx * 65}deg)`;

    applyThirdMind();
  });

  function applyThirdMind() {
    if (!rawDryText && buffer.value) rawDryText = buffer.value;
    if (!rawDryText.trim()) return;

    if (currentBleed === 0) {
      buffer.value = rawDryText;
    } else {
      const words = rawDryText.split(/\s+/);
      const injected = [];
      const interval = Math.max(2, Math.floor(10 / (currentBleed / 10)));

      words.forEach((w, i) => {
        injected.push(w);
        if (i > 0 && i % interval === 0) {
          const ghost = GHOST_FRAGMENTS[Math.floor(Math.random() * GHOST_FRAGMENTS.length)];
          injected.push(`[${ghost}]`);
        }
      });
      buffer.value = injected.join(' ');
    }
    updateTelemetry();
  }

  // 7. FOLD-IN TOGGLE LEVER
  let isFolded = false;
  const foldLever = document.getElementById('fold-lever');

  foldLever.addEventListener('click', () => {
    if (isPaused) return;
    isFolded = !isFolded;
    foldLever.classList.toggle('active', isFolded);

    if (isFolded) {
      if (!rawDryText && buffer.value) rawDryText = buffer.value;
      const lines = buffer.value.split('\n');
      buffer.value = lines.map(line => {
        const mid = Math.floor(line.length / 2);
        return line.slice(mid).trim() + " // " + line.slice(0, mid).trim();
      }).join('\n');
    } else {
      buffer.value = rawDryText || buffer.value;
    }
    updateTelemetry();
  });

  // 8. SCISSOR KEY (PURE CUT-UP)
  document.getElementById('btn-cut').addEventListener('click', () => {
    if (!isRecordArmed || isPaused) return;
    const text = buffer.value.trim();
    if (!text) return;
    const pieces = text.split(/([.,!?;:\n]+|\s{2,})/);
    for (let i = pieces.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pieces[i], pieces[j]] = [pieces[j], pieces[i]];
    }
    buffer.value = pieces.join(' ').replace(/\s+/g, ' ').trim();
    rawDryText = buffer.value;
    updateTelemetry();
  });

  // 9. CASSETTE LOAD / DROP TXT
  const dropBay = document.getElementById('cassette-drop');
  const fileInput = document.getElementById('file-input');

  dropBay.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', (e) => {
    if (e.target.files.length) loadFile(e.target.files[0]);
  });

  dropBay.addEventListener('dragover', (e) => { e.preventDefault(); dropBay.style.borderColor = '#ff1a2a'; });
  dropBay.addEventListener('dragleave', () => { dropBay.style.borderColor = ''; });
  dropBay.addEventListener('drop', (e) => {
    e.preventDefault();
    dropBay.style.borderColor = '';
    if (e.dataTransfer.files.length) loadFile(e.dataTransfer.files[0]);
  });

  function loadFile(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
      rawDryText = e.target.result;
      buffer.value = rawDryText;
      updateTelemetry();
    };
    reader.readAsText(file);
  }

  // 10. EJECT TXT
  document.getElementById('btn-eject').addEventListener('click', () => {
    const blob = new Blob([buffer.value], { type: 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'queer_tape_dispatch_' + Date.now() + '.txt';
    a.click();
  });
</script>
</body>
</html>
