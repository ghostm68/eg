<!doctype html>
<html lang="en">

<head>
    <title>Contact Us | Wordstar Nexus</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="icon" type="image/png" href="/svg/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="/svg/favicon.svg" />
<link rel="shortcut icon" href="/svg/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="/svg/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-title" content="wordstar" />
<link rel="manifest" href="/svg/site.webmanifest" />
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="./main.css/main.css">
</head>

<body>
    <section class="ftco-section">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-12">
                    <div class="wrapper">
                        <div class="row no-gutters">
                            
                            <!-- FORM COLUMN -->
                            <div class="col-lg-6">
                                <div class="contact-wrap w-100 p-md-5 p-4">
                                    <h3>Contact</h3>
                                    <p class="mb-4">Fill out the details below to compose your message.</p>

                                    <div class="row mb-4">
                                        <div class="col-md-6">
                                            <div class="dbox w-100 d-flex align-items-start">
                                                <div class="text">
                                                    <p><span>Email:</span> 
                                                        <a href="mailto:contact@wordstar.nexus">contact@wordstar.nexus</a>
                                                    </p>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- DIRECT FORM -->
                                    <form id="native-mail-form">
                                        <div class="cfsf row">
                                            <div class="col-md-12">
                                                <div class="form-group">
                                                    <input type="text" class="form-control" id="form-name" placeholder="Name" required>
                                                </div>
                                            </div>
                                            <div class="col-md-12">
                                                <div class="form-group">
                                                    <input type="text" class="form-control" id="form-business" placeholder="Business Name (Optional)">
                                                </div>
                                            </div>
                                            <div class="col-md-12">
                                                <div class="form-group">
                                                    <input type="email" class="form-control" id="form-email" placeholder="Your Email" required>
                                                </div>
                                            </div>
                                            <div class="col-md-12">
                                                <div class="form-group">
                                                    <textarea class="form-control" id="form-message" rows="4" placeholder="Your Message / Inquiry" required></textarea>
                                                </div>
                                            </div>
                                            <div class="col-md-12">
                                                <div class="form-group">
                                                    <input type="submit" value="Compose in Email App" class="btn btn-primary">
                                                </div>
                                            </div>
                                        </div>
                                    </form>

                                    <div class="w-100 social-media mt-5">
                                        <small>
                                            <img src="https://raw.githubusercontent.com/ghostm68/99/main/5379e792-a434-4666-8e51-bb8e41de678b_inky_gif.gif" width="20" height="20" alt="Inky avatar" style="margin-right: 3px; border-radius: 50%; vertical-align: middle;">
                                            inky
                                        </small>
                                    </div>

                                </div>
                            </div>

                            <!-- RIGHT COLUMN IMAGE -->
                            <div class="col-lg-6 d-flex align-items-stretch">
                                <div class="info-wrap w-100 p-5 img" style="background-image:url('https://media.tenor.com/mlek86bUTrMAAAAM/pattern-abstract.gif'); background-size: cover; background-position: center;">
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Client-Side Mailto Generator (Single Recipient) -->
    <script>
      document.getElementById('native-mail-form').addEventListener('submit', function(e) {
        e.preventDefault();

        const name = document.getElementById('form-name').value;
        const business = document.getElementById('form-business').value || 'N/A';
        const email = document.getElementById('form-email').value;
        const message = document.getElementById('form-message').value;
        const timestamp = new Date().toLocaleString();

        const recipient = "contact@wordstar.nexus";
        const subject = encodeURIComponent(`Inquiry from ${name} [${business}]`);
        
        const bodyContent = 
          `Name: ${name}\n` +
          `Business: ${business}\n` +
          `Email: ${email}\n` +
          `Sent: ${timestamp}\n\n` +
          `Message:\n${message}\n`;

        const body = encodeURIComponent(bodyContent);

        window.location.href = `mailto:${recipient}?subject=${subject}&body=${body}`;
      });
    </script>
</body>

</html>
