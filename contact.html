<!doctype html>
<html lang="en">

<head>
    <title>Contact Us | Wordstar Nexus</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="icon" type="image/png" href="/svg/favicon-96x96.png" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="/svg/favicon.svg" />
<link rel="shortcut icon" href="/svg/favicon.ico" />
<link rel="apple-touch-icon" sizes="180x180" href="/svg/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-title" content="wordstar" />
<link rel="manifest" href="/svg/site.webmanifest" />
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="./main.css/main.css">
</head>

<body>
    <section class="ftco-section">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-12">
                    <div class="wrapper">
                        <div class="row no-gutters">
                            
                            <!-- FORM COLUMN -->
                            <div class="col-lg-6">
                                <div class="contact-wrap w-100 p-md-5 p-4">
                                    <h3>Contact</h3>
                                    <p class="mb-4">Send contact info via form, we will reply.</p>

                                    <div class="row mb-4">
                                        <div class="col-md-6">
                                            <div class="dbox w-100 d-flex align-items-start">
                                                <div class="text">
                                                    <p><span>Email:</span> 
                                                        <a href="mailto:contact@wordstar.nexus">contact@wordstar.nexus</a>
                                                    </p>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- DIRECT EMAIL FORM (Zero JS / Direct Delivery to Both Inboxes) -->
                                    <form action="https://formsubmit.co/contact@wordstar.nexus" method="POST">
                                        <!-- CC second address -->
                                        <input type="hidden" name="_cc" value="contact@inkrealm.info">
                                        <input type="hidden" name="_subject" value="New Contact Inquiry [Wordstar Nexus]">
                                        <input type="hidden" name="_captcha" value="false">
                                        
                                        <div class="cfsf row">
                                            <div class="col-md-12">
                                                <div class="form-group">
                                                    <input type="text" class="form-control" name="Name" placeholder="Name" required>
                                                </div>
                                            </div>
                                            <div class="col-md-12">
                                                <div class="form-group">
                                                    <input type="text" class="form-control" name="Business Name" placeholder="Your Business Name" required>
                                                </div>
                                            </div>
                                            <div class="col-md-12">
                                                <div class="form-group">
                                                    <input type="email" class="form-control" name="Email" placeholder="Email" required>
                                                </div>
                                            </div>
                                            <div class="col-md-12">
                                                <div class="form-group">
                                                    <input class="form-control date" name="Date" type="date" required>
                                                </div>
                                            </div>
                                            <div class="col-md-12">
                                                <div class="form-group">
                                                    <input class="form-control" type="time" name="Time" required>
                                                </div>
                                            </div>
                                            <div class="col-md-12">
                                                <div class="form-group">
                                                    <input type="submit" value="Send Message" class="btn btn-primary">
                                                </div>
                                            </div>
                                        </div>
                                    </form>

                                    <div class="w-100 social-media mt-5">
                                        <small>
                                            <img src="https://raw.githubusercontent.com/ghostm68/99/main/5379e792-a434-4666-8e51-bb8e41de678b_inky_gif.gif" width="20" height="20" alt="Inky avatar" style="margin-right: 3px; border-radius: 50%; vertical-align: middle;">
                                            inky
                                        </small>
                                    </div>

                                </div>
                            </div>

                            <!-- RIGHT COLUMN IMAGE -->
                            <div class="col-lg-6 d-flex align-items-stretch">
                                <div class="info-wrap w-100 p-5 img" style="background-image:url('https://media.tenor.com/mlek86bUTrMAAAAM/pattern-abstract.gif'); background-size: cover; background-position: center;">
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
