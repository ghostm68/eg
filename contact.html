<!doctype html>
<html lang="en">

<head>
    <title>Contact Us | Wordstar Nexus</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="./main.css/main.css">
</head>

<body>
    <section class="ftco-section">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-12">
                    <div class="wrapper">
                        <div class="row no-gutters">
                            
                            <!-- FORM COLUMN -->
                            <div class="col-lg-6">
                                <div class="contact-wrap w-100 p-md-5 p-4">
                                    <h3>Contact</h3>
                                    <p class="mb-4">Send contact info via form, we will reply.</p>
                                    
                                    <!-- Dynamic status message element for JS handler -->
                                    <p id="form-status-message" style="display: none;"></p>

                                    <div class="row mb-4">
                                        <div class="col-md-6">
                                            <div class="dbox w-100 d-flex align-items-start">
                                                <div class="text">
                                                    <p><span>Email:</span> 
                                                        <a href="mailto:contact@wordstar.nexus">contact@wordstar.nexus</a>
                                                    </p>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <form class="contactForm" id="contact-form" name="contact-form" action="https://script.google.com/macros/s/AKfycbyw29eeCBAdeZoh44W0IPlgnQya7dpZz7diHtUMm1oG3SYHrc5-FmAyp0v5W_c1qHLg1Q/exec" method="post">
                                        <p class="js-status-message is-hidden"></p>
                                        
                                        <div class="cfsf row">
                                            <div class="col-md-12">
                                                <div class="form-group">
                                                    <input type="text" class="form-control" name="name" id="name" placeholder="Name" required>
                                                </div>
                                            </div>
                                            <div class="col-md-12">
                                                <div class="form-group">
                                                    <input type="text" name="Business Name" id="business-name" placeholder="Your Business Name" class="form-control" required>
                                                </div>
                                            </div>
                                            <div class="col-md-12">
                                                <div class="form-group">
                                                    <input type="email" class="form-control" name="email" id="email" placeholder="Email" required>
                                                </div>
                                            </div>
                                            <div class="col-md-12">
                                                <div class="form-group">
                                                    <input class="form-control date" id="datepicker" name="Date" type="date" required>
                                                </div>
                                            </div>
                                            <div class="col-md-12">
                                                <div class="form-group">
                                                    <input class="form-control" type="time" name="Time" required>
                                                </div>
                                            </div>
                                            <div class="col-md-12">
                                                <div class="form-group">
                                                    <input type="submit" value="Send Message" class="btn btn-primary">
                                                    <div class="submitting"></div>
                                                </div>
                                            </div>
                                        </div>

                                        <div class="loader">
                                            <div class="loading"></div>
                                        </div>
                                    </form>

                                    <div class="w-100 social-media mt-5">
                                        <small>
                                            <img src="https://raw.githubusercontent.com/ghostm68/99/main/5379e792-a434-4666-8e51-bb8e41de678b_inky_gif.gif" width="20" height="20" alt="Inky avatar" style="margin-right: 3px; border-radius: 50%; vertical-align: middle;">
                                            inky
                                        </small>
                                    </div>

                                </div>
                            </div>

                            <!-- RIGHT COLUMN IMAGE -->
                            <div class="col-lg-6 d-flex align-items-stretch">
                                <div class="info-wrap w-100 p-5 img" style="background-image:url('https://media.tenor.com/mlek86bUTrMAAAAM/pattern-abstract.gif'); background-size: cover; background-position: center;">
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Dependency-free form handler -->
    <script data-cfasync="false" type="text/javascript" src="https://cdn.jsdelivr.net/gh/ghostm68/eg@main/form-submission-handler.js"></script>
</body>

</html>
