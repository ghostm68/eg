name: WordStar Ecosystem Health Sweep

on:
  workflow_dispatch: # Run manually from the GitHub Actions tab

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright Engine
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Dynamic Sitemap Discovery & Portal Sweep
        run: |
          cat << 'EOF' > sweep.mjs
          import { chromium } from 'playwright';

          const SITEMAP_URL = 'https://wordstar.nexus/sitemap';
          const BASE_DOMAIN = 'wordstar.nexus';

          async function auditEcosystem() {
            console.log(`[SWEEP] Initializing Ecosystem Health Sweep...`);
            console.log(`[SWEEP] Target Sitemap: ${SITEMAP_URL}`);

            const browser = await chromium.launch();
            const discoveryPage = await browser.newPage();

            try {
              await discoveryPage.goto(SITEMAP_URL, { waitUntil: 'domcontentloaded', timeout: 30000 });
            } catch (err) {
              console.error(`[SWEEP] Failed to reach sitemap: ${err.message}`);
              await browser.close();
              process.exit(1);
            }

            // Scrape links from the sitemap
            const rawLinks = await discoveryPage.evaluate(() => {
              return Array.from(document.querySelectorAll('a[href]'))
                .map(a => a.href.trim())
                .filter(href => href && !href.startsWith('mailto:') && !href.startsWith('tel:') && !href.startsWith('javascript:'));
            });

            await discoveryPage.close();

            const targetUrls = Array.from(new Set(rawLinks))
              .map(url => url.split('#')[0].replace(/\/$/, ''))
              .filter(url => url.includes(BASE_DOMAIN) && url !== SITEMAP_URL);

            console.log(`\n🔍 Found ${targetUrls.length} destinations to audit:`);
            targetUrls.forEach((u, i) => console.log(`   [${i + 1}] ${u}`));

            if (targetUrls.length === 0) {
              console.warn("⚠️ No portal links were extracted.");
              await browser.close();
              return;
            }

            let failures = 0;

            for (const url of targetUrls) {
              console.log(`\n👉 Auditing: ${url}`);
              const page = await browser.newPage();
              const pageIssues = [];

              // Catch unhandled runtime crashes
              page.on('pageerror', err => {
                pageIssues.push(`[UNCAUGHT JS] ${err.message}`);
              });

              // Catch console errors (excluding headless CI hardware noise)
              page.on('console', msg => {
                if (msg.type() === 'error') {
                  const txt = msg.text();
                  if (!txt.includes('AudioContext') && !txt.includes('favicon.ico') && !txt.includes('WebGL')) {
                    pageIssues.push(`[CONSOLE ERROR] ${txt}`);
                  }
                }
              });

              try {
                const response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 30000 });
                if (response && response.status() >= 400) {
                  pageIssues.push(`[HTTP STATUS] Returned code ${response.status()}`);
                }
                await page.waitForTimeout(2000);
              } catch (err) {
                pageIssues.push(`[NAVIGATION FAIL] ${err.message}`);
              }

              if (pageIssues.length > 0) {
                failures += pageIssues.length;
                console.error(`❌ Issues found on ${url}:`);
                pageIssues.forEach(issue => console.error(`   - ${issue}`));
              } else {
                console.log(`✅ Clean - No runtime errors detected.`);
              }

              await page.close();
            }

            await browser.close();

            console.log(`\n================================`);
            if (failures > 0) {
              console.error(`❌ Health sweep completed with ${failures} failure(s).`);
              process.exit(1);
            } else {
              console.log(`🚀 All audited links are fully functional with 0 runtime errors!`);
            }
          }

          auditEcosystem();
          EOF

          node sweep.mjs
