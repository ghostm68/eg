<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Atlas</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DejaVu+Sans+Mono&family=DejaVu+Sans:wght@400;700&family=DejaVu+Serif:wght@400;700&family=Cinzel:wght@500;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <!-- Standard Free GSAP Core -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    
    <style>
        :root {
            --gold: #d4af37;
            --gold-glow: rgba(212, 175, 55, 0.6);
            --gold-dim: rgba(212, 175, 55, 0.3);
            --cyan-glow: #00f3ff;
        }

        body {
            background: #0a0a0a;
            color: #f0f0f0;
            font-family: 'Georgia', serif;
            margin: 0;
            padding: 0;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 440px;
            gap: 2rem;
            padding: 2rem;
            max-width: 1600px;
            margin: 0 auto;
        }

        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        h1 {
            font-size: 2.2rem;
            margin-top: 2rem;
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
            text-align: center;
            font-family: 'Cinzel', serif;
            color: var(--gold);
        }

        .subtitle {
            font-style: italic;
            color: #888;
            margin-bottom: 2rem;
            text-align: center;
        }

        #art-section {
            text-align: center;
        }

        #art-container {
            margin: 1.5rem auto;
            min-height: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #artwork {
            max-width: 95%;
            max-height: 60vh;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 1px solid #333;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        #artwork:hover {
            transform: scale(1.01);
        }

        #info {
            margin-top: 1.5rem;
            font-size: 1.1rem;
            line-height: 1.5;
        }

        #title {
            font-weight: bold;
            font-size: 1.2rem;
            color: #fff;
        }

        #artist {
            font-style: italic;
            color: #aaa;
        }

        button {
            margin: 0.5rem;
            padding: 0.8rem 1.5rem;
            background: transparent;
            color: #eee;
            border: 1px solid #555;
            cursor: pointer;
            font-family: 'Georgia', serif;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        button:hover {
            background: #1f1f1f;
            border-color: var(--gold);
            color: var(--gold);
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .api-status {
            margin-top: 2rem;
            font-size: 0.85rem;
            color: #666;
            text-align: center;
        }

        /* Notepad Section */
     /* BASE NOTEPAD */
#notepad {
    width: 100%;
    min-height: 280px;
    max-height: 50vh;
    overflow-y: auto;
    background: #0a0a0a;
    border: 1px solid #333;
    border-radius: 4px;
    padding: 1.2rem;
    font-size: 1.05rem;
    line-height: 1.7;
    box-sizing: border-box;
    outline: none;
    white-space: pre-wrap;
    word-wrap: break-word;
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}

/* === LEVEL 0: RAW TERMINAL === */
#notepad.level-0 {
    font-family: 'DejaVu Sans Mono', monospace !important;
    color: #e0e0e0;
    border-color: #333;
    letter-spacing: 0;
    text-shadow: none;
    background: #0a0a0a;
}

/* === LEVEL 1: CIPHER MATRIX === */
#notepad.level-1 {
    font-family: 'DejaVu Sans Mono', monospace !important;
    color: #00ff66 !important;
    background: #051109 !important;
    border-color: #00ff66 !important;
    text-shadow: 0 0 8px rgba(0, 255, 102, 0.6);
    letter-spacing: 0.05em;
}

/* === LEVEL 2: KINETIC EDITORIAL === */
#notepad.level-2 {
    font-family: 'Cormorant Garamond', 'Georgia', serif !important;
    font-size: 1.25rem !important;
    font-style: italic;
    color: #ffffff !important;
    background: #0e0d0b !important;
    border-color: #d4af37 !important;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
    letter-spacing: 0.02em;
}

/* === LEVEL 3: PARAMETRIC OVERDRIVE === */
#notepad.level-3 {
    font-family: 'Cinzel', serif !important;
    font-size: 1.1rem !important;
    color: #fff8db !important;
    background: #141005 !important;
    border-color: #d4af37 !important;
    box-shadow: 0 0 25px rgba(212, 175, 55, 0.3), inset 0 0 15px rgba(212, 175, 55, 0.1);
    text-shadow: 0 0 12px #d4af37, 0 0 25px rgba(212, 175, 55, 0.8);
    letter-spacing: 0.12em;
}
        .font-selector {
            margin-bottom: 1rem;
        }

        .font-selector label {
            display: block;
            margin-bottom: 0.5rem;
            color: #aaa;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .font-selector select {
            width: 100%;
            padding: 0.6rem;
            background: #0a0a0a;
            color: #eee;
            border: 1px solid #333;
            border-radius: 4px;
            font-size: 0.95rem;
            outline: none;
        }

        .font-selector select:focus {
            border-color: var(--gold);
        }

        /* Level HUD */
        #font-level-hud {
            display: flex;
            gap: 6px;
            align-items: center;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid var(--gold-dim);
            padding: 8px 10px;
            border-radius: 4px;
            margin-bottom: 1rem;
            font-family: monospace;
            flex-wrap: wrap;
        }

        .hud-label {
            color: var(--gold);
            font-size: 10px;
            letter-spacing: 0.1em;
            margin-right: 4px;
        }

        .lvl-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #888;
            font-size: 9px;
            padding: 4px 8px;
            margin: 0;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .lvl-btn.active, .lvl-btn:hover {
            color: #000;
            background: var(--gold);
            border-color: var(--gold);
            font-weight: bold;
            box-shadow: 0 0 10px var(--gold-glow);
        }

        /* Notepad ContentEditable Pad */
        #notepad {
            width: 100%;
            min-height: 280px;
            max-height: 50vh;
            overflow-y: auto;
            background: #0a0a0a;
            color: #f0f0f0;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 1rem;
            font-size: 1.05rem;
            line-height: 1.6;
            box-sizing: border-box;
            outline: none;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: 'DejaVu Sans Mono', monospace;
            transition: border-color 0.3s ease, box-shadow 0.3s ease, text-shadow 0.3s ease;
        }

        #notepad:focus {
            border-color: #555;
        }

        /* Level 3 Mode Class */
        .parametric-mode {
            border-color: var(--gold) !important;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.25);
            color: #fffdec !important;
        }

        .dejavu-sans-mono { font-family: 'DejaVu Sans Mono', monospace; }
        .dejavu-sans { font-family: 'DejaVu Sans', sans-serif; }
        .dejavu-serif { font-family: 'DejaVu Serif', serif; }
        .cormorant { font-family: 'Cormorant Garamond', serif; font-size: 1.2rem !important; }

        .notepad-controls {
            margin-top: 1rem;
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .notepad-controls button {
            flex: 1;
            min-width: 120px;
            padding: 0.6rem 1rem;
            font-size: 0.85rem;
        }

        #attachedImage {
            margin-top: 1rem;
            padding: 0.8rem;
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 4px;
            text-align: center;
        }

        #attachedImage img {
            max-width: 100%;
            max-height: 140px;
            margin-top: 0.5rem;
            border: 1px solid #222;
        }

        #attachedImage p {
            margin: 0.4rem 0;
            font-size: 0.8rem;
            color: #aaa;
        }

        .remove-img {
            margin-top: 0.5rem;
            padding: 0.3rem 0.8rem;
            font-size: 0.75rem;
        }

        .loading {
            opacity: 0.6;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <h1>CUSTOM PAD, AN INFINITE ATLAS</h1>
    <p class="subtitle">A cartography of the world's art, one chance encounter at a time.</p>

    <div class="container">
        <!-- ART SECTION -->
        <div id="art-section">
            <div id="art-container">
                <img id="artwork" src="" alt="A discovery from the Infinite Atlas">
                <div id="info">
                    <div id="title"></div>
                    <div id="artist"></div>
                </div>
            </div>

            <div>
                <button id="newArtButton">Chart a New Course</button>
                <button id="attachImageButton" disabled>Attach to Notepad</button>
            </div>

            <div class="api-status">
                Powered by Cleveland Museum, The Met, Art Institute of Chicago, V&A, and Rijksmuseum
            </div>
        </div>

        <!-- NOTEPAD & TYPOGRAPHIC ENGINE -->
        <div id="notepad-section">
            <h2>NOTEPAD</h2>
            
            <div class="font-selector">
                <label for="fontSelect">Active Typeface:</label>
                <select id="fontSelect">
                    <option value="dejavu-sans-mono" selected>DejaVu Sans Mono</option>
                    <option value="dejavu-sans">DejaVu Sans</option>
                    <option value="dejavu-serif">DejaVu Serif</option>
                    <option value="cormorant">Cormorant Garamond</option>
                </select>
            </div>

            <!-- FONT LEVEL HUD -->
            <div id="font-level-hud">
                <span class="hud-label">FONT LEVEL:</span>
                <button onclick="setFontLevel(0)" class="lvl-btn active" id="btn-0">0: RAW</button>
                <button onclick="setFontLevel(1)" class="lvl-btn" id="btn-1">1: CIPHER</button>
                <button onclick="setFontLevel(2)" class="lvl-btn" id="btn-2">2: KINETIC</button>
                <button onclick="setFontLevel(3)" class="lvl-btn" id="btn-3">3: PARAMETRIC</button>
            </div>

            <!-- THE EDITABLE PAD -->
            <div id="notepad" contenteditable="true" spellcheck="false">Write your thoughts about the art...</div>

            <div id="attachedImage" style="display: none;">
                <p><strong>Attached Artwork:</strong></p>
                <p id="attachedTitle"></p>
                <img id="attachedArtwork" src="" alt="">
                <br>
                <button class="remove-img" id="removeImageButton">Remove Image</button>
            </div>

            <div class="notepad-controls">
                <button id="exportButton">Export as TXT</button>
                <button id="clearButton">Clear All</button>
            </div>
        </div>
    </div>

    <!-- SCRIPT 1: ATLAS APIs -->
    <script>
        const newArtButton = document.getElementById('newArtButton');
        const attachImageButton = document.getElementById('attachImageButton');
        const exportButton = document.getElementById('exportButton');
        const clearButton = document.getElementById('clearButton');
        const removeImageButton = document.getElementById('removeImageButton');
        const notepad = document.getElementById('notepad');
        const fontSelect = document.getElementById('fontSelect');
        const attachedImageDiv = document.getElementById('attachedImage');
        
        let currentArtwork = null;

        fontSelect.addEventListener('change', (e) => {
            notepad.className = e.target.value;
            if (currentLevel === 3) notepad.classList.add('parametric-mode');
        });

        const apiFunctions = [
            fetchClevelandArt,
            fetchMetropolitanArt,
            fetchArtInstituteChicago,
            fetchVictoriaAlbert,
            fetchRijksmuseum
        ];

        let currentAttempts = 0;
        const maxAttempts = 5;
        const preferredArtworkId = 80313;

        newArtButton.addEventListener('click', fetchRandomArt);

        async function fetchRandomArt() {
            currentAttempts = 0;
            newArtButton.disabled = true;
            attachImageButton.disabled = true;
            newArtButton.textContent = 'Navigating...';
            document.body.classList.add('loading');
            
            document.getElementById('artwork').src = '';
            document.getElementById('title').innerText = 'Consulting the atlas...';
            document.getElementById('artist').innerText = '';
            currentArtwork = null;

            await tryAllApis();
        }

        async function tryAllApis() {
            if (currentAttempts >= maxAttempts) {
                showError("The atlas cannot be read. Please try again.");
                return;
            }

            currentAttempts++;
            const shuffledApis = [...apiFunctions].sort(() => Math.random() - 0.5);
            
            for (const apiFunction of shuffledApis) {
                try {
                    await apiFunction();
                    newArtButton.disabled = false;
                    attachImageButton.disabled = false;
                    newArtButton.textContent = 'Chart a New Course';
                    document.body.classList.remove('loading');
                    return;
                } catch (error) {
                    console.log(`API ${apiFunction.name} failed:`, error.message);
                }
            }

            setTimeout(tryAllApis, 500);
        }

        // Cleveland Museum
        async function fetchClevelandArt() {
            if (Math.random() < 0.2) {
                await fetchSpecificClevelandArtwork(preferredArtworkId);
            } else {
                await fetchRandomClevelandArtwork();
            }
        }

        async function fetchSpecificClevelandArtwork(artworkId) {
            const response = await fetch(`https://openaccess-api.clevelandart.org/api/artworks/${artworkId}/`);
            if (!response.ok) throw new Error('Network response failed');
            const data = await response.json();
            
            if (data.data && data.data.images?.web?.url) {
                const art = data.data;
                await testImageLoad(art.images.web.url);
                displayArtwork(art.images.web.url, art.title, art.creators?.[0]?.description);
            } else {
                throw new Error("Specific artwork not available");
            }
        }

        async function fetchRandomClevelandArtwork() {
            const response = await fetch(`https://openaccess-api.clevelandart.org/api/artworks/?has_image=1&limit=50`);
            if (!response.ok) throw new Error('Network response failed');
            const data = await response.json();
            
            if (data.data && data.data.length > 0) {
                const art = data.data[Math.floor(Math.random() * data.data.length)];
                if (art.images?.web?.url) {
                    await testImageLoad(art.images.web.url);
                    displayArtwork(art.images.web.url, art.title, art.creators?.[0]?.description);
                } else {
                    throw new Error("No valid image");
                }
            } else {
                throw new Error("No data");
            }
        }

        // Metropolitan Museum
        async function fetchMetropolitanArt() {
            const goodObjectIds = [
                436535, 437329, 437327, 436528, 436101, 437994, 436121, 
                436048, 437430, 436931, 437879, 436944, 436532, 459106, 459107
            ];
            const randomObjectId = goodObjectIds[Math.floor(Math.random() * goodObjectIds.length)];
            const response = await fetch(`https://collectionapi.metmuseum.org/public/collection/v1/objects/${randomObjectId}`);
            if (!response.ok) throw new Error('Network response failed');
            const art = await response.json();
            
            if (art.primaryImage && art.primaryImage.length > 0) {
                await testImageLoad(art.primaryImage);
                displayArtwork(art.primaryImage, art.title, art.artistDisplayName);
            } else {
                throw new Error("No image available");
            }
        }

        // Art Institute Chicago
        async function fetchArtInstituteChicago() {
            const response = await fetch(`https://api.artic.edu/api/v1/artworks/search?q=painting&limit=100&fields=id,title,artist_display,image_id`);
            if (!response.ok) throw new Error('Network response failed');
            const data = await response.json();
            
            if (data.data && data.data.length > 0) {
                const artworks = data.data.filter(art => art.image_id);
                if (artworks.length === 0) throw new Error("No images available");
                
                const art = artworks[Math.floor(Math.random() * artworks.length)];
                const imageUrl = `https://www.artic.edu/iiif/2/${art.image_id}/full/843,/0/default.jpg`;
                await testImageLoad(imageUrl);
                displayArtwork(imageUrl, art.title, art.artist_display);
            } else {
                throw new Error("No data from Art Institute");
            }
        }

        // Victoria & Albert
        async function fetchVictoriaAlbert() {
            const response = await fetch(`https://api.vam.ac.uk/v2/objects/search?q=painting&images_exist=1&page_size=50`);
            if (!response.ok) throw new Error('Network response failed');
            const data = await response.json();
            
            if (data.records && data.records.length > 0) {
                const art = data.records[Math.floor(Math.random() * data.records.length)];
                if (art._images && art._images._primary_thumbnail) {
                    const imageUrl = `https://framemark.vam.ac.uk/collections/${art._images._primary_thumbnail}/full/full/0/default.jpg`;
                    await testImageLoad(imageUrl);
                    displayArtwork(imageUrl, art._primaryTitle, art._primaryMaker?.name);
                } else {
                    throw new Error("No image available");
                }
            } else {
                throw new Error("No data from V&A");
            }
        }

        // Rijksmuseum
        async function fetchRijksmuseum() {
            const response = await fetch(`https://www.rijksmuseum.nl/api/en/collection?key=0fiuZFh4&format=json&imgonly=true&ps=50`);
            if (!response.ok) throw new Error('Network response failed');
            const data = await response.json();
            
            if (data.artObjects && data.artObjects.length > 0) {
                const art = data.artObjects[Math.floor(Math.random() * data.artObjects.length)];
                if (art.webImage?.url) {
                    await testImageLoad(art.webImage.url);
                    displayArtwork(art.webImage.url, art.title, art.principalOrFirstMaker);
                } else {
                    throw new Error("No image available");
                }
            } else {
                throw new Error("No data from Rijksmuseum");
            }
        }

        function testImageLoad(url) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve();
                img.onerror = () => reject(new Error('Image failed to load'));
                img.src = url;
                setTimeout(() => reject(new Error('Image load timeout')), 5000);
            });
        }

        function displayArtwork(imageUrl, title, artist) {
            currentArtwork = {
                imageUrl: imageUrl,
                title: title || 'Untitled',
                artist: artist || 'Artist Unknown'
            };
            
            document.getElementById('artwork').src = imageUrl;
            document.getElementById('title').innerText = currentArtwork.title;
            document.getElementById('artist').innerText = currentArtwork.artist;
        }

        function showError(message) {
            document.getElementById('title').innerText = message;
            document.getElementById('artist').innerText = '';
            newArtButton.disabled = false;
            newArtButton.textContent = 'Chart a New Course';
            document.body.classList.remove('loading');
        }

        // Attach image to notepad
        attachImageButton.addEventListener('click', () => {
            if (currentArtwork) {
                document.getElementById('attachedArtwork').src = currentArtwork.imageUrl;
                document.getElementById('attachedTitle').innerText = `${currentArtwork.title} by ${currentArtwork.artist}`;
                attachedImageDiv.style.display = 'block';
            }
        });

        removeImageButton.addEventListener('click', () => {
            attachedImageDiv.style.display = 'none';
            document.getElementById('attachedArtwork').src = '';
        });

        // Export (TXT)
        exportButton.addEventListener('click', () => {
            let content = notepad.innerText;
            if (attachedImageDiv.style.display === 'block' && currentArtwork) {
                content += `\n\n---\nAttached Artwork:\n${currentArtwork.title}\nArtist: ${currentArtwork.artist}\nImage: ${currentArtwork.imageUrl}`;
            }
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `atlas-notes-${Date.now()}.txt`;
            a.click();
            URL.revokeObjectURL(url);
        });

        // Clear All
        clearButton.addEventListener('click', () => {
            if (confirm('Clear all notes and attached image?')) {
                notepad.innerText = '';
                attachedImageDiv.style.display = 'none';
                document.getElementById('attachedArtwork').src = '';
            }
        });

        async function initialize() {
            try {
                await fetchSpecificClevelandArtwork(preferredArtworkId);
            } catch (error) {
                fetchRandomArt();
            }
        }

        initialize();
    </script>

    <!-- SCRIPT 2: REAL-TIME REACTIVE TYPOGRAPHY ENGINE -->
    <script>
        let currentLevel = 0;
const chars = '!<>-_\\/[]{}—=+*^?#@%&010101';
const pad = document.getElementById('notepad');

// Initialize with Level 0
pad.classList.add('level-0');

function setFontLevel(lvl) {
    currentLevel = lvl;

    // 1. Update HUD buttons
    document.querySelectorAll('.lvl-btn').forEach((b, i) => {
        b.classList.toggle('active', i === lvl);
    });

    // 2. Remove all level styling classes and apply the new persistent tier
    pad.classList.remove('level-0', 'level-1', 'level-2', 'level-3');
    pad.classList.add(`level-${lvl}`);

    // 3. Level Switch Transition Effects
    if (lvl === 1) {
        // Run full text cipher decode
        runFullCipher(pad);
    } else if (lvl === 2) {
        // Kinetic elastic scale
        gsap.fromTo(pad, 
            { scale: 0.97, y: 10 }, 
            { scale: 1, y: 0, duration: 0.5, ease: "elastic.out(1, 0.5)" }
        );
    } else if (lvl === 3) {
        // Parametric gold flash
        gsap.fromTo(pad, 
            { filter: "brightness(2) contrast(1.2)" }, 
            { filter: "brightness(1) contrast(1)", duration: 0.6 }
        );
    }
}

// Live Cipher Algorithm for Level 1
function runFullCipher(element) {
    const originalText = element.innerText;
    if (!originalText || originalText.trim().length === 0) return;

    let iteration = 0;
    const interval = setInterval(() => {
        element.innerText = originalText
            .split('')
            .map((char, index) => {
                if (char === ' ' || char === '\n') return char;
                if (index < iteration) return originalText[index];
                return chars[Math.floor(Math.random() * chars.length)];
            })
            .join('');

        if (iteration >= originalText.length) {
            clearInterval(interval);
            element.innerText = originalText;
        }
        iteration += 2;
    }, 20);
}

// Live Keystroke Reactions per Level
pad.addEventListener('keydown', (e) => {
    // LEVEL 1: Cipher Glitch while typing
    if (currentLevel === 1 && e.key.length === 1) {
        gsap.fromTo(pad, 
            { textShadow: "0 0 15px #00ff66, -2px 0 0 #00ffff" }, 
            { textShadow: "0 0 8px rgba(0, 255, 102, 0.6)", duration: 0.2 }
        );
    }

    // LEVEL 2: Kinetic Recoil Punch
    if (currentLevel === 2) {
        if (e.key === 'Enter') {
            gsap.fromTo(pad, 
                { y: 8, rotate: -0.5 }, 
                { y: 0, rotate: 0, duration: 0.4, ease: "elastic.out(1.2, 0.3)" }
            );
        } else if (e.key.length === 1) {
            const randX = (Math.random() - 0.5) * 4;
            const randY = (Math.random() - 0.5) * 2;
            gsap.fromTo(pad, { x: randX, y: randY }, { x: 0, y: 0, duration: 0.08 });
        }
    }

    // LEVEL 3: Parametric Laser Expansion
    if (currentLevel === 3 && e.key.length === 1) {
        gsap.fromTo(pad, 
            { 
                textShadow: "0 0 20px #ffffff, 0 0 35px #d4af37",
                letterSpacing: "0.18em"
            }, 
            { 
                textShadow: "0 0 12px #d4af37, 0 0 25px rgba(212, 175, 55, 0.8)",
                letterSpacing: "0.12em", 
                duration: 0.3,
                ease: "power2.out"
            }
        );
    }
});
    </script>
