<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Atlas</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DejaVu+Sans+Mono&family=DejaVu+Sans:wght@400;700&family=DejaVu+Serif:wght@400;700&family=Cinzel:wght@500;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <!-- GSAP & Core Animation Plugins -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/SplitText.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/ScrambleTextPlugin.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/Flip.min.js"></script>
    
    <style>
        :root {
            --gold: #d4af37;
            --gold-dim: rgba(212, 175, 55, 0.3);
        }

        body {
            background: #0a0a0a;
            color: #f0f0f0;
            font-family: 'Georgia', serif;
            margin: 0;
            padding: 0;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 440px;
            gap: 2rem;
            padding: 2rem;
            max-width: 1600px;
            margin: 0 auto;
        }

        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        h1 {
            font-size: 2.2rem;
            margin-top: 2rem;
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
            text-align: center;
            font-family: 'Cinzel', serif;
            color: var(--gold);
        }

        .subtitle {
            font-style: italic;
            color: #888;
            margin-bottom: 2rem;
            text-align: center;
        }

        #art-section {
            text-align: center;
        }

        #art-container {
            margin: 1.5rem auto;
            min-height: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #artwork {
            max-width: 95%;
            max-height: 60vh;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 1px solid #333;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        #artwork:hover {
            transform: scale(1.01);
        }

        #info {
            margin-top: 1.5rem;
            font-size: 1.1rem;
            line-height: 1.5;
        }

        #title {
            font-weight: bold;
            font-size: 1.2rem;
            color: #fff;
        }

        #artist {
            font-style: italic;
            color: #aaa;
        }

        button {
            margin: 0.5rem;
            padding: 0.8rem 1.5rem;
            background: transparent;
            color: #eee;
            border: 1px solid #555;
            cursor: pointer;
            font-family: 'Georgia', serif;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        button:hover {
            background: #1f1f1f;
            border-color: var(--gold);
            color: var(--gold);
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .api-status {
            margin-top: 2rem;
            font-size: 0.85rem;
            color: #666;
            text-align: center;
        }

        /* Notepad Section */
        #notepad-section {
            background: #141414;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 1.5rem;
            height: fit-content;
            position: sticky;
            top: 2rem;
        }

        #notepad-section h2 {
            margin-top: 0;
            font-size: 1.3rem;
            font-family: 'Cinzel', serif;
            letter-spacing: 1px;
            color: #eee;
            border-bottom: 1px solid #2a2a2a;
            padding-bottom: 0.75rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .font-selector {
            margin-bottom: 1rem;
        }

        .font-selector label {
            display: block;
            margin-bottom: 0.5rem;
            color: #aaa;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .font-selector select {
            width: 100%;
            padding: 0.6rem;
            background: #0a0a0a;
            color: #eee;
            border: 1px solid #333;
            border-radius: 4px;
            font-size: 0.95rem;
            outline: none;
        }

        .font-selector select:focus {
            border-color: var(--gold);
        }

        /* Level HUD */
        #font-level-hud {
            display: flex;
            gap: 6px;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--gold-dim);
            padding: 8px 10px;
            border-radius: 4px;
            margin-bottom: 1rem;
            font-family: monospace;
            flex-wrap: wrap;
        }

        .hud-label {
            color: var(--gold);
            font-size: 10px;
            letter-spacing: 0.1em;
            margin-right: 4px;
        }

        .lvl-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #888;
            font-size: 9px;
            padding: 3px 6px;
            margin: 0;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .lvl-btn.active, .lvl-btn:hover {
            color: #000;
            background: var(--gold);
            border-color: var(--gold);
            font-weight: bold;
        }

        /* ContentEditable Notepad Pad */
        #notepad {
            width: 100%;
            min-height: 280px;
            max-height: 50vh;
            overflow-y: auto;
            background: #0a0a0a;
            color: #f0f0f0;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 1rem;
            font-size: 1rem;
            line-height: 1.6;
            box-sizing: border-box;
            outline: none;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: 'DejaVu Sans Mono', monospace;
            transition: all 0.3s ease;
        }

        #notepad:focus {
            border-color: #555;
        }

        /* Mode 3: Parametric Style */
        #notepad.parametric-mode {
            text-shadow: 0 0 8px rgba(212, 175, 55, 0.6);
            border-color: var(--gold);
            color: #fff9d6;
        }

        .dejavu-sans-mono { font-family: 'DejaVu Sans Mono', monospace; }
        .dejavu-sans { font-family: 'DejaVu Sans', sans-serif; }
        .dejavu-serif { font-family: 'DejaVu Serif', serif; }
        .cormorant { font-family: 'Cormorant Garamond', serif; font-size: 1.15rem !important; }

        .notepad-controls {
            margin-top: 1rem;
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .notepad-controls button {
            flex: 1;
            min-width: 120px;
            padding: 0.6rem 1rem;
            font-size: 0.85rem;
        }

        #attachedImage {
            margin-top: 1rem;
            padding: 0.8rem;
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 4px;
            text-align: center;
        }

        #attachedImage img {
            max-width: 100%;
            max-height: 140px;
            margin-top: 0.5rem;
            border: 1px solid #222;
        }

        #attachedImage p {
            margin: 0.4rem 0;
            font-size: 0.8rem;
            color: #aaa;
        }

        .remove-img {
            margin-top: 0.5rem;
            padding: 0.3rem 0.8rem;
            font-size: 0.75rem;
        }

        .loading {
            opacity: 0.6;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <h1>CUSTOM PAD, AN INFINITE ATLAS</h1>
    <p class="subtitle">A cartography of the world's art, one chance encounter at a time.</p>

    <div class="container">
        <!-- ARTWORK VIEWER -->
        <div id="art-section">
            <div id="art-container">
                <img id="artwork" src="" alt="A discovery from the Infinite Atlas">
                <div id="info">
                    <div id="title"></div>
                    <div id="artist"></div>
                </div>
            </div>

            <div>
                <button id="newArtButton">Chart a New Course</button>
                <button id="attachImageButton" disabled>Attach to Notepad</button>
            </div>

            <div class="api-status">
                Powered by Cleveland Museum, The Met, Art Institute of Chicago, V&A, and Rijksmuseum
            </div>
        </div>

        <!-- NOTEPAD & TYPOGRAPHY ENGINE -->
        <div id="notepad-section">
            <h2>NOTEPAD</h2>
            
            <div class="font-selector">
                <label for="fontSelect">Active Typeface:</label>
                <select id="fontSelect">
                    <option value="dejavu-sans-mono" selected>DejaVu Sans Mono</option>
                    <option value="dejavu-sans">DejaVu Sans</option>
                    <option value="dejavu-serif">DejaVu Serif</option>
                    <option value="cormorant">Cormorant Garamond</option>
                </select>
            </div>

            <!-- FONT LEVEL CONTROLS -->
            <div id="font-level-hud">
                <span class="hud-label">FONT LEVEL:</span>
                <button onclick="setFontLevel(0)" class="lvl-btn active" id="btn-lvl-0">0: RAW</button>
                <button onclick="setFontLevel(1)" class="lvl-btn" id="btn-lvl-1">1: CIPHER</button>
                <button onclick="setFontLevel(2)" class="lvl-btn" id="btn-lvl-2">2: KINETIC</button>
                <button onclick="setFontLevel(3)" class="lvl-btn" id="btn-lvl-3">3: PARAMETRIC</button>
            </div>

            <!-- EDITABLE BUFFER -->
            <div id="notepad" contenteditable="true" spellcheck="false" placeholder="Write your reflections here..."></div>

            <div id="attachedImage" style="display: none;">
                <p><strong>Attached Artwork:</strong></p>
                <p id="attachedTitle"></p>
                <img id="attachedArtwork" src="" alt="">
                <br>
                <button class="remove-img" id="removeImageButton">Remove Image</button>
            </div>

            <div class="notepad-controls">
                <button id="exportButton">Export as TXT</button>
                <button id="clearButton">Clear All</button>
            </div>
        </div>
    </div>

    <!-- SCRIPT 1: ATLAS & API LOGIC -->
    <script>
        const newArtButton = document.getElementById('newArtButton');
        const attachImageButton = document.getElementById('attachImageButton');
        const exportButton = document.getElementById('exportButton');
        const clearButton = document.getElementById('clearButton');
        const removeImageButton = document.getElementById('removeImageButton');
        const notepad = document.getElementById('notepad');
        const fontSelect = document.getElementById('fontSelect');
        const attachedImageDiv = document.getElementById('attachedImage');
        
        let currentArtwork = null;

        // Font family switcher
        fontSelect.addEventListener('change', (e) => {
            notepad.className = e.target.value;
            if (currentLevel === 3) notepad.classList.add('parametric-mode');
        });

        // Art APIs
        const apiFunctions = [
            fetchClevelandArt,
            fetchMetropolitanArt,
            fetchArtInstituteChicago,
            fetchVictoriaAlbert,
            fetchRijksmuseum
        ];

        let currentAttempts = 0;
        const maxAttempts = 5;
        const preferredArtworkId = 80313;

        newArtButton.addEventListener('click', fetchRandomArt);

        async function fetchRandomArt() {
            currentAttempts = 0;
            newArtButton.disabled = true;
            attachImageButton.disabled = true;
            newArtButton.textContent = 'Navigating...';
            document.body.classList.add('loading');
            
            document.getElementById('artwork').src = '';
            document.getElementById('title').innerText = 'Consulting the atlas...';
            document.getElementById('artist').innerText = '';
            currentArtwork = null;

            await tryAllApis();
        }

        async function tryAllApis() {
            if (currentAttempts >= maxAttempts) {
                showError("The atlas cannot be read. Please try again.");
                return;
            }

            currentAttempts++;
            const shuffledApis = [...apiFunctions].sort(() => Math.random() - 0.5);
            
            for (const apiFunction of shuffledApis) {
                try {
                    await apiFunction();
                    newArtButton.disabled = false;
                    attachImageButton.disabled = false;
                    newArtButton.textContent = 'Chart a New Course';
                    document.body.classList.remove('loading');
                    return;
                } catch (error) {
                    console.log(`API ${apiFunction.name} failed:`, error.message);
                }
            }

            setTimeout(tryAllApis, 500);
        }

        // 1. Cleveland Museum
        async function fetchClevelandArt() {
            if (Math.random() < 0.2) {
                await fetchSpecificClevelandArtwork(preferredArtworkId);
            } else {
                await fetchRandomClevelandArtwork();
            }
        }

        async function fetchSpecificClevelandArtwork(artworkId) {
            const response = await fetch(`https://openaccess-api.clevelandart.org/api/artworks/${artworkId}/`);
            if (!response.ok) throw new Error('Network response failed');
            const data = await response.json();
            
            if (data.data && data.data.images?.web?.url) {
                const art = data.data;
                await testImageLoad(art.images.web.url);
                displayArtwork(art.images.web.url, art.title, art.creators?.[0]?.description);
            } else {
                throw new Error("Specific artwork not available");
            }
        }

        async function fetchRandomClevelandArtwork() {
            const response = await fetch(`https://openaccess-api.clevelandart.org/api/artworks/?has_image=1&limit=50`);
            if (!response.ok) throw new Error('Network response failed');
            const data = await response.json();
            
            if (data.data && data.data.length > 0) {
                const art = data.data[Math.floor(Math.random() * data.data.length)];
                if (art.images?.web?.url) {
                    await testImageLoad(art.images.web.url);
                    displayArtwork(art.images.web.url, art.title, art.creators?.[0]?.description);
                } else {
                    throw new Error("No valid image");
                }
            } else {
                throw new Error("No data");
            }
        }

        // 2. Metropolitan Museum
        async function fetchMetropolitanArt() {
            const goodObjectIds = [
                436535, 437329, 437327, 436528, 436101, 437994, 436121, 
                436048, 437430, 436931, 437879, 436944, 436532, 459106, 459107
            ];
            const randomObjectId = goodObjectIds[Math.floor(Math.random() * goodObjectIds.length)];
            const response = await fetch(`https://collectionapi.metmuseum.org/public/collection/v1/objects/${randomObjectId}`);
            if (!response.ok) throw new Error('Network response failed');
            const art = await response.json();
            
            if (art.primaryImage && art.primaryImage.length > 0) {
                await testImageLoad(art.primaryImage);
                displayArtwork(art.primaryImage, art.title, art.artistDisplayName);
            } else {
                throw new Error("No image available");
            }
        }

        // 3. Art Institute of Chicago
        async function fetchArtInstituteChicago() {
            const response = await fetch(`https://api.artic.edu/api/v1/artworks/search?q=painting&limit=100&fields=id,title,artist_display,image_id`);
            if (!response.ok) throw new Error('Network response failed');
            const data = await response.json();
            
            if (data.data && data.data.length > 0) {
                const artworks = data.data.filter(art => art.image_id);
                if (artworks.length === 0) throw new Error("No images available");
                
                const art = artworks[Math.floor(Math.random() * artworks.length)];
                const imageUrl = `https://www.artic.edu/iiif/2/${art.image_id}/full/843,/0/default.jpg`;
                await testImageLoad(imageUrl);
                displayArtwork(imageUrl, art.title, art.artist_display);
            } else {
                throw new Error("No data from Art Institute");
            }
        }

        // 4. Victoria & Albert Museum
        async function fetchVictoriaAlbert() {
            const response = await fetch(`https://api.vam.ac.uk/v2/objects/search?q=painting&images_exist=1&page_size=50`);
            if (!response.ok) throw new Error('Network response failed');
            const data = await response.json();
            
            if (data.records && data.records.length > 0) {
                const art = data.records[Math.floor(Math.random() * data.records.length)];
                if (art._images && art._images._primary_thumbnail) {
                    const imageUrl = `https://framemark.vam.ac.uk/collections/${art._images._primary_thumbnail}/full/full/0/default.jpg`;
                    await testImageLoad(imageUrl);
                    displayArtwork(imageUrl, art._primaryTitle, art._primaryMaker?.name);
                } else {
                    throw new Error("No image available");
                }
            } else {
                throw new Error("No data from V&A");
            }
        }

        // 5. Rijksmuseum
        async function fetchRijksmuseum() {
            const response = await fetch(`https://www.rijksmuseum.nl/api/en/collection?key=0fiuZFh4&format=json&imgonly=true&ps=50`);
            if (!response.ok) throw new Error('Network response failed');
            const data = await response.json();
            
            if (data.artObjects && data.artObjects.length > 0) {
                const art = data.artObjects[Math.floor(Math.random() * data.artObjects.length)];
                if (art.webImage?.url) {
                    await testImageLoad(art.webImage.url);
                    displayArtwork(art.webImage.url, art.title, art.principalOrFirstMaker);
                } else {
                    throw new Error("No image available");
                }
            } else {
                throw new Error("No data from Rijksmuseum");
            }
        }

        function testImageLoad(url) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve();
                img.onerror = () => reject(new Error('Image failed to load'));
                img.src = url;
                setTimeout(() => reject(new Error('Image load timeout')), 5000);
            });
        }

        function displayArtwork(imageUrl, title, artist) {
            currentArtwork = {
                imageUrl: imageUrl,
                title: title || 'Untitled',
                artist: artist || 'Artist Unknown'
            };
            
            document.getElementById('artwork').src = imageUrl;
            document.getElementById('title').innerText = currentArtwork.title;
            document.getElementById('artist').innerText = currentArtwork.artist;
        }

        function showError(message) {
            document.getElementById('title').innerText = message;
            document.getElementById('artist').innerText = '';
            newArtButton.disabled = false;
            newArtButton.textContent = 'Chart a New Course';
            document.body.classList.remove('loading');
        }

        // Notepad image attachment
        attachImageButton.addEventListener('click', () => {
            if (currentArtwork) {
                document.getElementById('attachedArtwork').src = currentArtwork.imageUrl;
                document.getElementById('attachedTitle').innerText = `${currentArtwork.title} by ${currentArtwork.artist}`;
                attachedImageDiv.style.display = 'block';
            }
        });

        removeImageButton.addEventListener('click', () => {
            attachedImageDiv.style.display = 'none';
            document.getElementById('attachedArtwork').src = '';
        });

        // Export (TXT)
        exportButton.addEventListener('click', () => {
            let content = notepad.innerText;
            
            if (attachedImageDiv.style.display === 'block' && currentArtwork) {
                content += `\n\n---\nAttached Artwork:\n${currentArtwork.title}\nArtist: ${currentArtwork.artist}\nImage: ${currentArtwork.imageUrl}`;
            }
            
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `atlas-notes-${Date.now()}.txt`;
            a.click();
            URL.revokeObjectURL(url);
        });

        // Clear All
        clearButton.addEventListener('click', () => {
            if (confirm('Clear all notes and attached image?')) {
                notepad.innerHTML = '';
                attachedImageDiv.style.display = 'none';
                document.getElementById('attachedArtwork').src = '';
            }
        });

        // Init Cleveland preferred artwork
        async function initialize() {
            try {
                await fetchSpecificClevelandArtwork(preferredArtworkId);
            } catch (error) {
                fetchRandomArt();
            }
        }

        initialize();
    </script>

    <!-- SCRIPT 2: FONT LEVEL ENGINE (GSAP) -->
    <script>
        // Register plugins if present
        if (typeof gsap !== 'undefined') {
            if (typeof SplitText !== 'undefined') gsap.registerPlugin(SplitText);
            if (typeof ScrambleTextPlugin !== 'undefined') gsap.registerPlugin(ScrambleTextPlugin);
            if (typeof Flip !== 'undefined') gsap.registerPlugin(Flip);
        }

        let currentLevel = 0;

        function setFontLevel(lvl) {
            currentLevel = lvl;
            
            // Update HUD Buttons
            document.querySelectorAll('.lvl-btn').forEach((b, i) => {
                b.classList.toggle('active', i === lvl);
            });

            // Toggle Parametric styling on Level 3
            if (lvl === 3) {
                notepad.classList.add('parametric-mode');
            } else {
                notepad.classList.remove('parametric-mode');
            }

            // Trigger level transition flash
            gsap.fromTo(notepad, 
                { backgroundColor: "rgba(212, 175, 55, 0.15)" }, 
                { backgroundColor: "#0a0a0a", duration: 0.5, ease: "power2.out" }
            );
        }

        // Keystroke Interceptor for Font Levels
        notepad.addEventListener('input', (e) => {
            // LEVEL 1: CIPHER / SCRAMBLE RECENT INPUT
            if (currentLevel === 1 && typeof ScrambleTextPlugin !== 'undefined') {
                const selection = window.getSelection();
                if (!selection.anchorNode) return;
                
                const node = selection.anchorNode;
                if (node.nodeType === Node.TEXT_NODE && node.textContent.length > 4) {
                    const text = node.textContent;
                    gsap.to(node, {
                        duration: 0.3,
                        scrambleText: { text: text, chars: "!<>-_\\/[]{}—=+*^?#@%&" }
                    });
                }
            }

            // LEVEL 3: PARAMETRIC GLOW PULSE
            if (currentLevel === 3) {
                gsap.fromTo(notepad, 
                    { textShadow: "0 0 16px #d4af37" }, 
                    { textShadow: "0 0 6px rgba(212, 175, 55, 0.6)", duration: 0.4 }
                );
            }
        });

        // LEVEL 2: KINETIC SPLIT ON ENTER
        notepad.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && currentLevel === 2 && typeof SplitText !== 'undefined') {
                setTimeout(() => {
                    if (notepad.innerText.trim().length === 0) return;
                    const split = new SplitText(notepad, { type: "words,chars" });
                    gsap.from(split.chars, {
                        duration: 0.5,
                        opacity: 0,
                        y: -12,
                        scale: 0.8,
                        stagger: 0.015,
                        ease: "back.out(2)",
                        onComplete: () => split.revert() // Revert back to plain text so typing stays uninterrupted
                    });
                }, 20);
            }
        });
    </script>
</body>
</html>
