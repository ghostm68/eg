<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anagram Engine · Wordstar Nexus</title>
  <style>
    :root {
      --red: #ff0033;
      --black: #0a0a0a;
      --grey: #1a1a1a;
      --white: #ffffff;
      --muted: #888;
      --border: #2a2a2a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    ::selection {
      background: var(--red);
      color: var(--black);
      text-shadow: none;
    }

    body {
      font-family: "SF Mono", "Fira Code", "Consolas", "Menlo", monospace;
      background: var(--black);
      color: var(--white);
      min-height: 100vh;
      line-height: 1.4;
      font-size: 14px;
    }

    .app {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.5rem;
      display: grid;
      gap: 1.25rem;
    }

    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.75rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--red);
    }

    header .brand {
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    header .status {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .input-row {
      display: grid;
      gap: 0.5rem;
    }

    label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    input[type="text"],
    input[type="number"],
    select {
      background: var(--grey);
      border: 1px solid var(--border);
      color: var(--white);
      padding: 0.55rem 0.75rem;
      font: inherit;
      border-radius: 2px;
      width: 100%;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: var(--red);
    }

    .inventory {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      align-items: center;
      min-height: 2.2rem;
      padding: 0.5rem 0;
    }

    .letter-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 1.6rem;
      height: 1.6rem;
      padding: 0 0.3rem;
      background: var(--grey);
      border: 1px solid var(--border);
      font-size: 0.85rem;
      font-weight: 600;
    }

    .letter-chip.vowel {
      border-color: var(--red);
      color: var(--red);
    }

    .letter-chip.zero {
      opacity: 0.25;
    }

    .meta {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .meta strong {
      color: var(--white);
    }

    .options {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 0.75rem;
      padding: 0.9rem;
      background: var(--grey);
      border: 1px solid var(--border);
    }

    .opt {
      display: grid;
      gap: 0.25rem;
    }

    /* Mode toggle */
    .mode-toggle {
      display: flex;
      gap: 0;
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .mode-toggle button {
      flex: 1;
      border: none;
      border-radius: 0;
      background: transparent;
      padding: 0.5rem 0.75rem;
      font-size: 0.75rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .mode-toggle button.active {
      background: var(--red);
      color: var(--black);
      font-weight: 700;
    }

    .mode-toggle button:not(.active):hover {
      background: #151515;
      color: var(--red);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
    }

    button {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--white);
      padding: 0.45rem 0.9rem;
      font: inherit;
      font-size: 0.8rem;
      cursor: pointer;
      border-radius: 2px;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }

    button:hover {
      border-color: var(--red);
      color: var(--red);
    }

    button.primary {
      background: var(--red);
      border-color: var(--red);
      color: var(--black);
      font-weight: 600;
    }

    button.primary:hover {
      background: #ff3355;
      border-color: #ff3355;
      color: var(--black);
    }

    button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .panels {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
    }

    @media (max-width: 720px) {
      .panels { grid-template-columns: 1fr; }
    }

    .panel {
      border: 1px solid var(--border);
      background: #0d0d0d;
      display: flex;
      flex-direction: column;
      min-height: 280px;
    }

    .panel-head {
      padding: 0.55rem 0.75rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .panel-body {
      flex: 1;
      overflow-y: auto;
      max-height: 420px;
      padding: 0.4rem 0;
    }

    .suggestion {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.4rem 0.75rem;
      cursor: pointer;
      border-left: 2px solid transparent;
      gap: 0.5rem;
    }

    .suggestion:hover {
      background: var(--grey);
      border-left-color: var(--red);
    }

    .suggestion .word {
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    .suggestion .phrase {
      font-weight: 500;
      letter-spacing: 0.02em;
      color: var(--white);
    }

    .suggestion .len {
      font-size: 0.7rem;
      color: var(--muted);
      white-space: nowrap;
    }

    .claimed-list {
      list-style: none;
    }

    .claimed-list li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.4rem 0.75rem;
      border-bottom: 1px solid #151515;
    }

    .claimed-list .word {
      font-weight: 600;
      color: var(--red);
    }

    .empty {
      padding: 1.5rem 0.75rem;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .footer {
      border-top: 1px solid var(--border);
      padding-top: 0.75rem;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .export-box {
      background: var(--grey);
      border: 1px solid var(--border);
      padding: 0.6rem 0.75rem;
      font-size: 0.85rem;
      word-break: break-word;
      min-height: 2.5rem;
      width: 100%;
      margin-top: 0.4rem;
      white-space: pre-wrap;
    }

    .hint {
      font-size: 0.7rem;
      color: var(--muted);
      margin-top: 0.25rem;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>ANAGRAM ENGINE</h1>
        <div class="brand">Wordstar Nexus</div>
      </div>
      <div class="status" id="status">Loading dictionary…</div>
    </header>

    <div class="input-row">
      <label for="phrase">Source phrase</label>
      <input type="text" id="phrase" placeholder="Type or paste a phrase…" autocomplete="off" spellcheck="false" />
      <div class="inventory" id="inventory"></div>
      <div class="meta" id="meta"></div>
    </div>

    <div class="options">
      <div class="opt" style="grid-column: 1 / -1;">
        <label>Mode</label>
        <div class="mode-toggle">
          <button type="button" id="modeWords" class="active">Words</button>
          <button type="button" id="modePhrases">Phrases</button>
        </div>
      </div>
      <div class="opt">
        <label>Min length</label>
        <input type="number" id="minLen" value="3" min="2" max="20" />
      </div>
      <div class="opt">
        <label>Max length</label>
        <input type="number" id="maxLen" value="12" min="2" max="25" />
      </div>
      <div class="opt">
        <label>Prefix</label>
        <input type="text" id="prefix" placeholder="" maxlength="8" />
      </div>
      <div class="opt">
        <label>Suffix</label>
        <input type="text" id="suffix" placeholder="" maxlength="8" />
      </div>
      <div class="opt">
        <label>Must contain</label>
        <input type="text" id="must" placeholder="" maxlength="12" />
      </div>
      <div class="opt">
        <label>Must not</label>
        <input type="text" id="mustNot" placeholder="" maxlength="12" />
      </div>
      <div class="opt">
        <label>Rank by</label>
        <select id="rankBy">
          <option value="length">Length (longest)</option>
          <option value="remaining">Remaining goodness</option>
          <option value="alpha">Alphabetical</option>
        </select>
      </div>
      <div class="opt">
        <label>Max results</label>
        <input type="number" id="maxResults" value="40" min="10" max="120" />
      </div>
      <div class="opt" id="phraseDepthOpt">
        <label>Phrase depth</label>
        <select id="phraseDepth">
          <option value="2">2 words</option>
          <option value="3" selected>3 words</option>
          <option value="4">4 words</option>
        </select>
      </div>
    </div>

    <div class="actions">
      <button class="primary" id="btnFind">Find</button>
      <button id="btnUndo" disabled>Undo</button>
      <button id="btnClear">Clear</button>
      <button id="btnExportTxt">Export .txt</button>
      <button id="btnCopy">Copy</button>
    </div>

    <div class="panels">
      <div class="panel">
        <div class="panel-head">
          <span id="sugLabel">Suggestions</span>
          <span id="sugCount">0</span>
        </div>
        <div class="panel-body" id="suggestions">
          <div class="empty">Enter a phrase and hit Find (or just type).</div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-head">
          <span>Claimed</span>
          <span id="claimedCount">0</span>
        </div>
        <div class="panel-body">
          <ul class="claimed-list" id="claimed"></ul>
          <div class="empty" id="claimedEmpty">No words claimed yet.</div>
        </div>
      </div>
    </div>

    <div class="footer">
      <div>Current build</div>
      <div class="export-box" id="exportBox">—</div>
      <div class="hint">Export .txt produces a Wordstar Nexus marked file for download.</div>
    </div>
  </div>

  <script>
    // ============================================================
    // Anagram Engine · Wordstar Nexus
    // ============================================================

    const VOWELS = new Set("aeiou");
    const RARE = new Set("jqxz");

    /** @type {string[]} */
    let DICT = [];
    /** Precomputed counts for speed in phrase mode */
    let DICT_COUNTS = [];

    let mode = "words"; // "words" | "phrases"
    let remaining = new Uint8Array(26);
    let original = new Uint8Array(26);
    /** @type {{word:string, counts:Uint8Array}[]} */
    let claimed = [];

    function countsFrom(str) {
      const c = new Uint8Array(26);
      for (const ch of str) {
        const i = ch.charCodeAt(0) - 97;
        if (i >= 0 && i < 26) c[i]++;
      }
      return c;
    }

    function canForm(need, have) {
      for (let i = 0; i < 26; i++) if (need[i] > have[i]) return false;
      return true;
    }

    function subtract(inv, sub) {
      const n = inv.slice();
      for (let i = 0; i < 26; i++) n[i] -= sub[i];
      return n;
    }

    function add(inv, addend) {
      const n = inv.slice();
      for (let i = 0; i < 26; i++) n[i] += addend[i];
      return n;
    }

    function inventoryToString(inv) {
      let s = "";
      for (let i = 0; i < 26; i++) s += String.fromCharCode(97 + i).repeat(inv[i]);
      return s;
    }

    function totalLetters(inv) {
      let t = 0;
      for (let i = 0; i < 26; i++) t += inv[i];
      return t;
    }

    function vowelPct(inv) {
      let total = 0, vows = 0;
      for (let i = 0; i < 26; i++) {
        total += inv[i];
        if (VOWELS.has(String.fromCharCode(97 + i))) vows += inv[i];
      }
      return total === 0 ? 0 : Math.round((vows / total) * 100);
    }

    function remainingScore(after) {
      const tot = totalLetters(after);
      if (tot === 0) return 1000;
      const vp = vowelPct(after);
      let rare = 0;
      for (let i = 0; i < 26; i++) {
        if (RARE.has(String.fromCharCode(97 + i))) rare += after[i];
      }
      return vp * 2 - rare * 8 - tot * 0.3;
    }

    function normalize(str) {
      return (str || "").toLowerCase().replace(/[^a-z]/g, "");
    }

    // ------------------------------------------------------------
    // DOM helpers
    // ------------------------------------------------------------
    const $ = (id) => document.getElementById(id);

    function getOptions() {
      return {
        minLen: Math.max(2, parseInt($("minLen").value, 10) || 3),
        maxLen: Math.min(25, parseInt($("maxLen").value, 10) || 12),
        prefix: normalize($("prefix").value),
        suffix: normalize($("suffix").value),
        must: normalize($("must").value),
        mustNot: normalize($("mustNot").value),
        rankBy: $("rankBy").value,
        maxResults: Math.min(120, parseInt($("maxResults").value, 10) || 40),
        phraseDepth: parseInt($("phraseDepth").value, 10) || 3,
      };
    }

    function renderInventory() {
      const invEl = $("inventory");
      invEl.innerHTML = "";
      const letters = [];
      for (let i = 0; i < 26; i++) {
        const n = remaining[i];
        const ch = String.fromCharCode(97 + i);
        if (n === 0 && original[i] === 0) continue;
        const chip = document.createElement("span");
        chip.className = "letter-chip" + (VOWELS.has(ch) ? " vowel" : "") + (n === 0 ? " zero" : "");
        chip.textContent = n > 1 ? ch + n : ch;
        letters.push(chip);
      }
      if (!letters.length) invEl.innerHTML = '<span class="meta">No letters</span>';
      else letters.forEach((c) => invEl.appendChild(c));

      const tot = totalLetters(remaining);
      $("meta").innerHTML = `<strong>${tot}</strong> letters remaining · <strong>${vowelPct(remaining)}%</strong> vowels`;
    }

    function renderClaimed() {
      const list = $("claimed");
      list.innerHTML = "";
      claimed.forEach((c) => {
        const li = document.createElement("li");
        li.innerHTML = `<span class="word">${c.word}</span><span class="len">${c.word.length}</span>`;
        list.appendChild(li);
      });
      $("claimedEmpty").style.display = claimed.length ? "none" : "block";
      $("claimedCount").textContent = claimed.length;
      $("btnUndo").disabled = claimed.length === 0;
      updateExportBox();
    }

    function updateExportBox() {
      const words = claimed.map((c) => c.word).join(" · ");
      const left = inventoryToString(remaining);
      $("exportBox").textContent = words
        ? (left ? `${words}  |  leftover: ${left}` : words)
        : (left ? `leftover: ${left}` : "—");
    }

    function renderSuggestions(items) {
      const el = $("suggestions");
      el.innerHTML = "";
      if (!items.length) {
        el.innerHTML = '<div class="empty">No matches with current filters / remaining letters.</div>';
        $("sugCount").textContent = "0";
        return;
      }
      const frag = document.createDocumentFragment();
      items.forEach((item) => {
        const div = document.createElement("div");
        div.className = "suggestion";
        if (item.phrase) {
          div.innerHTML = `<span class="phrase">${item.phrase}</span><span class="len">${item.words.length}w</span>`;
          div.addEventListener("click", () => claimPhrase(item.words));
        } else {
          div.innerHTML = `<span class="word">${item.word}</span><span class="len">${item.word.length}</span>`;
          div.addEventListener("click", () => claim(item.word));
        }
        frag.appendChild(div);
      });
      el.appendChild(frag);
      $("sugCount").textContent = items.length;
    }

    // ------------------------------------------------------------
    // Word-mode finder
    // ------------------------------------------------------------
    function findWords() {
      const opt = getOptions();
      const mustC = countsFrom(opt.must);
      const mustNotSet = new Set(opt.mustNot);
      const candidates = [];

      for (let i = 0; i < DICT.length; i++) {
        const word = DICT[i];
        const len = word.length;
        if (len < opt.minLen || len > opt.maxLen) continue;
        if (opt.prefix && !word.startsWith(opt.prefix)) continue;
        if (opt.suffix && !word.endsWith(opt.suffix)) continue;

        let bad = false;
        for (const ch of word) {
          if (mustNotSet.has(ch)) { bad = true; break; }
        }
        if (bad) continue;

        const wc = DICT_COUNTS[i];
        if (!canForm(mustC, wc)) continue;
        if (!canForm(wc, remaining)) continue;

        candidates.push({ word, counts: wc, len });
      }

      if (opt.rankBy === "length") {
        candidates.sort((a, b) => b.len - a.len || a.word.localeCompare(b.word));
      } else if (opt.rankBy === "alpha") {
        candidates.sort((a, b) => a.word.localeCompare(b.word));
      } else {
        candidates.sort((a, b) => {
          const sa = remainingScore(subtract(remaining, a.counts));
          const sb = remainingScore(subtract(remaining, b.counts));
          return sb - sa || b.len - a.len;
        });
      }

      renderSuggestions(candidates.slice(0, opt.maxResults));
    }

    // ------------------------------------------------------------
    // Phrase-mode finder (bounded recursive search)
    // ------------------------------------------------------------
    function findPhrases() {
      const opt = getOptions();
      const maxDepth = opt.phraseDepth;
      const maxResults = opt.maxResults;
      const minLen = opt.minLen;
      const maxLen = opt.maxLen;
      const mustNotSet = new Set(opt.mustNot);
      const results = [];
      const seen = new Set();

      // Candidate words that fit the current remaining letters at all
      const pool = [];
      for (let i = 0; i < DICT.length; i++) {
        const word = DICT[i];
        const len = word.length;
        if (len < minLen || len > maxLen) continue;
        if (opt.prefix && !word.startsWith(opt.prefix)) continue;
        if (opt.suffix && !word.endsWith(opt.suffix)) continue;
        let bad = false;
        for (const ch of word) if (mustNotSet.has(ch)) { bad = true; break; }
        if (bad) continue;
        const wc = DICT_COUNTS[i];
        if (!canForm(wc, remaining)) continue;
        pool.push({ word, counts: wc, len });
      }

      // Prefer longer words first → fewer deep branches
      pool.sort((a, b) => b.len - a.len);

      const startTime = performance.now();
      const TIME_BUDGET = 450; // ms

      function search(inv, path, startIdx) {
        if (results.length >= maxResults) return;
        if (performance.now() - startTime > TIME_BUDGET) return;

        const left = totalLetters(inv);
        if (left === 0 && path.length >= 2) {
          const key = path.slice().sort().join(" ");
          if (!seen.has(key)) {
            seen.add(key);
            results.push({
              phrase: path.join(" · "),
              words: path.slice(),
            });
          }
          return;
        }
        if (path.length >= maxDepth) return;
        if (left < minLen) return;

        for (let i = startIdx; i < pool.length; i++) {
          const w = pool[i];
          if (w.len > left) continue;
          if (!canForm(w.counts, inv)) continue;
          // keep non-decreasing length order to reduce duplicates
          if (path.length && w.len > path[path.length - 1].length) continue;

          const nextInv = subtract(inv, w.counts);
          path.push(w.word);
          search(nextInv, path, i); // allow same word again? use i+1 to forbid reuse of earlier pool entries
          path.pop();

          if (results.length >= maxResults) return;
          if (performance.now() - startTime > TIME_BUDGET) return;
        }
      }

      search(remaining.slice(), [], 0);

      // Also accept near-complete (small leftovers) if we have few exact hits
      if (results.length < 8) {
        // light second pass already covered by early exits; keep simple for v1
      }

      renderSuggestions(results);
    }

    function findSuggestions() {
      if (!DICT.length) return;
      if (mode === "phrases") {
        $("sugLabel").textContent = "Phrase suggestions";
        findPhrases();
      } else {
        $("sugLabel").textContent = "Word suggestions";
        findWords();
      }
    }

    // ------------------------------------------------------------
    // Claim / Undo / Clear
    // ------------------------------------------------------------
    function claim(word) {
      const wc = countsFrom(word);
      if (!canForm(wc, remaining)) return;
      remaining = subtract(remaining, wc);
      claimed.push({ word, counts: wc });
      renderInventory();
      renderClaimed();
      findSuggestions();
    }

    function claimPhrase(words) {
      for (const w of words) {
        const wc = countsFrom(w);
        if (!canForm(wc, remaining)) return;
        remaining = subtract(remaining, wc);
        claimed.push({ word: w, counts: wc });
      }
      renderInventory();
      renderClaimed();
      findSuggestions();
    }

    function undo() {
      if (!claimed.length) return;
      const last = claimed.pop();
      remaining = add(remaining, last.counts);
      renderInventory();
      renderClaimed();
      findSuggestions();
    }

    function onPhraseInput() {
      const cleaned = normalize($("phrase").value);
      original = countsFrom(cleaned);
      remaining = original.slice();
      for (const c of claimed) {
        remaining = subtract(remaining, c.counts);
        for (let i = 0; i < 26; i++) if (remaining[i] < 0) remaining[i] = 0;
      }
      renderInventory();
      findSuggestions();
    }

    // ------------------------------------------------------------
    // Export — Wordstar Nexus marked .txt
    // ------------------------------------------------------------
    function buildExportText() {
      const phrase = $("phrase").value.trim() || "(none)";
      const words = claimed.map((c) => c.word);
      const leftover = inventoryToString(remaining);
      const now = new Date().toISOString().slice(0, 19).replace("T", " ");

      // Pure ASCII — avoids mojibake on Android / strict viewers
      const rule = "==================================================";
      const sub  = "--------------------------------------------------";

      const lines = [
        rule,
        "  WORDSTAR NEXUS  -  ANAGRAM ENGINE",
        rule,
        "",
        `Generated : ${now}`,
        `Source    : ${phrase}`,
        `Mode      : ${mode}`,
        "",
        "Claimed",
        sub,
        words.length ? words.map((w, i) => `  ${String(i + 1).padStart(2)}. ${w}`).join("\n") : "  (none)",
        "",
        "Leftover letters",
        sub,
        leftover ? `  ${leftover}` : "  (none - perfect anagram)",
        "",
        "Build line",
        sub,
        words.length
          ? `  ${words.join(" + ")}${leftover ? "  |  leftover: " + leftover : ""}`
          : "  -",
        "",
        rule,
        "  wordstar.nexus/gram",
        rule,
        "",
      ];
      return lines.join("\n");
    }

    function downloadTxt() {
      const text = buildExportText();
      const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      const stamp = new Date().toISOString().slice(0, 10);
      a.href = url;
      a.download = `wordstar-nexus-anagram-${stamp}.txt`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      $("status").textContent = "Exported .txt";
      setTimeout(() => {
        $("status").textContent = `Ready · ${DICT.length.toLocaleString()} words`;
      }, 1600);
    }

    function copyBuild() {
      const text = buildExportText();
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => {
          $("status").textContent = "Copied to clipboard";
          setTimeout(() => {
            $("status").textContent = `Ready · ${DICT.length.toLocaleString()} words`;
          }, 1500);
        });
      }
    }

    // ------------------------------------------------------------
    // Mode switching
    // ------------------------------------------------------------
    function setMode(m) {
      mode = m;
      $("modeWords").classList.toggle("active", m === "words");
      $("modePhrases").classList.toggle("active", m === "phrases");
      $("phraseDepthOpt").style.opacity = m === "phrases" ? "1" : "0.45";
      findSuggestions();
    }

    // ------------------------------------------------------------
    // Wire up
    // ------------------------------------------------------------
    $("btnFind").addEventListener("click", findSuggestions);
    $("btnUndo").addEventListener("click", undo);
    $("btnClear").addEventListener("click", () => {
      claimed = [];
      $("phrase").value = "";
      remaining = new Uint8Array(26);
      original = new Uint8Array(26);
      renderInventory();
      renderClaimed();
      renderSuggestions([]);
      $("phrase").focus();
    });
    $("btnExportTxt").addEventListener("click", downloadTxt);
    $("btnCopy").addEventListener("click", copyBuild);

    $("modeWords").addEventListener("click", () => setMode("words"));
    $("modePhrases").addEventListener("click", () => setMode("phrases"));

    $("phrase").addEventListener("input", onPhraseInput);

    ["minLen", "maxLen", "prefix", "suffix", "must", "mustNot", "rankBy", "maxResults", "phraseDepth"].forEach((id) => {
      const el = $(id);
      el.addEventListener("change", findSuggestions);
      el.addEventListener("input", () => {
        if (["prefix", "suffix", "must", "mustNot"].includes(id)) findSuggestions();
      });
    });

    // Load dictionary
    async function loadDict() {
      try {
        let res = await fetch("words.json");
        if (!res.ok) throw new Error("local missing");
        DICT = await res.json();
      } catch {
        $("status").textContent = "Fetching dictionary…";
        const res = await fetch("https://raw.githubusercontent.com/adambom/dictionary/master/dictionary.json");
        const raw = await res.json();
        const set = new Set();
        for (const k of Object.keys(raw)) {
          const w = k.toLowerCase().replace(/[^a-z]/g, "");
          if (w.length >= 2 && w.length <= 20) set.add(w);
        }
        DICT = Array.from(set).sort();
      }

      DICT_COUNTS = DICT.map((w) => countsFrom(w));
      $("status").textContent = `Ready · ${DICT.length.toLocaleString()} words`;
      onPhraseInput();
    }

    loadDict();
  </script>
</body>
</html>
