<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anagram Engine</title>
  <style>
    :root {
      --red: #ff0033;
      --black: #0a0a0a;
      --grey: #1a1a1a;
      --white: #ffffff;
      --muted: #888;
      --border: #2a2a2a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    ::selection {
      background: var(--red);
      color: var(--black);
      text-shadow: none;
    }

    body {
      font-family: "SF Mono", "Fira Code", "Consolas", "Menlo", monospace;
      background: var(--black);
      color: var(--white);
      min-height: 100vh;
      line-height: 1.4;
      font-size: 14px;
    }

    .app {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.5rem;
      display: grid;
      gap: 1.25rem;
    }

    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.75rem;
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--red);
    }

    header .status {
      font-size: 0.75rem;
      color: var(--muted);
    }

    /* Input + Inventory */
    .input-row {
      display: grid;
      gap: 0.5rem;
    }

    label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    input[type="text"],
    input[type="number"],
    select {
      background: var(--grey);
      border: 1px solid var(--border);
      color: var(--white);
      padding: 0.55rem 0.75rem;
      font: inherit;
      border-radius: 2px;
      width: 100%;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: var(--red);
    }

    .inventory {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      align-items: center;
      min-height: 2.2rem;
      padding: 0.5rem 0;
    }

    .letter-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 1.6rem;
      height: 1.6rem;
      padding: 0 0.3rem;
      background: var(--grey);
      border: 1px solid var(--border);
      font-size: 0.85rem;
      font-weight: 600;
    }

    .letter-chip.vowel {
      border-color: var(--red);
      color: var(--red);
    }

    .letter-chip.zero {
      opacity: 0.25;
    }

    .meta {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .meta strong {
      color: var(--white);
    }

    /* Options */
    .options {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 0.75rem;
      padding: 0.9rem;
      background: var(--grey);
      border: 1px solid var(--border);
    }

    .opt {
      display: grid;
      gap: 0.25rem;
    }

    /* Actions */
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    button {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--white);
      padding: 0.45rem 0.9rem;
      font: inherit;
      font-size: 0.8rem;
      cursor: pointer;
      border-radius: 2px;
      transition: border-color 0.15s, color 0.15s;
    }

    button:hover {
      border-color: var(--red);
      color: var(--red);
    }

    button.primary {
      background: var(--red);
      border-color: var(--red);
      color: var(--black);
      font-weight: 600;
    }

    button.primary:hover {
      background: #ff3355;
      border-color: #ff3355;
      color: var(--black);
    }

    button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    /* Main panels */
    .panels {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
    }

    @media (max-width: 720px) {
      .panels {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      border: 1px solid var(--border);
      background: #0d0d0d;
      display: flex;
      flex-direction: column;
      min-height: 280px;
    }

    .panel-head {
      padding: 0.55rem 0.75rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .panel-body {
      flex: 1;
      overflow-y: auto;
      max-height: 420px;
      padding: 0.4rem 0;
    }

    /* Suggestions */
    .suggestion {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.4rem 0.75rem;
      cursor: pointer;
      border-left: 2px solid transparent;
    }

    .suggestion:hover {
      background: var(--grey);
      border-left-color: var(--red);
    }

    .suggestion .word {
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    .suggestion .len {
      font-size: 0.7rem;
      color: var(--muted);
    }

    /* Claimed */
    .claimed-list {
      list-style: none;
    }

    .claimed-list li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.4rem 0.75rem;
      border-bottom: 1px solid #151515;
    }

    .claimed-list .word {
      font-weight: 600;
      color: var(--red);
    }

    .empty {
      padding: 1.5rem 0.75rem;
      color: var(--muted);
      font-size: 0.85rem;
    }

    /* Footer / export */
    .footer {
      border-top: 1px solid var(--border);
      padding-top: 0.75rem;
      font-size: 0.8rem;
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: space-between;
    }

    .export-box {
      background: var(--grey);
      border: 1px solid var(--border);
      padding: 0.6rem 0.75rem;
      font-size: 0.85rem;
      word-break: break-word;
      min-height: 2.5rem;
      width: 100%;
      margin-top: 0.4rem;
    }

    .loading {
      color: var(--muted);
      font-size: 0.85rem;
      padding: 1rem;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>ANAGRAM ENGINE</h1>
      <div class="status" id="status">Loading dictionary…</div>
    </header>

    <div class="input-row">
      <label for="phrase">Source phrase</label>
      <input type="text" id="phrase" placeholder="Type or paste a phrase…" autocomplete="off" spellcheck="false" />
      <div class="inventory" id="inventory"></div>
      <div class="meta" id="meta"></div>
    </div>

    <div class="options">
      <div class="opt">
        <label>Min length</label>
        <input type="number" id="minLen" value="3" min="2" max="20" />
      </div>
      <div class="opt">
        <label>Max length</label>
        <input type="number" id="maxLen" value="12" min="2" max="25" />
      </div>
      <div class="opt">
        <label>Prefix</label>
        <input type="text" id="prefix" placeholder="" maxlength="8" />
      </div>
      <div class="opt">
        <label>Suffix</label>
        <input type="text" id="suffix" placeholder="" maxlength="8" />
      </div>
      <div class="opt">
        <label>Must contain</label>
        <input type="text" id="must" placeholder="" maxlength="12" />
      </div>
      <div class="opt">
        <label>Must not</label>
        <input type="text" id="mustNot" placeholder="" maxlength="12" />
      </div>
      <div class="opt">
        <label>Rank by</label>
        <select id="rankBy">
          <option value="length">Length (longest)</option>
          <option value="remaining">Remaining goodness</option>
          <option value="alpha">Alphabetical</option>
        </select>
      </div>
      <div class="opt">
        <label>Max results</label>
        <input type="number" id="maxResults" value="50" min="10" max="200" />
      </div>
    </div>

    <div class="actions">
      <button class="primary" id="btnFind">Find</button>
      <button id="btnUndo" disabled>Undo</button>
      <button id="btnClear">Clear</button>
      <button id="btnExport">Export</button>
    </div>

    <div class="panels">
      <div class="panel">
        <div class="panel-head">
          <span>Suggestions</span>
          <span id="sugCount">0</span>
        </div>
        <div class="panel-body" id="suggestions">
          <div class="empty">Enter a phrase and hit Find (or just type).</div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-head">
          <span>Claimed</span>
          <span id="claimedCount">0</span>
        </div>
        <div class="panel-body">
          <ul class="claimed-list" id="claimed"></ul>
          <div class="empty" id="claimedEmpty">No words claimed yet.</div>
        </div>
      </div>
    </div>

    <div class="footer">
      <div>
        <div>Export / current build</div>
        <div class="export-box" id="exportBox">—</div>
      </div>
    </div>
  </div>

  <script>
    // ============================================================
    // Anagram Engine — core
    // ============================================================

    const VOWELS = new Set("aeiou");

    /** @type {string[]} */
    let DICT = [];

    /** Letter counts 0-25 for a-z */
    function countsFrom(str) {
      const c = new Uint8Array(26);
      for (const ch of str) {
        const i = ch.charCodeAt(0) - 97;
        if (i >= 0 && i < 26) c[i]++;
      }
      return c;
    }

    function canForm(wordCounts, inventory) {
      for (let i = 0; i < 26; i++) {
        if (wordCounts[i] > inventory[i]) return false;
      }
      return true;
    }

    function subtract(inventory, wordCounts) {
      const next = inventory.slice();
      for (let i = 0; i < 26; i++) next[i] -= wordCounts[i];
      return next;
    }

    function add(inventory, wordCounts) {
      const next = inventory.slice();
      for (let i = 0; i < 26; i++) next[i] += wordCounts[i];
      return next;
    }

    function inventoryToString(inv) {
      let s = "";
      for (let i = 0; i < 26; i++) {
        s += String.fromCharCode(97 + i).repeat(inv[i]);
      }
      return s;
    }

    function vowelPct(inv) {
      let total = 0, vows = 0;
      for (let i = 0; i < 26; i++) {
        total += inv[i];
        if (VOWELS.has(String.fromCharCode(97 + i))) vows += inv[i];
      }
      return total === 0 ? 0 : Math.round((vows / total) * 100);
    }

    function totalLetters(inv) {
      let t = 0;
      for (let i = 0; i < 26; i++) t += inv[i];
      return t;
    }

    // Remaining "goodness": prefer words that leave balanced vowels / avoid rare letters
    // Simple heuristic: higher remaining vowel % + fewer leftover rare letters is better
    const RARE = new Set("jqxz");
    function remainingScore(after) {
      const tot = totalLetters(after);
      if (tot === 0) return 1000; // perfect
      const vp = vowelPct(after);
      let rare = 0;
      for (let i = 0; i < 26; i++) {
        if (RARE.has(String.fromCharCode(97 + i))) rare += after[i];
      }
      return vp * 2 - rare * 8 - tot * 0.3;
    }

    // ------------------------------------------------------------
    // State
    // ------------------------------------------------------------
    let remaining = new Uint8Array(26);
    let original = new Uint8Array(26);
    /** @type {{word:string, counts:Uint8Array}[]} */
    let claimed = [];
    let lastSuggestions = [];

    // ------------------------------------------------------------
    // DOM
    // ------------------------------------------------------------
    const $ = (id) => document.getElementById(id);
    const phraseEl = $("phrase");
    const invEl = $("inventory");
    const metaEl = $("meta");
    const sugEl = $("suggestions");
    const claimedEl = $("claimed");
    const claimedEmpty = $("claimedEmpty");
    const statusEl = $("status");
    const exportBox = $("exportBox");

    function normalize(str) {
      return (str || "").toLowerCase().replace(/[^a-z]/g, "");
    }

    function getOptions() {
      return {
        minLen: Math.max(2, parseInt($("minLen").value, 10) || 3),
        maxLen: Math.min(25, parseInt($("maxLen").value, 10) || 12),
        prefix: normalize($("prefix").value),
        suffix: normalize($("suffix").value),
        must: normalize($("must").value),
        mustNot: normalize($("mustNot").value),
        rankBy: $("rankBy").value,
        maxResults: Math.min(200, parseInt($("maxResults").value, 10) || 50),
      };
    }

    function renderInventory() {
      invEl.innerHTML = "";
      const letters = [];
      for (let i = 0; i < 26; i++) {
        const n = remaining[i];
        const ch = String.fromCharCode(97 + i);
        if (n === 0 && original[i] === 0) continue;
        const chip = document.createElement("span");
        chip.className = "letter-chip" + (VOWELS.has(ch) ? " vowel" : "") + (n === 0 ? " zero" : "");
        chip.textContent = n > 1 ? ch + n : ch;
        letters.push(chip);
      }
      if (letters.length === 0) {
        invEl.innerHTML = '<span class="meta">No letters</span>';
      } else {
        letters.forEach((c) => invEl.appendChild(c));
      }
      const tot = totalLetters(remaining);
      const vp = vowelPct(remaining);
      metaEl.innerHTML = `<strong>${tot}</strong> letters remaining · <strong>${vp}%</strong> vowels`;
    }

    function renderClaimed() {
      claimedEl.innerHTML = "";
      claimed.forEach((c, idx) => {
        const li = document.createElement("li");
        li.innerHTML = `<span class="word">${c.word}</span><span class="len">${c.word.length}</span>`;
        claimedEl.appendChild(li);
      });
      claimedEmpty.style.display = claimed.length ? "none" : "block";
      $("claimedCount").textContent = claimed.length;
      $("btnUndo").disabled = claimed.length === 0;
      updateExport();
    }

    function updateExport() {
      const words = claimed.map((c) => c.word).join(" · ");
      const left = inventoryToString(remaining);
      exportBox.textContent = words
        ? (left ? `${words}  |  leftover: ${left}` : words)
        : (left ? `leftover: ${left}` : "—");
    }

    function renderSuggestions(list) {
      lastSuggestions = list;
      sugEl.innerHTML = "";
      if (!list.length) {
        sugEl.innerHTML = '<div class="empty">No matches with current filters / remaining letters.</div>';
        $("sugCount").textContent = "0";
        return;
      }
      const frag = document.createDocumentFragment();
      list.forEach((item) => {
        const div = document.createElement("div");
        div.className = "suggestion";
        div.innerHTML = `<span class="word">${item.word}</span><span class="len">${item.word.length}</span>`;
        div.addEventListener("click", () => claim(item.word));
        frag.appendChild(div);
      });
      sugEl.appendChild(frag);
      $("sugCount").textContent = list.length;
    }

    // ------------------------------------------------------------
    // Engine
    // ------------------------------------------------------------
    function findSuggestions() {
      if (!DICT.length) return;
      const opt = getOptions();
      const mustC = countsFrom(opt.must);
      const mustNotSet = new Set(opt.mustNot);

      const candidates = [];
      for (const word of DICT) {
        const len = word.length;
        if (len < opt.minLen || len > opt.maxLen) continue;
        if (opt.prefix && !word.startsWith(opt.prefix)) continue;
        if (opt.suffix && !word.endsWith(opt.suffix)) continue;

        // must-not letters
        let bad = false;
        for (const ch of word) {
          if (mustNotSet.has(ch)) { bad = true; break; }
        }
        if (bad) continue;

        const wc = countsFrom(word);
        // must-contain
        if (!canForm(mustC, wc)) continue;
        // fits remaining inventory
        if (!canForm(wc, remaining)) continue;

        candidates.push({ word, counts: wc, len });
      }

      // rank
      if (opt.rankBy === "length") {
        candidates.sort((a, b) => b.len - a.len || a.word.localeCompare(b.word));
      } else if (opt.rankBy === "alpha") {
        candidates.sort((a, b) => a.word.localeCompare(b.word));
      } else {
        // remaining goodness
        candidates.sort((a, b) => {
          const sa = remainingScore(subtract(remaining, a.counts));
          const sb = remainingScore(subtract(remaining, b.counts));
          return sb - sa || b.len - a.len;
        });
      }

      renderSuggestions(candidates.slice(0, opt.maxResults));
    }

    function claim(word) {
      const wc = countsFrom(word);
      if (!canForm(wc, remaining)) return;
      remaining = subtract(remaining, wc);
      claimed.push({ word, counts: wc });
      renderInventory();
      renderClaimed();
      findSuggestions();
    }

    function undo() {
      if (!claimed.length) return;
      const last = claimed.pop();
      remaining = add(remaining, last.counts);
      renderInventory();
      renderClaimed();
      findSuggestions();
    }

    function clearAll() {
      claimed = [];
      const cleaned = normalize(phraseEl.value);
      remaining = countsFrom(cleaned);
      original = remaining.slice();
      renderInventory();
      renderClaimed();
      findSuggestions();
    }

    function onPhraseInput() {
      const cleaned = normalize(phraseEl.value);
      // only reset remaining if no claims, or always rebuild from original - claims
      original = countsFrom(cleaned);
      // rebuild remaining from original minus claimed
      remaining = original.slice();
      for (const c of claimed) {
        remaining = subtract(remaining, c.counts);
        // safety: if over-subtract (phrase changed), clamp
        for (let i = 0; i < 26; i++) if (remaining[i] < 0) remaining[i] = 0;
      }
      renderInventory();
      findSuggestions();
    }

    // ------------------------------------------------------------
    // Wire up
    // ------------------------------------------------------------
    $("btnFind").addEventListener("click", findSuggestions);
    $("btnUndo").addEventListener("click", undo);
    $("btnClear").addEventListener("click", () => {
      claimed = [];
      phraseEl.value = "";
      remaining = new Uint8Array(26);
      original = new Uint8Array(26);
      renderInventory();
      renderClaimed();
      renderSuggestions([]);
      phraseEl.focus();
    });
    $("btnExport").addEventListener("click", () => {
      const text = exportBox.textContent;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => {
          statusEl.textContent = "Copied to clipboard";
          setTimeout(() => (statusEl.textContent = `Ready · ${DICT.length.toLocaleString()} words`), 1500);
        });
      }
    });

    phraseEl.addEventListener("input", onPhraseInput);
    ["minLen", "maxLen", "prefix", "suffix", "must", "mustNot", "rankBy", "maxResults"].forEach((id) => {
      $(id).addEventListener("change", findSuggestions);
      $(id).addEventListener("input", () => {
        if (id === "prefix" || id === "suffix" || id === "must" || id === "mustNot") findSuggestions();
      });
    });

    // Load dictionary
    async function loadDict() {
      try {
        // Prefer local words.json (pre-extracted). Fallback to remote if needed.
        let res = await fetch("words.json");
        if (!res.ok) throw new Error("local missing");
        DICT = await res.json();
        statusEl.textContent = `Ready · ${DICT.length.toLocaleString()} words`;
      } catch (e) {
        statusEl.textContent = "Fetching dictionary…";
        try {
          const res = await fetch("https://raw.githubusercontent.com/adambom/dictionary/master/dictionary.json");
          const raw = await res.json();
          const set = new Set();
          for (const k of Object.keys(raw)) {
            const w = k.toLowerCase().replace(/[^a-z]/g, "");
            if (w.length >= 2 && w.length <= 20) set.add(w);
          }
          DICT = Array.from(set).sort();
          statusEl.textContent = `Ready · ${DICT.length.toLocaleString()} words (remote)`;
        } catch (err) {
          statusEl.textContent = "Dictionary load failed";
          console.error(err);
        }
      }
      onPhraseInput();
    }

    loadDict();
  </script>
</body>
</html>
