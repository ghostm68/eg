    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&family=Noto+Sans&family=Share+Tech+Mono&family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

    <!-- Animation & PDF Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc =
            'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Open+Sans:wght@400;700&family=Lato:wght@400;700&family=Merriweather:wght@400;700&family=Montserrat:wght@400;700&family=Playfair+Display:wght@400;700&family=Source+Sans+Pro:wght@400;700&family=Oswald:wght@400;700&family=Raleway:wght@400;700&family=Ubuntu:wght@400;700&family=Pacifico&family=Shadows+Into+Light&family=Permanent+Marker&family=Caveat&family=Indie+Flower&family=Lobster&family=Amatic+SC&family=Dancing+Script&family=Satisfy&family=Great+Vibes&family=Kaushan+Script&family=Courgette&family=Fredoka+One&family=Righteous&family=Bangers&family=Creepster&family=Press+Start+2P&family=VT323&family=Orbitron&family=Bungee&family=Bungee+Shade&family=Faster+One&family=Monoton&family=Wallpoet&family=Nosifer&family=Eater&family=Butcherman&family=Frijole&family=Henny+Penny&family=Almendra+Display&family=Bigelow+Rules&family=Diplomata+SC&family=Snowburst+One&family=Jolly+Lodger&family=Emblema+One&family=Ewert&family=Flavors&family=Warnes&family=Ruge+Boogie&family=Lora&family=EB+Garamond&family=Poppins&family=Roboto+Slab&family=Cinzel&family=Anton&family=Source+Code+Pro&display=swap');

        /* ==================== CUSTOM ARCHIVAL FONTS ==================== */
        @font-face {
            font-family: 'Inkrealm';
            src: url('https://raw.githubusercontent.com/ghostm68/inktwo/main/fonts/Inkrealm-Regular.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Fleming';
            src: url('https://raw.githubusercontent.com/ghostm68/eg/main/fonts/fleming-regular.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Keira';
            src: url('https://raw.githubusercontent.com/ghostm68/eg/main/fonts/keira-regular.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'WSB';
            src: url('https://raw.githubusercontent.com/ghostm68/eg/main/fonts/wsb-regular.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Wordstar';
            src: url('https://raw.githubusercontent.com/ghostm68/eg/main/fonts/wordstar.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --c-black: #06080a;
            --c-panel: #0c1014;
            --c-silver: #9aa6b2;
            --c-white: #f4f7fa;

            /* DEFAULT PHOSPHOR: FROST WHITE */
            --crt-phosphor: #eef3f8;
            --crt-accent: #b8d0e8;
            --crt-dim: #3d4854;
            --crt-glow: rgba(235, 243, 252, 0.42);
            --crt-border: rgba(226, 236, 246, 0.30);
            --crt-bg: rgba(8, 10, 13, 0.85);
            --crt-highlight: #ffffff;
            --trail-rgb: 228, 238, 248;
            --video-opacity: 0.35;
            --video-contrast: 1.05;

            /* EDITOR TYPOGRAPHY */
            --editor-font: 'Courier New', monospace;
            --editor-weight: normal;
            --editor-style: normal;
        }

        [data-theme="frost"] {
            --crt-phosphor: #eef3f8;
            --crt-accent: #b8d0e8;
            --crt-dim: #3d4854;
            --crt-glow: rgba(235, 243, 252, 0.42);
            --crt-border: rgba(226, 236, 246, 0.30);
            --crt-bg: rgba(8, 10, 13, 0.85);
            --trail-rgb: 228, 238, 248;
        }

        [data-theme="birch"] {
            --crt-phosphor: #00ff66;
            --crt-accent: #00d48a;
            --crt-dim: #164f32;
            --crt-glow: rgba(0, 255, 102, 0.45);
            --crt-border: rgba(0, 255, 102, 0.35);
            --crt-bg: rgba(6, 11, 8, 0.84);
            --trail-rgb: 0, 255, 102;
        }

        [data-theme="amber"] {
            --crt-phosphor: #ffb000;
            --crt-accent: #ff8800;
            --crt-dim: #5c3d00;
            --crt-glow: rgba(255, 176, 0, 0.45);
            --crt-border: rgba(255, 176, 0, 0.35);
            --crt-bg: rgba(12, 9, 4, 0.85);
            --trail-rgb: 255, 176, 0;
        }

        [data-theme="crimson"] {
            --crt-phosphor: #ff3333;
            --crt-accent: #e61c1c;
            --crt-dim: #540e0e;
            --crt-glow: rgba(255, 51, 51, 0.55);
            --crt-border: rgba(230, 28, 28, 0.4);
            --crt-bg: rgba(12, 5, 5, 0.85);
            --trail-rgb: 230, 28, 28;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Scrollbars */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.45);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--crt-dim);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--crt-phosphor);
        }
        * {
            scrollbar-width: thin;
            scrollbar-color: var(--crt-dim) rgba(0, 0, 0, 0.45);
        }

        html, body {
            height: 100%;
            background-color: var(--c-black);
            color: var(--c-silver);
            font-family: 'Share Tech Mono', monospace;
            overflow-x: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            padding-bottom: calc(84px + env(safe-area-inset-bottom));
            position: relative;
        }

        /* Subtle Atmospheric Birch Backdrop */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: url('https://github.com/ghostm68/pantheon/raw/main/birchsnowwordstar2.gif');
            background-size: cover;
            background-position: center;
            opacity: 0.22;
            filter: contrast(1.08) saturate(0.65);
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, rgba(6, 8, 10, 0.35) 0%, rgba(6, 8, 10, 0.94) 86%);
            pointer-events: none;
            z-index: 0;
        }

        /* FULLSCREEN CRT LASER CURSOR TRAIL */
        #trailCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 99999;
        }

        /* ==================== SLEEK HARDWARE HEADER ==================== */
        header.hardware-shelf {
            position: relative;
            width: 100%;
            background: linear-gradient(180deg, rgba(16, 19, 23, 0.94) 0%, rgba(7, 9, 11, 0.96) 100%);
            border-bottom: 1px solid var(--crt-dim);
            padding: 8px 22px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            z-index: 100;
            backdrop-filter: blur(12px);
        }

        .brand-zone {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .birch-emblem {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 3px 10px 3px 8px;
            border: 1px solid var(--crt-dim);
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.45);
        }

        .birch-rune {
            font-size: 1.25rem;
            color: var(--crt-phosphor);
            text-shadow: 0 0 8px var(--crt-glow);
            line-height: 1;
        }

        .brand-title {
            font-family: 'Cinzel', serif;
            font-size: 0.9rem;
            letter-spacing: 2px;
            color: var(--c-white);
        }

        .brand-sub {
            font-size: 0.62rem;
            color: var(--c-silver);
            letter-spacing: 1.2px;
        }

        .status-cluster {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.68rem;
            color: var(--c-silver);
            letter-spacing: 1px;
        }

        .live-dot {
            width: 7px;
            height: 7px;
            background-color: var(--crt-phosphor);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--crt-phosphor);
            animation: breathDot 2.2s infinite ease-in-out;
        }

        @keyframes breathDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.35; transform: scale(0.82); }
        }

        .header-badge {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--crt-dim);
            color: var(--c-white);
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.64rem;
            letter-spacing: 1px;
            padding: 5px 10px;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .header-badge:hover {
            background: var(--crt-dim);
            border-color: var(--crt-phosphor);
            color: #fff;
            box-shadow: 0 0 10px var(--crt-glow);
        }

        /* ==================== SCREENPLAY CRT STAGE ==================== */
        .stage-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 920px;
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 16px 16px 8px;
        }

        .screen-aperture {
            position: relative;
            flex: 1;
            min-height: 64dvh;
            width: 100%;
            background: var(--crt-bg);
            border: 1px solid var(--crt-border);
            border-radius: 10px;
            box-shadow:
                0 22px 65px rgba(0, 0, 0, 0.92),
                inset 0 0 32px rgba(0, 0, 0, 0.95),
                0 0 24px rgba(0, 0, 0, 0.7);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(6px);
        }

        /* Subtle CRT Scanlines */
        .screen-aperture::before {
            content: " ";
            position: absolute;
            inset: 0;
            background: linear-gradient(rgba(10, 10, 10, 0) 50%, rgba(0, 0, 0, 0.30) 50%);
            background-size: 100% 3px;
            z-index: 8;
            pointer-events: none;
        }

        /* CRT Edge Vignette & Readability Scrim */
        .screen-aperture::after {
            content: " ";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(0, 0, 0, 0.14) 0%, rgba(0, 0, 0, 0.45) 72%, rgba(0, 0, 0, 0.84) 100%);
            z-index: 9;
            pointer-events: none;
        }

        /* SWITCHABLE BACKGROUND VIDEO LAYER INSIDE TEXT AREA */
        .crt-video-layer {
            position: absolute;
            inset: 0;
            opacity: var(--video-opacity);
            pointer-events: none;
            z-index: 1;
            transition: opacity 0.4s ease;
            overflow: hidden;
        }

        .crt-video-layer video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
            filter: contrast(var(--video-contrast)) brightness(0.86) saturate(0.82);
        }

        .crt-video-layer iframe {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 135%;
            height: 135%;
            min-width: 100%;
            min-height: 100%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            border: none;
            filter: contrast(var(--video-contrast)) brightness(0.84) saturate(0.82);
        }

        .crt-header {
            position: relative;
            z-index: 10;
            background: rgba(8, 10, 13, 0.88);
            border-bottom: 1px dashed var(--crt-dim);
            color: var(--crt-phosphor);
            font-family: 'VT323', monospace;
            font-size: 1.05rem;
            padding: 5px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            letter-spacing: 1.5px;
            text-shadow: 0 0 6px var(--crt-glow);
        }

        #editor {
            position: relative;
            z-index: 5;
            flex: 1;
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            resize: none;
            color: var(--crt-phosphor);
            font-family: var(--editor-font);
            font-weight: var(--editor-weight);
            font-style: var(--editor-style);
            font-size: 16px;
            line-height: 1.55;
            padding: 24px 28px;
            text-shadow: 0 0 8px var(--crt-glow), 0 1px 2px rgba(0, 0, 0, 0.96);
            white-space: pre-wrap;
            word-break: break-word;
            caret-color: var(--crt-highlight);
            -webkit-overflow-scrolling: touch;
        }

        #editor::placeholder {
            color: var(--crt-phosphor);
            opacity: 0.42;
        }

        #editor::selection {
            background: var(--crt-phosphor);
            color: #06080a;
            text-shadow: none;
        }

        .crt-footer {
            position: relative;
            z-index: 10;
            background: rgba(8, 10, 13, 0.90);
            border-top: 1px dashed var(--crt-dim);
            color: var(--crt-phosphor);
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.68rem;
            padding: 5px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            letter-spacing: 1px;
        }

        /* ==================== FLUID HOVER-UP DOCK ==================== */
        .hover-dock-wrapper {
            position: fixed;
            bottom: calc(12px + env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            z-index: 9000;
            max-width: calc(100vw - 16px);
        }

        .hover-dock {
            position: relative;
            background: rgba(12, 15, 19, 0.88);
            backdrop-filter: blur(18px) saturate(160%);
            border: 1px solid var(--crt-border);
            box-shadow: 0 12px 38px rgba(0, 0, 0, 0.92), 0 0 18px rgba(0, 0, 0, 0.6);
            border-radius: 40px;
            padding: 6px 14px;
            display: flex;
            align-items: center;
            gap: 9px;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform: translateY(0) scale(0.97);
        }

        @media (hover: hover) {
            .hover-dock-wrapper:hover .hover-dock {
                transform: translateY(-6px) scale(1);
                background: rgba(15, 19, 24, 0.96);
                border-color: var(--crt-phosphor);
                box-shadow: 0 18px 46px rgba(0, 0, 0, 0.96), 0 0 22px var(--crt-glow);
            }
        }

        .dock-section {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .dock-divider {
            width: 1px;
            height: 18px;
            background: rgba(255, 255, 255, 0.14);
            flex-shrink: 0;
        }

        .dock-select {
            background: transparent;
            border: 1px solid transparent;
            color: var(--c-white);
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.72rem;
            letter-spacing: 0.8px;
            outline: none;
            cursor: pointer;
            padding: 5px 6px;
            border-radius: 14px;
            max-width: 140px;
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .dock-select:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--crt-dim);
        }

        .dock-select option {
            background: #0d1116;
            color: #eef3f8;
        }

        .dock-pill {
            background: transparent;
            border: 1px solid transparent;
            color: var(--c-silver);
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.7rem;
            padding: 6px 10px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            text-transform: uppercase;
            letter-spacing: 0.9px;
            outline: none;
            white-space: nowrap;
            -webkit-tap-highlight-color: transparent;
        }

        .dock-pill:hover {
            color: var(--c-white);
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--crt-dim);
        }

        .dock-pill.active {
            color: var(--c-white);
            border-color: var(--crt-phosphor);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 12px var(--crt-glow);
        }

        /* BOLD & ITALIC TOGGLES */
        .type-toggle {
            font-family: 'Cinzel', serif;
            font-weight: 800;
            width: 28px;
            height: 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.16);
            color: var(--c-silver);
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.74rem;
            background: transparent;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .type-toggle:hover {
            color: #fff;
            border-color: var(--crt-phosphor);
        }

        .type-toggle.active {
            background: var(--crt-phosphor);
            color: #06080a;
            border-color: var(--crt-phosphor);
            box-shadow: 0 0 10px var(--crt-glow);
        }

        /* ==================== VIDEO DECK HUD MODAL ==================== */
        .hud-panel {
            position: fixed;
            bottom: calc(74px + env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            background: rgba(11, 14, 18, 0.97);
            border: 1px solid var(--crt-border);
            border-radius: 10px;
            padding: 14px 18px;
            z-index: 9999;
            box-shadow: 0 16px 45px rgba(0, 0, 0, 0.96), 0 0 20px rgba(0, 0, 0, 0.8);
            font-size: 0.74rem;
            width: min(390px, calc(100vw - 24px));
            display: none;
            backdrop-filter: blur(16px);
        }

        .hud-panel.show {
            display: block;
            animation: floatUp 0.28s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes floatUp {
            from { opacity: 0; transform: translate(-50%, 14px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }

        .hud-header {
            font-weight: bold;
            color: var(--c-white);
            margin-bottom: 10px;
            border-bottom: 1px solid var(--crt-dim);
            padding-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            letter-spacing: 1px;
        }

        .hud-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 9px;
            gap: 10px;
        }

        .hud-row label {
            color: var(--c-silver);
            min-width: 72px;
        }

        .hud-row input[type="range"],
        .hud-row input[type="text"],
        .hud-row select {
            flex: 1;
            accent-color: var(--crt-phosphor);
            background: #080a0d;
            border: 1px solid var(--crt-dim);
            color: #fff;
            padding: 6px 8px;
            border-radius: 5px;
            font-family: inherit;
            font-size: 0.74rem;
            outline: none;
        }

        .hud-row input[type="text"]:focus,
        .hud-row select:focus {
            border-color: var(--crt-phosphor);
        }

        /* ==================== MOBILE ADAPTATION ==================== */
        @media (max-width: 860px) {
            header.hardware-shelf {
                padding: 8px 12px;
            }

            .brand-title {
                font-size: 0.78rem;
                letter-spacing: 1.4px;
            }

            .brand-sub {
                display: none;
            }

            .stage-wrapper {
                padding: 8px 8px 6px;
            }

            .screen-aperture {
                min-height: 58dvh;
            }

            .crt-header {
                font-size: 0.9rem;
                padding: 4px 10px;
            }

            #editor {
                font-size: 16px; /* Prevents iOS Safari auto-zoom on focus */
                padding: 14px;
            }

            .crt-footer {
                font-size: 0.62rem;
                padding: 4px 10px;
            }

            .hover-dock-wrapper {
                width: calc(100% - 14px);
                bottom: calc(8px + env(safe-area-inset-bottom));
            }

            .hover-dock {
                width: 100%;
                overflow-x: auto;
                overflow-y: hidden;
                -webkit-overflow-scrolling: touch;
                scrollbar-width: none;
                justify-content: flex-start;
                padding: 6px 12px;
                gap: 8px;

    <script>
        const editor = document.getElementById('editor');
        const crtAperture = document.getElementById('crt-aperture');
        const videoLayer = document.getElementById('video-layer');
        const videoPresetSelect = document.getElementById('video-preset-select');
        const customYtInput = document.getElementById('custom-yt-input');
        const saveStatus = document.getElementById('save-status');
        const statPage = document.getElementById('stat-page');
        const statLine = document.getElementById('stat-line');
        const statWords = document.getElementById('stat-words');
        const statChars = document.getElementById('stat-chars');
        const crtClock = document.getElementById('crt-clock');

        const STORAGE_KEY = 'BIRCH_V2_SCRIPT';
        const PREFS_KEY = 'BIRCH_V2_PREFS';
        const LIVE_IDS = new Set(['DB7oO82OeD4', '8TDmgVs6HZE', '7Ux4GeY5MXQ']);

        let videoEnabled = true;
        let lastActiveVideo = videoPresetSelect.value;
        let audioEnabled = false;
        let isBold = false;
        let isItalic = false;

        // ==================== STATUS & METRICS ====================
        function updateStatus() {
            const text = editor.value;
            const trimmed = text.trim();
            const words = trimmed ? trimmed.split(/\s+/).length : 0;
            const pages = Math.max(1, Math.ceil(words / 250));
            const pos = editor.selectionStart || 0;
            const lines = text.substring(0, pos).split('\n').length;

            statPage.textContent = pages;
            statLine.textContent = lines;
            statWords.textContent = words;
            statChars.textContent = text.length;
        }

        // ==================== URL HASH + LOCAL MEMORY ====================
        async function compressArticle(string) {
            if (!string) return '';
            const byteArray = new TextEncoder().encode(string);
            const stream = new CompressionStream('deflate-raw');
            const writer = stream.writable.getWriter();
            writer.write(byteArray);
            writer.close();
            const buffer = await new Response(stream.readable).arrayBuffer();
            return btoa(String.fromCharCode(...new Uint8Array(buffer)))
                .replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
        }

        async function decompressArticle(b64) {
            if (!b64) return '';
            const byteArray = Uint8Array.from(
                atob(b64.replace(/-/g, '+').replace(/_/g, '/')),
                c => c.charCodeAt(0)
            );
            const stream = new DecompressionStream('deflate-raw');
            const writer = stream.writable.getWriter();
            writer.write(byteArray);
            writer.close();
            const buffer = await new Response(stream.readable).arrayBuffer();
            return new TextDecoder().decode(buffer);
        }

        async function saveToMemory() {
            try {
                localStorage.setItem(STORAGE_KEY, editor.value);
                if ('CompressionStream' in window) {
                    const hash = editor.value ? '#' + await compressArticle(editor.value) : '';
                    if (location.hash !== hash) {
                        const target = window.location.pathname + window.location.search + hash;
                        history.replaceState({}, '', target);
                    }
                }
                saveStatus.textContent = 'MEMORY: SYNCED';
                saveStatus.style.color = 'var(--crt-phosphor)';
            } catch (e) {
                saveStatus.textContent = 'MEMORY: LOCAL';
            }
        }

        async function loadFromMemory() {
            try {
                if (location.hash && location.hash.length > 1 && 'DecompressionStream' in window) {
                    const text = await decompressArticle(location.hash.slice(1));
                    if (text !== undefined) {
                        editor.value = text;
                        updateStatus();
                        return;
                    }
                }
            } catch (e) {}

            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved !== null) {
                editor.value = saved;
            }
            updateStatus();
        }

        async function copyCompressedUrl() {
            await saveToMemory();
            try {
                await navigator.clipboard.writeText(window.location.href);
                const prev = saveStatus.textContent;
                saveStatus.textContent = 'URL COPIED';
                saveStatus.style.color = 'var(--crt-highlight)';
                playKeystrokeAudio(380, 0.05);
                setTimeout(() => {
                    saveStatus.textContent = prev;
                    saveStatus.style.color = 'var(--crt-phosphor)';
                }, 2000);
            } catch (e) {
                alert('Copy URL from your browser address bar.');
            }
        }

        let saveDebounce;
        function handleEditorInput() {
            saveStatus.textContent = 'SYNCING...';
            saveStatus.style.color = 'var(--crt-highlight)';
            clearTimeout(saveDebounce);
            saveDebounce = setTimeout(saveToMemory, 400);
            updateStatus();
            playKeystrokeAudio();
        }

        // ==================== SCRIPT UPLOAD (.TXT, .FOUNTAIN, .PDF) ====================
        async function extractPdfScript(file) {
            const buffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(buffer) }).promise;
            const pageTexts = [];

            for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                const page = await pdf.getPage(pageNum);
                const content = await page.getTextContent();

                const rows = [];
                content.items.forEach(item => {
                    if (!item.str) return;
                    const x = item.transform[4];
                    const y = item.transform[5];
                    const width = item.width || 0;

                    let row = rows.find(r => Math.abs(r.y - y) <= 3);
                    if (!row) {
                        row = { y, items: [] };
                        rows.push(row);
                    }
                    row.items.push({ str: item.str, x, endX: x + width });
                });

                rows.sort((a, b) => b.y - a.y);

                const lines = rows.map(row => {
                    row.items.sort((a, b) => a.x - b.x);
                    const firstX = row.items[0]?.x || 0;
                    const indent = firstX > 180 ? '                    '
                                 : firstX > 110 ? '        '
                                 : '';

                    let line = '';
                    let prevEnd = null;
                    row.items.forEach(it => {
                        if (prevEnd !== null && (it.x - prevEnd) > 2.5) {
                            line += ' ';
                        }
                        line += it.str;
                        prevEnd = it.endX;
                    });
                    return indent + line.trimEnd();
                });

                pageTexts.push(lines.join('\n'));
            }

            return pageTexts.join('\n\n');
        }

        async function uploadScript(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (editor.value.trim() && !confirm(`Import "${file.name}" and replace the current script?`)) {
                event.target.value = '';
                return;
            }

            const isPdf = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');

            try {
                if (isPdf) {
                    editor.value = await extractPdfScript(file);
                } else {
                    editor.value = await file.text();
                }
                updateStatus();
                saveToMemory();
                playKeystrokeAudio(400, 0.08);
            } catch (err) {
                console.error('Upload failed:', err);
                alert('Could not read that file. Scanned image-only PDFs require OCR first.');
            } finally {
                event.target.value = '';
            }
        }

        function newScript() {
            if (confirm('Start a new script? This will erase your current work.')) {
                editor.value = '';
                updateStatus();
                saveToMemory();
                editor.focus();
            }
        }

        // ==================== MOBILE-SAFE BLOB DOWNLOAD & EXPORTS ====================
        function downloadBlob(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.style.display = 'none';
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 1500);
        }

        function exportText(ext = 'txt') {
            if (!editor.value.trim() && !confirm(`Script is empty. Export a blank .${ext} file anyway?`)) {
                return;
            }
            const blob = new Blob([editor.value], { type: 'text/plain;charset=utf-8' });
            downloadBlob(blob, `screenplay.${ext}`);
            playKeystrokeAudio(300, 0.05);
        }

        function exportPDF() {
            if (!editor.value.trim() && !confirm('Script is empty. Export a blank PDF anyway?')) {
                return;
            }
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const lines = editor.value.split('\n');
            let y = 20;

            doc.setFont('Courier');
            doc.setFontSize(12);

            lines.forEach(line => {
                const wrapped = doc.splitTextToSize(line || ' ', 170);
                wrapped.forEach(wLine => {
                    if (y > 280) {
                        doc.addPage();
                        y = 20;
                    }
                    doc.text(wLine, 20, y);
                    y += 5;
                });
            });

            const pdfBlob = doc.output('blob');
            downloadBlob(pdfBlob, 'screenplay.pdf');
            playKeystrokeAudio(320, 0.05);
        }

        // ==================== SCREENPLAY CUE INSERTER ====================
        function insertScriptElement(element, cursorOffset = null) {
            const start = editor.selectionStart;
            const end = editor.selectionEnd;
            const text = editor.value;
            const before = text.substring(0, start);
            const after = text.substring(end, text.length);
            editor.value = before + element + after;

            // Smart cursor placement
            if (cursorOffset !== null) {
                editor.selectionStart = editor.selectionEnd = start + cursorOffset;
            } else {
                editor.selectionStart = editor.selectionEnd = start + element.length;
            }
            editor.focus();
            handleEditorInput();
        }

        function insertSelectedElement() {
            const dropdown = document.getElementById('scriptElementDropdown');
            const val = dropdown.value;
            if (!val) return;

            const label = dropdown.options[dropdown.selectedIndex].text;

            // Professional screenplay formatting for core elements
            // cursorOffset places the caret where the writer should continue typing
            const customFormats = {
                // Scene openings
                int:               { text: 'INT. ',                              cursor: 5 },
                ext:               { text: 'EXT. ',                              cursor: 5 },
                scene_heading:     { text: '\nINT. LOCATION - DAY\n\n',          cursor: 6 },

                // Action & description
                action:            { text: '\n',                                 cursor: 1 },

                // Character / Dialogue block (most important for experienced writers)
                character:         { text: '\n\n                            CHARACTER\n', cursor: 32 },
                dialogue:          { text: '\n                  ',               cursor: 19 },
                parenthetical:     { text: '\n                      ()\n                  ', cursor: 24 },

                // Transitions (right-leaning feel)
                fade_in:           { text: 'FADE IN:\n\n',                       cursor: 9 },
                fade_out:          { text: '\n\nFADE OUT.\n',                    cursor: 12 },
                cut_to:            { text: '\n\nCUT TO:\n\n',                    cursor: 10 },
                dissolve_to:       { text: '\n\nDISSOLVE TO:\n\n',               cursor: 15 },
                smash_cut:         { text: '\n\nSMASH CUT TO:\n\n',              cursor: 16 },
                cut_to_black:      { text: '\n\nCUT TO BLACK.\n\n',              cursor: 16 },
                fade_to_black:     { text: '\n\nFADE TO BLACK.\n\n',             cursor: 17 },

                // Technical shortcuts
                sound_effect:      { text: 'SFX: ',                             cursor: 5 },
                special_effects:   { text: 'SFX: ',                             cursor: 5 },
                visual_effects:    { text: 'VFX: ',                             cursor: 5 },
                music:             { text: 'MUSIC: ',                           cursor: 7 },
                ambient_sound:     { text: 'AMBIENT: ',                         cursor: 9 },

                // Common shot types
                close_up:          { text: 'CLOSE UP - ',                       cursor: 11 },
                medium_shot:       { text: 'MEDIUM SHOT - ',                    cursor: 14 },
                long_shot:         { text: 'LONG SHOT - ',                      cursor: 12 },
                wide_shot:         { text: 'WIDE SHOT - ',                      cursor: 12 },
                point_of_view_shot:{ text: 'POV - ',                            cursor: 6 }
            };

            if (customFormats[val]) {
                const fmt = customFormats[val];
                insertScriptElement(fmt.text, fmt.cursor);
            } else {
                // Everything else keeps the original charm: [LABEL]
                insertScriptElement(`\n[${label.toUpperCase()}]\n`);
            }

            dropdown.selectedIndex = 0;
        }

        // ==================== TYPOGRAPHY & PHOSPHOR THEMES ====================
        function changeFont() {
            const fontSelect = document.getElementById('fontSelect');
            if (fontSelect) {
                document.documentElement.style.setProperty('--editor-font', fontSelect.value);
                savePrefs();
            }
        }

        function toggleBold() {
            isBold = !isBold;
            document.getElementById('btn-bold').classList.toggle('active', isBold);
            document.documentElement.style.setProperty('--editor-weight', isBold ? 'bold' : 'normal');
            savePrefs();
        }

        function toggleItalic() {
            isItalic = !isItalic;
            document.getElementById('btn-italic').classList.toggle('active', isItalic);
            document.documentElement.style.setProperty('--editor-style', isItalic ? 'italic' : 'normal');
            savePrefs();
        }

        function setPhosphorTheme(theme) {
            document.body.setAttribute('data-theme', theme);
            savePrefs();
        }

        // ==================== SWITCHABLE VIDEO DECK ====================
        function extractYouTubeId(val) {
            if (!val) return '';
            const m = val.trim().match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|shorts\/|live\/)|[?&]v=)([\w-]{11})/);
            if (m) return m[1];
            const cleaned = val.trim();
            return /^[a-zA-Z0-9_-]{11}$/.test(cleaned) ? cleaned : '';
        }

        function isDirectVideo(src) {
            return /\.(mp4|webm|ogg)(\?|$)/i.test(src) || src.includes('archive.org/download');
        }

        function renderVideoSource(idOrUrl) {
            videoLayer.innerHTML = '';
            if (!idOrUrl || idOrUrl === 'none') return;

            if (isDirectVideo(idOrUrl)) {
                const vid = document.createElement('video');
                vid.setAttribute('autoplay', '');
                vid.setAttribute('loop', '');
                vid.setAttribute('muted', '');
                vid.setAttribute('playsinline', '');
                vid.setAttribute('webkit-playsinline', '');
                vid.autoplay = true;
                vid.loop = true;
                vid.muted = true;
                vid.playsInline = true;
                vid.src = idOrUrl;
                vid.onwaiting = () => { saveStatus.textContent = 'VID: BUFFERING'; };
                vid.onplaying = () => { saveStatus.textContent = 'MEMORY: SYNCED'; };
                vid.onerror = () => { saveStatus.textContent = 'VID: OFFLINE'; };
                videoLayer.appendChild(vid);
                vid.play().catch(() => {});
                return;
            }

            const id = extractYouTubeId(idOrUrl) || idOrUrl;
            if (!/^[a-zA-Z0-9_-]{11}$/.test(id)) return;
            const isLive = LIVE_IDS.has(id);
            const params = isLive
                ? 'autoplay=1&mute=1&controls=0&playsinline=1&modestbranding=1&showinfo=0'
                : `autoplay=1&mute=1&controls=0&loop=1&playlist=${id}&playsinline=1&modestbranding=1&showinfo=0`;
            videoLayer.innerHTML = `<iframe src="https://www.youtube.com/embed/${id}?${params}" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
        }

        function toggleVideoBackground(forceState) {
            videoEnabled = (typeof forceState === 'boolean') ? forceState : !videoEnabled;
            const vLabel = document.getElementById('vbg-label');
            const vBtn = document.getElementById('vbg-toggle');

            if (videoEnabled) {
                const target = (videoPresetSelect.value === 'none') ? lastActiveVideo : (
                    videoPresetSelect.value === 'custom' ? customYtInput.value.trim() : videoPresetSelect.value
                );
                if (target && target !== 'none') {
                    if (videoPresetSelect.value === 'none') videoPresetSelect.value = lastActiveVideo;
                    renderVideoSource(target);
                }
                videoLayer.style.opacity = getComputedStyle(document.documentElement).getPropertyValue('--video-opacity');
                vLabel.textContent = 'ON';
                vLabel.style.color = 'var(--c-white)';
                vBtn.classList.add('active');
            } else {
                videoLayer.innerHTML = '';
                videoLayer.style.opacity = '0';
                vLabel.textContent = 'OFF';
                vLabel.style.color = 'var(--c-silver)';
                vBtn.classList.remove('active');
            }
            savePrefs();
        }

        function toggleVideoHUD(forceClose) {
            const hud = document.getElementById('video-hud');
            const btn = document.getElementById('deck-btn');
            const isOpen = forceClose === false ? false : !hud.classList.contains('show');
            hud.classList.toggle('show', isOpen);
            btn.classList.toggle('active', isOpen);
        }

        document.addEventListener('click', (e) => {
            const hud = document.getElementById('video-hud');
            const btn = document.getElementById('deck-btn');
            if (hud.classList.contains('show') && !hud.contains(e.target) && !btn.contains(e.target)) {
                toggleVideoHUD(false);
            }
        });

        function applyVideoPreset(val) {
            const customRow = document.getElementById('custom-vid-row');
            if (val === 'custom') {
                customRow.style.display = 'flex';
                customYtInput.focus();
                return;
            }
            customRow.style.display = 'none';
            if (val === 'none') {
                toggleVideoBackground(false);
                return;
            }
            lastActiveVideo = val;
            renderVideoSource(val);
            toggleVideoBackground(true);
            savePrefs();
        }

        function setCustomVideo(val) {
            const clean = (val || '').trim();
            if (!clean) return;
            lastActiveVideo = clean;
            renderVideoSource(clean);
            toggleVideoBackground(true);
            savePrefs();
        }

        function setVideoOpacity(val) {
            document.getElementById('val-vopacity').textContent = val + '%';
            const op = (val / 100).toFixed(2);
            document.documentElement.style.setProperty('--video-opacity', op);
            if (videoEnabled) {
                videoLayer.style.opacity = op;
            }
            savePrefs();
        }

        function setVideoContrast(val) {
            document.getElementById('val-vcontrast').textContent = val + '%';
            document.documentElement.style.setProperty('--video-contrast', (val / 100).toFixed(2));
            savePrefs();
        }

        // ==================== SOLENOID KEYSTROKE AUDIO ====================
        let audioCtx = null;
        function toggleAudioFeedback() {
            audioEnabled = !audioEnabled;
            const lbl = document.getElementById('audio-label');
            const btn = document.getElementById('audio-toggle');
            lbl.textContent = audioEnabled ? 'ON' : 'OFF';
            lbl.style.color = audioEnabled ? 'var(--c-white)' : 'var(--c-silver)';
            btn.classList.toggle('active', audioEnabled);
            if (audioEnabled) playKeystrokeAudio(240, 0.04);
        }

        function playKeystrokeAudio(freq = 140, duration = 0.032) {
            if (!audioEnabled) return;
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq + Math.random() * 50, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + duration);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration + 0.005);
            } catch (e) {}
        }

        // ==================== PREFERENCES PERSISTENCE ====================
        function savePrefs() {
            try {
                const prefs = {
                    font: document.getElementById('fontSelect').value,
                    theme: document.getElementById('themeSelect').value,
                    bold: isBold,
                    italic: isItalic,
                    videoEnabled,
                    opacity: document.getElementById('vid-opacity').value,
                    contrast: document.getElementById('vid-contrast').value,
                    preset: videoPresetSelect.value,
                    customYt: customYtInput.value,
                    lastActiveVideo
                };
                localStorage.setItem(PREFS_KEY, JSON.stringify(prefs));
            } catch (e) {}
        }

        function loadPrefs() {
            try {
                const raw = localStorage.getItem(PREFS_KEY);
                if (!raw) {
                    renderVideoSource(videoPresetSelect.value);
                    return;
                }
                const p = JSON.parse(raw);

                if (p.font) {
                    document.getElementById('fontSelect').value = p.font;
                    document.documentElement.style.setProperty('--editor-font', p.font);
                }
                if (p.theme) {
                    document.getElementById('themeSelect').value = p.theme;
                    document.body.setAttribute('data-theme', p.theme);
                }
                if (p.bold) toggleBold();
                if (p.italic) toggleItalic();
                if (p.opacity) {
                    document.getElementById('vid-opacity').value = p.opacity;
                    setVideoOpacity(p.opacity);
                }
                if (p.contrast) {
                    document.getElementById('vid-contrast').value = p.contrast;
                    setVideoContrast(p.contrast);
                }
                if (p.lastActiveVideo) {
                    lastActiveVideo = p.lastActiveVideo;
                }
                if (p.preset) {
                    videoPresetSelect.value = p.preset;
                    if (p.preset === 'custom') {
                        document.getElementById('custom-vid-row').style.display = 'flex';
                        customYtInput.value = p.customYt || '';
                    }
                }

                const shouldEnable = typeof p.videoEnabled === 'boolean' ? p.videoEnabled : true;
                if (shouldEnable && videoPresetSelect.value !== 'none') {
                    const src = videoPresetSelect.value === 'custom' ? customYtInput.value.trim() : videoPresetSelect.value;
                    if (src) renderVideoSource(src);
                    toggleVideoBackground(true);
                } else {
                    toggleVideoBackground(false);
                }
            } catch (e) {
                renderVideoSource(videoPresetSelect.value);
            }
        }

        // ==================== KEYBOARD INTERACTIONS ====================
        editor.addEventListener('keydown', function (e) {
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = this.selectionStart;
                const end = this.selectionEnd;
                this.value = this.value.substring(0, start) + '    ' + this.value.substring(end);
                this.selectionStart = this.selectionEnd = start + 4;
                handleEditorInput();
                return;
            }

            if (typeof gsap !== 'undefined') {
                if (e.key === 'Enter') {
                    gsap.fromTo(crtAperture, { y: 2 }, { y: 0, duration: 0.16, ease: 'power2.out' });
                } else if (e.key.length === 1) {
                    const rx = (Math.random() - 0.5) * 0.8;
                    const ry = (Math.random() - 0.5) * 0.8;
                    gsap.fromTo(crtAperture, { x: rx, y: ry }, { x: 0, y: 0, duration: 0.04 });
                }
            }
        });

        editor.addEventListener('keyup', updateStatus);
        editor.addEventListener('click', updateStatus);

        function startClock() {
            function tick() {
                const d = new Date();
                crtClock.textContent = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}:${String(d.getSeconds()).padStart(2, '0')}`;
            }
            tick();
            setInterval(tick, 1000);
        }

        // ==================== CRT LASER CURSOR TRAIL (DESKTOP MOUSE ONLY) ====================
        (function initPointerTrail() {
            const canvas = document.getElementById('trailCanvas');
            if (!canvas || !window.matchMedia('(hover: hover)').matches) return;
            const ctx = canvas.getContext('2d');
            let W, H, dpr;
            const pts = [];
            const LIFE = 340;

            function resize() {
                dpr = window.devicePixelRatio || 1;
                W = window.innerWidth;
                H = window.innerHeight;
                canvas.width = W * dpr;
                canvas.height = H * dpr;
                ctx.resetTransform();
                ctx.scale(dpr, dpr);
            }
            resize();
            window.addEventListener('resize', resize);
            window.addEventListener('pointermove', (e) => {
                if (e.pointerType && e.pointerType !== 'mouse') return;
                pts.push({ x: e.clientX, y: e.clientY, t: performance.now() });
            });

            function render() {
                requestAnimationFrame(render);
                const now = performance.now();
                while (pts.length && now - pts[0].t > LIFE) pts.shift();

                ctx.clearRect(0, 0, W, H);
                if (pts.length < 2) return;

                const rgb = getComputedStyle(document.body).getPropertyValue('--trail-rgb').trim() || '228, 238, 248';
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';

                for (let i = 1; i < pts.length; i++) {
                    const progress = (now - pts[i].t) / LIFE;
                    const alpha = Math.max(0, Math.min(1, (1 - progress) * 1.1));
                    ctx.strokeStyle = `rgba(${rgb}, ${alpha.toFixed(3)})`;
                    ctx.shadowColor = `rgba(${rgb}, 0.7)`;
                    ctx.shadowBlur = 4;
                    ctx.lineWidth = 1.3;

                    ctx.beginPath();
                    ctx.moveTo(pts[i - 1].x, pts[i - 1].y);
                    ctx.lineTo(pts[i].x, pts[i].y);
                    ctx.stroke();
                }
            }
            render();
        })();

        // ==================== INIT ====================
        window.addEventListener('DOMContentLoaded', () => {
            loadPrefs();
            loadFromMemory();
            startClock();
            if (window.matchMedia('(hover: hover)').matches) {
                setTimeout(() => editor.focus(), 100);
            }
        });
    </script>
</body>
