    <style>
        :root {
            --red: #ff0033;
            --black: #0a0a0a;
        }

        ::selection {
            background: var(--red);
            color: var(--black);
            text-shadow: none;
        }

        /* === BASE STYLES & LINK RESETS === */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Courier New', monospace;
            background: #000;
            color: #fff;
            overflow-x: hidden;
        }

        a, a:visited {
            color: #fff;
            text-decoration: none;
        }

        /* === LOGO STYLES (Upper Left) === */
        .logo-section-wrapper {
            width: 300px; 
            display: block;
            cursor: pointer;
        }
        
        svg.inkrealm-logo {
            width: 100%;
            height: auto;
            overflow: visible;
        }

        .logo-text-pink { 
            fill: #ff0000 !important; 
            transition: all 0.2s ease;
        }
        
        .logo-text-grey { 
            fill: #ffffff !important; 
            transition: all 0.2s ease;
        }
        
        .visual-dot {
            fill: #ff0000 !important; 
            pointer-events: none; 
        }

        .logo-section-wrapper:hover .visual-dot { 
            animation: dot-overload 0.6s infinite linear; 
        }
        
        .logo-section-wrapper:hover .logo-text-grey { 
            animation: text-shock 0.15s infinite alternate; 
        }
        
        .logo-section-wrapper:hover .logo-text-pink { 
            animation: text-shock 0.15s infinite alternate-reverse; 
        }

        @keyframes dot-overload {
            0% { transform: scale(1.0) rotate(0deg); filter: drop-shadow(0 0 5px #ff0000); }
            50% { transform: scale(0.8) rotate(180deg); filter: drop-shadow(0 0 25px #ffffff); }
            100% { transform: scale(1.0) rotate(360deg); filter: drop-shadow(0 0 5px #ff0000); }
        }

        @keyframes text-shock {
            0% { transform: translate(0, 0); }
            25% { transform: translate(-2px, 1px); }
            50% { transform: translate(2px, -2px); }
            100% { transform: translate(0, 0); }
        }

        /* === VIDEO BACKGROUND === */
        .video-background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            overflow: hidden;
        }
        
        .background-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%) contrast(120%) brightness(0.8);
            opacity: 0.7;
        }
        
        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: -1;
            mix-blend-mode: multiply;
        }

        /* === NAVIGATION & DROPDOWN === */
        .navigation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px 40px;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #333;
            box-sizing: border-box;
        }

        .navigation__wrapper {
            display: flex;
            list-style: none;
            gap: 30px;
            margin: 0;
            padding: 0;
        }

        .navigation__item {
            position: relative; /* Keeps dropdown anchored to button */
        }

        .navigation__item-link--collection {
            background: none;
            border: 1px solid #333;
            color: #fff;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
            padding: 10px 20px;
        }

        .navigation__item-link--collection:hover {
            color: #ff0000;
            border-color: #ff0000;
            text-shadow: 0 0 10px #ff0000;
        }

        .dropdown-menu {
            position: absolute;
            top: 100%;
            right: 0; /* Drops down aligned to right side */
            background: #111;
            border: 1px solid #333;
            min-width: 200px;
            z-index: 999;
            padding: 10px 0;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }

        .dropdown-menu a,
        .dropdown-menu a:visited {
            display: block;
            padding: 12px 24px;
            color: #ffffff !important;
            text-decoration: none !important;
            font-size: 14px;
            transition: all 0.2s;
            border-left: 3px solid transparent;
        }

        .dropdown-menu a:hover {
            background: #222;
            color: #ff0000 !important;
            border-left: 3px solid #ff0000;
            padding-left: 30px;
        }

        /* === ORB STYLES (Content Area) === */
        .orb-container {
            display: inline-block;
            vertical-align: middle;
            margin-bottom: 20px;
            width: 50px;
            height: 50px;
        }

        .glitch-orb {
            width: 100%;
            height: 100%;
            fill: none;
            stroke-width: 3;
            overflow: visible;
        }

        .orb-circle { stroke: #ff0000; }
        .orb-triangle { stroke: #ffffff; }

        .orb-container svg {
            animation: slow-spin 10s linear infinite;
            filter: drop-shadow(0 0 5px rgba(255, 0, 0, 0.4));
            transition: all 0.2s ease;
        }

        .orb-container:hover svg {
            animation: glitch-shake 0.3s cubic-bezier(.25, .46, .45, .94) both infinite;
            filter: drop-shadow(2px 2px 0px rgba(255, 255, 255, 0.5)) 
                    drop-shadow(-2px -2px 0px rgba(255, 0, 0, 0.8));
        }

        @keyframes slow-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes glitch-shake {
            0% { transform: translate(0) rotate(0deg); }
            20% { transform: translate(-2px, 2px) rotate(-5deg); }
            40% { transform: translate(-2px, -2px) rotate(5deg); }
            60% { transform: translate(2px, 2px) rotate(-5deg); }
            80% { transform: translate(2px, -2px) rotate(5deg); }
            100% { transform: translate(0) rotate(0deg); }
        }

        /* === MAIN CONTENT === */
        main {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 120px 40px 140px;
            box-sizing: border-box;
        }

        .content-wrapper {
            max-width: 800px;
            background: rgba(0, 0, 0, 0.4);
            padding: 40px;
            border: 1px solid #333;
            backdrop-filter: blur(3px);
            text-align: center;
        }

        /* === FOOTER === */
        .footer-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 40px;
            background: rgba(0, 0, 0, 0.9);
            border-top: 1px solid #333;
            z-index: 100;
            box-sizing: border-box;

        .footer-left {
            display: flex;

            gap: 20px;

        .footer-right {

        .footer-video {
            width: 180px;

            transition: all 0.3s;
        }

        .footer-video:hover {

        .copyright-text {
            font-size: 12px;

            text-transform: uppercase;
            letter-spacing: 2px;

            line-height: 1.5;

        .anchor-star {
            width: 80px;

            animation: slow-spin 20s linear infinite;

        .anchor-star:hover {
            filter: drop-shadow(0 0 15px #ff0033) grayscale(0%);
            animation: glitch-shake 0.3s cubic-bezier(.25, .46, .45, .94) both infinite;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .footer-container {
                flex-direction: column;
                gap: 15px;
                padding: 10px 20px;
            }
        }
    </style>
</head>
